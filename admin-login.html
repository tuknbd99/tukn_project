<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন লগইন | TUKNBD</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { font-family: 'Noto Sans Bengali', sans-serif; }
        body { background: linear-gradient(135deg, #0d2b1f 0%, #1e3a2f 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-container { background: white; border-radius: 28px; max-width: 480px; width: 100%; padding: 40px 35px; box-shadow: 0 25px 60px rgba(0,0,0,0.5); }
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header .logo { width: 80px; height: 80px; background: #059669; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 35px; color: white; }
        .login-header h1 { font-size: 24px; font-weight: 700; color: #1f2937; }
        .login-header p { font-size: 14px; color: #6b7280; }
        .role-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .role-option { padding: 14px; border: 2px solid #e5e7eb; border-radius: 14px; text-align: center; cursor: pointer; transition: all 0.3s ease; background: white; }
        .role-option:hover { border-color: #059669; background: #f0fdf4; }
        .role-option.active { border-color: #059669; background: #ecfdf5; box-shadow: 0 0 0 4px rgba(5,150,105,0.15); }
        .role-option i { font-size: 28px; display: block; margin-bottom: 8px; }
        .role-option .role-title { font-weight: 600; font-size: 15px; color: #1f2937; }
        .role-option .role-desc { font-size: 11px; color: #6b7280; }
        .role-super { color: #8b5cf6; }
        .role-admin { color: #3b82f6; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; color: #374151; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 15px; transition: all 0.3s; background: #f9fafb; box-sizing: border-box; }
        .form-group input:focus { border-color: #059669; background: white; outline: none; box-shadow: 0 0 0 4px rgba(5,150,105,0.1); }
        
        .password-wrapper { position: relative; width: 100%; }
        .password-wrapper input { width: 100%; padding: 12px 50px 12px 16px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 15px; transition: all 0.3s; background: #f9fafb; box-sizing: border-box; }
        .password-wrapper input:focus { border-color: #059669; background: white; outline: none; box-shadow: 0 0 0 4px rgba(5,150,105,0.1); }
        .toggle-password-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #9ca3af; font-size: 16px; padding: 8px; transition: color 0.3s; z-index: 3; display: flex; align-items: center; justify-content: center; }
        .toggle-password-btn:hover { color: #059669; }
        
        .login-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #059669, #047857); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(5,150,105,0.3); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .error-msg { background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 10px; font-size: 13px; display: none; margin-bottom: 15px; }
        .footer-text { text-align: center; margin-top: 20px; font-size: 12px; color: #9ca3af; }
        .footer-text a { color: #059669; text-decoration: none; }
        .loading-spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { to { rotate: 360deg; } }
        .toast { position: fixed; bottom: 24px; right: 24px; padding: 14px 24px; border-radius: 10px; color: white; z-index: 99999; animation: slideIn 0.3s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.2); font-weight: 600; max-width: 400px; }
        .toast-success { background: #059669; }
        .toast-error { background: #dc2626; }
        .toast-info { background: #3b82f6; }
        .toast-warning { background: #f59e0b; }
        @keyframes slideIn { from { opacity:0; transform: translateX(40px); } to { opacity:1; transform: translateX(0); } }
        
        .caps-warning { font-size: 11px; color: #f59e0b; margin-top: 4px; display: none; }
        .caps-warning.show { display: block; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo"><i class="fas fa-shield-alt"></i></div>
            <h1>অ্যাডমিন লগইন</h1>
            <p>ত্বলাবা-উলামা কল্যাণ নেটওয়ার্ক</p>
        </div>

        <div id="errorMsg" class="error-msg"><i class="fas fa-exclamation-circle mr-2"></i><span id="errorText">ত্রুটি!</span></div>

        <div class="role-selector">
            <div class="role-option active" data-role="super_admin" onclick="selectRole('super_admin')">
                <i class="fas fa-crown role-super"></i>
                <div class="role-title">👑 সুপার অ্যাডমিন</div>
                <div class="role-desc">সম্পূর্ণ নিয়ন্ত্রণ</div>
            </div>
            <div class="role-option" data-role="admin" onclick="selectRole('admin')">
                <i class="fas fa-user-shield role-admin"></i>
                <div class="role-title">🛡️ অ্যাডমিন</div>
                <div class="role-desc">সীমিত অ্যাক্সেস</div>
            </div>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label><i class="fas fa-user mr-2"></i>ইউজারনেম</label>
                <input type="text" id="username" placeholder="ইউজারনেম দিন" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-lock mr-2"></i>পাসওয়ার্ড</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="পাসওয়ার্ড দিন" required autocomplete="current-password">
                    <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility()" title="পাসওয়ার্ড দেখুন">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
                <div class="caps-warning" id="capsWarning">
                    <i class="fas fa-exclamation-triangle mr-1"></i> Caps Lock চালু আছে!
                </div>
            </div>
            
            <button type="submit" class="login-btn" id="loginBtn"><i class="fas fa-sign-in-alt mr-2"></i>লগইন করুন</button>
        </form>

        <div class="footer-text">
            <p>🔒 নিরাপদ লগইন | <a href="../index.html">মূল পৃষ্ঠায় ফিরুন</a></p>
        </div>
    </div>

    <script>
        // ============================================================
        // 🔥 SUPABASE কনফিগারেশন
        // ============================================================
        const SUPABASE_URL = 'https://bffomfsffrtfgxyetzvm.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_A0BluIVwJ4M3Zd3JWpBoPg_NJSRu81D';
        let selectedRole = 'super_admin';
        let supabaseClient = null;
        let failedAttempts = 0;

        // ============================================================
        // ✅ সম্পূর্ণ Permissions (সব ফিচার)
        // ============================================================
        const ALL_PERMISSIONS = {
            dashboard: true, adminMessages: true, report: true,
            statement: true, allTransactions: true, masterLedger: true,
            bookOrders: true, bookManagement: true, bookPayments: true,
            invoiceGenerator: true, bookSalesReport: true, bookRequests: true,
            bookConfig: true, allWithdrawals: true, allLoansGiven: true,
            balanceAdjustment: true, ledger: true, members: true,
            pendingMembers: true, deletedMembers: true, memberDetails: true,
            memberTransfer: true, branches: true, branchView: true,
            branchReport: true, branchAdmins: true, branchAdminPermission: true,
            pendingPayments: true, pendingWithdrawals: true, rejectedPayments: true,
            directDeposit: true, directWithdrawal: true, pendingDirectApprovals: true,
            pendingLoans: true, pendingLoanPayments: true, loanCollection: true,
            loanForm: true, loanManagement: true, savingsLoanReport: true,
            savingsDue: true, reps: true, applications: true,
            pendingApplications: true, products: true, profitDistribution: true,
            welfareFund: true, economy: true, admins: true,
            slider: true, notices: true, leadership: true,
            about: true, complaints: true, settings: true,
            career: true, events: true, allTables: true,
            auditLogs: true, backup: true
        };

        // ============================================================
        // 🔥 SUPABASE ক্লায়েন্ট ইনিশিয়ালাইজ
        // ============================================================
        function initSupabase() {
            if (supabaseClient) return supabaseClient;
            try {
                if (typeof supabase !== 'undefined' && supabase.createClient) {
                    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                        auth: {
                            persistSession: false,
                            autoRefreshToken: false,
                            detectSessionInUrl: false
                        }
                    });
                    console.log('✅ Supabase client initialized');
                    return supabaseClient;
                }
                return null;
            } catch(e) {
                console.error('❌ Supabase init error:', e);
                return null;
            }
        }

        // ============================================================
        // ✅ চোখের আইকন টগল
        // ============================================================
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (!passwordInput || !eyeIcon) return;
            
            const currentType = passwordInput.getAttribute('type');
            const newType = currentType === 'password' ? 'text' : 'password';
            
            passwordInput.setAttribute('type', newType);
            
            if (newType === 'password') {
                eyeIcon.className = 'fas fa-eye';
            } else {
                eyeIcon.className = 'fas fa-eye-slash';
            }
            
            console.log('👁️ Password type:', newType);
        }

        // ============================================================
        // ✅ Caps Lock ডিটেকশন
        // ============================================================
        function detectCapsLock(e) {
            const capsWarning = document.getElementById('capsWarning');
            if (!capsWarning) return;
            
            const isCapsOn = e.getModifierState && e.getModifierState('CapsLock');
            if (isCapsOn) {
                capsWarning.classList.add('show');
            } else {
                capsWarning.classList.remove('show');
            }
        }

        // ============================================================
        // 🔥 রোল সিলেক্ট
        // ============================================================
        function selectRole(role) {
            selectedRole = role;
            document.querySelectorAll('.role-option').forEach(el => el.classList.remove('active'));
            document.querySelector(`.role-option[data-role="${role}"]`).classList.add('active');
            document.getElementById('errorMsg').style.display = 'none';
        }

        // ============================================================
        // 🔥 টোস্ট নোটিফিকেশন
        // ============================================================
        function showToast(message, type = 'success') {
            const oldToasts = document.querySelectorAll('.toast');
            oldToasts.forEach(t => t.remove());
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'toast-success' : 
                            type === 'error' ? 'toast-error' : 
                            type === 'warning' ? 'toast-warning' : 'toast-info';
            const icon = type === 'success' ? 'fa-check-circle' : 
                         type === 'error' ? 'fa-exclamation-circle' : 
                         type === 'warning' ? 'fa-exclamation-triangle' : 'fa-info-circle';
            toast.className = `toast ${bgClass}`;
            toast.innerHTML = `<i class="fas ${icon} mr-2"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // ============================================================
        // 🔥 লগইন হ্যান্ডলার — RPC-BASED (RLS-SAFE)
        // ============================================================
        async function handleLogin(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const loginBtn = document.getElementById('loginBtn');

            errorMsg.style.display = 'none';

            if (!username || !password) {
                errorText.textContent = 'ইউজারনেম ও পাসওয়ার্ড দিন!';
                errorMsg.style.display = 'block';
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading-spinner"></span> লগইন হচ্ছে...';

            try {
                const client = initSupabase();
                if (!client) {
                    errorText.textContent = '❌ Supabase সংযোগ সমস্যা!';
                    errorMsg.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>লগইন করুন';
                    return;
                }

                // ✅ RPC-based login (RLS-safe)
                console.log('🔐 Calling RPC verify_admin_login...');
                
                const { data, error } = await client.rpc(
                    'verify_admin_login',
                    {
                        p_username: username,
                        p_password: password
                    }
                );

                if (error) {
                    console.error('❌ RPC error:', error);
                    errorText.textContent = '❌ ডেটাবেস ত্রুটি: ' + error.message;
                    errorMsg.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>লগইন করুন';
                    return;
                }

                // ✅ data[0] check (RPC returns array)
                const admin = data && data[0];

                // ✅ ভুল তথ্য — failed attempts বাড়ান
                if (!admin || admin.is_valid !== true) {
                    failedAttempts++;
                    console.log(`❌ Failed attempt #${failedAttempts}`);
                    
                    errorText.textContent = '❌ ইউজারনেম বা পাসওয়ার্ড ভুল!';
                    errorMsg.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>লগইন করুন';
                    
                    // ✅ 3 বার ভুল হলে auto-refresh
                    if (failedAttempts >= 3) {
                        showToast('⚠️ ৩ বার ভুল! ৫ সেকেন্ড পর পেজ রিফ্রেশ হবে...', 'warning');
                        
                        let countdown = 5;
                        const countdownToast = setInterval(() => {
                            countdown--;
                            if (countdown > 0) {
                                showToast(`🔄 ${countdown} সেকেন্ড পর পেজ রিফ্রেশ হবে...`, 'warning');
                            }
                        }, 1000);
                        
                        setTimeout(() => {
                            clearInterval(countdownToast);
                            window.location.reload();
                        }, 5000);
                    }
                    return;
                }

                const isSuper = admin.role === 'super_admin';

                // ✅ Role check
                if (selectedRole === 'super_admin' && !isSuper) {
                    errorText.textContent = '❌ এই অ্যাকাউন্ট সুপার অ্যাডমিন নয়!';
                    errorMsg.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>লগইন করুন';
                    return;
                }

                if (selectedRole === 'admin' && admin.role !== 'admin' && !isSuper) {
                    errorText.textContent = '❌ এই অ্যাকাউন্ট অ্যাডমিন নয়!';
                    errorMsg.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>লগইন করুন';
                    return;
                }

                // ✅ সফল — failed attempts reset
                failedAttempts = 0;

                // ✅ Permissions (RPC থেকে আসা + Super admin এর জন্য সব)
                let permissions = admin.permissions || {};
                
                if (isSuper) {
                    permissions = { ...ALL_PERMISSIONS };
                    console.log('👑 সুপার অ্যাডমিন: সমস্ত পারমিশন সক্রিয়');
                }

                // ✅ Admin session তৈরি
                const adminData = {
                    id: admin.id,
                    username: admin.username,
                    name: admin.full_name || admin.username,
                    full_name: admin.full_name || admin.username,
                    role: admin.role,
                    status: admin.status,
                    permissions: permissions,
                    admin_uuid: admin.admin_uuid,
                    login_time: new Date().toISOString(),
                    login_type: 'admin'
                };

                // ✅ Session save
                localStorage.setItem('currentAdmin', JSON.stringify(adminData));
                sessionStorage.setItem('currentAdmin', JSON.stringify(adminData));

                const roleLabel = isSuper ? 'সুপার অ্যাডমিন' : 'অ্যাডমিন';
                const permCount = Object.keys(permissions).filter(k => permissions[k] === true).length;
                
                console.log('✅ Login success:', adminData.username, `(${permCount} permissions)`);
                showToast(`✅ স্বাগতম ${adminData.full_name}! (${roleLabel} - ${permCount}টি পারমিশন)`, 'success');

                setTimeout(() => {
                    window.location.replace('admin-panel.html');
                }, 1200);

            } catch (err) {
                console.error('❌ Login error:', err);
                errorText.textContent = '❌ লগইন করতে সমস্যা!';
                errorMsg.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>লগইন করুন';
            }
        }

        // ============================================================
        // 🔥 পারমিশন চেক
        // ============================================================
        function hasPermission(permissionName) {
            try {
                const adminData = JSON.parse(localStorage.getItem('currentAdmin') || sessionStorage.getItem('currentAdmin'));
                if (!adminData) return false;
                if (adminData.role === 'super_admin') return true;
                return adminData.permissions && adminData.permissions[permissionName] === true;
            } catch(e) {
                return false;
            }
        }

        // ============================================================
        // 🔥 পেজ লোড
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 অ্যাডমিন লগইন পেজ লোড হচ্ছে...');
            console.log('✅ RPC-based login (RLS-safe)');
            
            initSupabase();
            
            const pwdField = document.getElementById('password');
            const userField = document.getElementById('username');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (userField) userField.value = '';
            if (pwdField) {
                pwdField.value = '';
                pwdField.setAttribute('type', 'password');
            }
            if (eyeIcon) eyeIcon.className = 'fas fa-eye';
            
            if (pwdField) {
                pwdField.addEventListener('keyup', detectCapsLock);
                pwdField.addEventListener('keydown', detectCapsLock);
            }
            
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    const errMsg = document.getElementById('errorMsg');
                    if (errMsg) errMsg.style.display = 'none';
                }
            });
        });

        // ============================================================
        // 🔥 কীবোর্ড সাপোর্ট
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const pwdField = document.getElementById('password');
            const userField = document.getElementById('username');
            const form = document.getElementById('loginForm');
            
            if (pwdField && form) {
                pwdField.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
                    }
                });
            }
            
            if (userField && pwdField) {
                userField.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        pwdField.focus();
                    }
                });
            }
        });

        // ============================================================
        // 🔥 গ্লোবাল এক্সপোজ
        // ============================================================
        window.selectRole = selectRole;
        window.handleLogin = handleLogin;
        window.initSupabase = initSupabase;
        window.showToast = showToast;
        window.hasPermission = hasPermission;
        window.togglePasswordVisibility = togglePasswordVisibility;

        console.log('✅ অ্যাডমিন লগইন পেজ রেডি! (RPC-based)');
    </script>
</body>
</html>
