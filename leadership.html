<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>পরিচালনা পরিষদ | TUKNBD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans Bengali', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            min-height: 100vh;
            padding: 30px 15px;
        }
        
        .preview-container {
            max-width: 820px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            overflow: hidden;
        }
        
        .lang-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            z-index: 10;
        }
        
        .lang-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: #fcd34d;
            transform: scale(1.05);
        }
        
        .lang-toggle-btn i { font-size: 16px; color: #fcd34d; }
        
        .leadership-modal-header {
            background: linear-gradient(135deg, #064e3b, #059669);
            color: white;
            padding: 30px 25px 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .leadership-modal-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(252, 211, 77, 0.15) 0%, transparent 70%);
            animation: rotateGlow 20s linear infinite;
        }
        
        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .leadership-modal-header > * { position: relative; z-index: 1; }
        
        .leadership-modal-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 32px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .leadership-modal-header h2 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 6px;
        }
        
        .leadership-modal-header p {
            font-size: 13px;
            opacity: 0.9;
        }
        
        .leadership-filter-bar {
            display: flex;
            gap: 8px;
            padding: 15px 22px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            overflow-x: auto;
            white-space: nowrap;
        }
        
        .leadership-filter-bar::-webkit-scrollbar { height: 4px; }
        .leadership-filter-bar::-webkit-scrollbar-thumb { background: #059669; border-radius: 10px; }
        
        .leadership-filter-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 50px;
            background: #f3f4f6;
            color: #4b5563;
            border: 1.5px solid #e5e7eb;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            flex-shrink: 0;
        }
        
        .leadership-filter-btn:hover {
            background: #ecfdf5;
            border-color: #059669;
            color: #047857;
        }
        
        .leadership-filter-btn.active {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            border-color: #059669;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
        }
        
        .leadership-filter-btn i { font-size: 11px; }
        
        .leadership-list {
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            background: #f8fafc;
        }
        
        .leader-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
            position: relative;
        }
        
        .leader-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #059669, #10b981, #fcd34d);
        }
        
        .leader-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px -10px rgba(5, 150, 105, 0.25);
            border-color: #a7f3d0;
        }
        
        .leader-card-header {
            display: flex;
            align-items: flex-start;
            gap: 18px;
            padding: 22px;
            background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
            position: relative;
            overflow: hidden;
        }
        
        .leader-branch-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            box-shadow: 0 3px 8px rgba(59, 130, 246, 0.35);
            z-index: 2;
            text-transform: uppercase;
        }
        
        .leader-branch-badge i { font-size: 9px; }
        
        .leader-photo-wrapper {
            position: relative;
            flex-shrink: 0;
            width: 96px;
            height: 120px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            border: 3px solid white;
            transition: all 0.4s ease;
            background: #e5e7eb;
        }
        
        .leader-card:hover .leader-photo-wrapper {
            transform: scale(1.05);
            border-color: #fcd34d;
        }
        
        .leader-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .leader-photo-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #059669, #10b981);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
            font-weight: 800;
        }
        
        .leader-info {
            flex: 1;
            min-width: 0;
            padding-right: 8px;
            padding-top: 4px;
        }
        
        .leader-name-box {
            display: inline-block;
            background: linear-gradient(135deg, #ffffff, #f8fafc);
            padding: 6px 14px;
            border-radius: 10px;
            margin-bottom: 8px;
            box-shadow: 
                0 3px 10px rgba(5, 150, 105, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 1);
            border-left: 3px solid #059669;
        }
        
        .leader-name {
            font-size: 18px;
            font-weight: 800;
            color: #064e3b;
            line-height: 1.35;
            word-break: break-word;
        }
        
        .leader-name-en {
            font-size: 12px;
            color: #6b7280;
            font-style: italic;
            margin-bottom: 8px;
        }
        
        .leader-meta-info {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }
        
        .leader-meta-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10.5px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(5, 150, 105, 0.15);
            color: #4b5563;
        }
        
        .leader-meta-item.member-id {
            background: linear-gradient(135deg, #faf5ff, #ede9fe);
            border-color: rgba(139, 92, 246, 0.2);
            color: #5b21b6;
            font-family: 'Courier New', monospace;
        }
        
        .leader-designation {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 11.5px;
            font-weight: 700;
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            box-shadow: 0 3px 8px rgba(5, 150, 105, 0.25);
            margin-bottom: 6px;
        }
        
        .leader-bio {
            font-size: 11.5px;
            color: #6b7280;
            margin-top: 6px;
            line-height: 1.5;
        }
        
        .leader-message {
            padding: 0;
            background: white;
            display: flex;
            align-items: stretch;
        }
        
        .leader-message-bar {
            width: 5px;
            background: linear-gradient(180deg, #059669, #10b981, #fcd34d);
            flex-shrink: 0;
        }
        
        .leader-message-content {
            flex: 1;
            padding: 20px 22px;
            background: linear-gradient(135deg, #fafbfc, #f8fafc);
        }
        
        .leader-message-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 12px;
            border-radius: 50px;
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            color: #047857;
            font-size: 10px;
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        
        .leader-message-text {
            font-size: 14px;
            line-height: 1.85;
            color: #1f2937;
            font-weight: 500;
        }
        
        .leader-message-text::before {
            content: '❝';
            color: #10b981;
            font-size: 20px;
            margin-right: 2px;
            vertical-align: -3px;
        }
        
        .leader-message-text::after {
            content: '❞';
            color: #10b981;
            font-size: 20px;
            margin-left: 2px;
            vertical-align: -3px;
        }
        
        .leader-contact-bar {
            padding: 14px 22px;
            background: linear-gradient(135deg, #f9fafb, #f0fdf4);
            border-top: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .leader-contact-icons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .leader-icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            position: relative;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }
        
        .leader-icon-btn:hover {
            transform: translateY(-3px) scale(1.1);
        }
        
        .leader-icon-btn.phone { background: linear-gradient(135deg, #059669, #10b981); }
        .leader-icon-btn.email { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .leader-icon-btn.fb { background: linear-gradient(135deg, #1877f2, #0c5bd8); }
        .leader-icon-btn.wa { background: linear-gradient(135deg, #25d366, #128c7e); }
        .leader-icon-btn.tg { background: linear-gradient(135deg, #0088cc, #006699); }
        
        .loading-state {
            text-align: center;
            padding: 80px 20px;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid #e5e7eb;
            border-top-color: #059669;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .loading-state p {
            margin-top: 15px;
            color: #059669;
            font-weight: 600;
        }
        
        .empty-state {
            text-align: center;
            padding: 80px 30px;
            background: white;
            border-radius: 16px;
        }
        
        .empty-state i {
            font-size: 60px;
            color: #d1d5db;
            margin-bottom: 20px;
            display: block;
        }
        
        .empty-state h3 {
            font-size: 20px;
            color: #374151;
            margin-bottom: 10px;
        }
        
        .empty-state p {
            color: #6b7280;
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            body { padding: 15px 10px; }
            .preview-container { border-radius: 16px; }
            .leadership-modal-header { padding: 25px 20px 20px; }
            .leadership-modal-header h2 { font-size: 22px; }
            .leadership-list { padding: 15px; gap: 18px; }
            
            .leader-card-header {
                padding: 18px 16px;
                gap: 14px;
                flex-direction: column;
                align-items: stretch;
            }
            
            .leader-branch-badge {
                position: static;
                margin-bottom: 10px;
                align-self: flex-start;
                order: -1;
            }
            
            .leader-photo-wrapper {
                width: 80px;
                height: 100px;
                align-self: center;
            }
            
            .leader-photo-placeholder { font-size: 32px; }
            .leader-info { padding-right: 0; text-align: center; }
            .leader-name { font-size: 16px; }
            .leader-meta-info { justify-content: center; }
            .leader-message-content { padding: 16px 18px; }
            .leader-message-text { font-size: 13px; }
            .leader-contact-bar { padding: 14px 16px; flex-direction: column; }
            .leader-contact-icons { justify-content: center; gap: 10px; }
            .leader-icon-btn { width: 42px; height: 42px; }
        }
    </style>
</head>
<body>

<!-- Home Button -->
<a href="index.html" 
   style="position: fixed; top: 20px; left: 20px; 
          z-index: 9999;
          display: inline-flex; align-items: center; gap: 8px;
          padding: 10px 18px; border-radius: 50px;
          background: linear-gradient(135deg, #064e3b, #059669);
          border: 2px solid rgba(255, 255, 255, 0.3);
          color: white; font-size: 13px; font-weight: 700;
          text-decoration: none; font-family: inherit;
          box-shadow: 0 4px 15px rgba(0,0,0,0.25);">
    <i class="fas fa-arrow-left"></i>
    <span>হোমে ফিরে যান</span>
</a>

<div class="preview-container">
    
    <button class="lang-toggle-btn" id="langToggle" onclick="toggleLanguage()">
        <i class="fas fa-globe"></i>
        <span id="langLabel">English</span>
    </button>
    
    <div class="leadership-modal-header">
        <div class="leadership-modal-icon">
            <i class="fas fa-user-tie"></i>
        </div>
        <h2 data-bn="পরিচালনা পরিষদ" data-en="Leadership Council">পরিচালনা পরিষদ</h2>
        <p data-bn="যাঁরা দায়িত্বশীলতার সাথে সংগঠন পরিচালনা করছেন" data-en="Those who lead with responsibility">যাঁরা দায়িত্বশীলতার সাথে সংগঠন পরিচালনা করছেন</p>
    </div>
    
    <div class="leadership-filter-bar" id="filterBar">
        <button class="leadership-filter-btn active" onclick="filterByBranch('all', this)">
            <i class="fas fa-globe"></i> <span data-bn="সব" data-en="All">সব</span>
        </button>
    </div>
    
    <div class="leadership-list" id="leadersList">
        <div class="loading-state">
            <div class="loading-spinner"></div>
            <p>তথ্য লোড হচ্ছে...</p>
        </div>
    </div>
    
</div>

<script>
// ============================================================
// SUPABASE CONFIG
// ============================================================
var SUPABASE_URL = 'https://bffomfsffrtfgxyetzvm.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_A0BluIVwJ4M3Zd3JWpBoPg_NJSRu81D';

var sb = null;
try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    console.log('✅ Supabase client created');
} catch(e) {
    console.error('❌ Supabase init error:', e);
}

var allLeaders = [];
var currentLang = 'bn';
var currentBranchFilter = 'all';

// ============================================================
// LANGUAGE TOGGLE
// ============================================================
function applyLanguage(lang) {
    currentLang = lang;
    var elements = document.querySelectorAll('[data-bn][data-en]');
    elements.forEach(function(el) {
        var text = el.getAttribute('data-' + lang);
        if (text) el.textContent = text;
    });
    document.documentElement.lang = lang === 'bn' ? 'bn' : 'en';
    var label = document.getElementById('langLabel');
    if (label) label.textContent = lang === 'bn' ? 'English' : 'বাংলা';
    try { localStorage.setItem('tukn_lang', lang); } catch(e) {}
    var btn = document.getElementById('langToggle');
    if (btn) {
        btn.style.animation = 'none';
        setTimeout(function() { btn.style.animation = ''; }, 10);
    }
}

function toggleLanguage() {
    var lang = localStorage.getItem('tukn_lang') || 'bn';
    applyLanguage(lang === 'bn' ? 'en' : 'bn');
}

// ============================================================
// LOAD LEADERS FROM SUPABASE
// ============================================================
async function loadLeaders() {
    var container = document.getElementById('leadersList');
    if (!container) return;
    
    container.innerHTML = '<div class="loading-state"><div class="loading-spinner"></div><p>তথ্য লোড হচ্ছে...</p></div>';
    
    if (!sb) {
        container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle" style="color:#ef4444;"></i><h3>সংযোগ সমস্যা</h3><p>Supabase client load হয়নি</p></div>';
        return;
    }
    
    try {
        console.log('🔍 Loading leaders from Supabase...');
        
        var result = await sb
            .from('leadership')
            .select('*')
            .eq('is_active', true)
            .order('display_order', { ascending: true });
        
        if (result.error) throw result.error;
        
        allLeaders = result.data || [];
        
        console.log('✅ Loaded ' + allLeaders.length + ' leaders');
        console.table(allLeaders.map(function(l) {
            return {
                name: l.name,
                designation: l.designation,
                branch: l.branch_name,
                has_photo: !!l.photo_url
            };
        }));
        
        updateBranchFilters();
        renderLeaders();
        
    } catch(e) {
        console.error('❌ Load error:', e);
        container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle" style="color:#ef4444;"></i><h3>লোড করতে সমস্যা</h3><p>' + (e.message || 'Unknown error') + '</p></div>';
    }
}

// ============================================================
// BRANCH FILTERS
// ============================================================
function updateBranchFilters() {
    var filterBar = document.getElementById('filterBar');
    if (!filterBar) return;
    
    // Get unique branches
    var branchMap = {};
    for (var i = 0; i < allLeaders.length; i++) {
        var b = allLeaders[i].branch_name;
        if (b && !branchMap[b]) {
            branchMap[b] = true;
        }
    }
    
    var branches = Object.keys(branchMap);
    
    var html = '<button class="leadership-filter-btn active" onclick="filterByBranch(\'all\', this)">' +
               '<i class="fas fa-globe"></i> <span data-bn="সব" data-en="All">' +
               (currentLang === 'bn' ? 'সব' : 'All') + '</span></button>';
    
    for (var j = 0; j < branches.length; j++) {
        var branch = branches[j];
        html += '<button class="leadership-filter-btn" onclick="filterByBranch(\'' + branch.replace(/'/g, "\\'") + '\', this)">' +
                '<i class="fas fa-map-marker-alt"></i> ' + branch + '</button>';
    }
    
    filterBar.innerHTML = html;
}

function filterByBranch(branch, btn) {
    currentBranchFilter = branch;
    
    // Update active button
    var allBtns = document.querySelectorAll('.leadership-filter-btn');
    allBtns.forEach(function(b) { b.classList.remove('active'); });
    if (btn) btn.classList.add('active');
    
    renderLeaders();
}

// ============================================================
// RENDER LEADERS
// ============================================================
function renderLeaders() {
    var container = document.getElementById('leadersList');
    if (!container) return;
    
    var filtered = allLeaders;
    if (currentBranchFilter !== 'all') {
        filtered = allLeaders.filter(function(l) {
            return l.branch_name === currentBranchFilter;
        });
    }
    
    if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state"><i class="fas fa-user-slash"></i><h3>কোনো পরিচালক নেই</h3><p>শীঘ্রই তথ্য যোগ করা হবে</p></div>';
        return;
    }
    
    var variants = ['', 'variant-blue', 'variant-purple', 'variant-amber'];
    var html = '';
    
    for (var i = 0; i < filtered.length; i++) {
        var leader = filtered[i];
        var variant = variants[i % variants.length];
        
        html += buildLeaderCard(leader, variant);
    }
    
    container.innerHTML = html;
    
    // Reapply language
    applyLanguage(currentLang);
}

// ============================================================
// BUILD LEADER CARD
// ============================================================
function buildLeaderCard(leader, variant) {
    var nameBn = leader.name || 'নাম নেই';
    var nameEn = leader.name_en || '';
    var desigBn = leader.designation || '';
    var desigEn = leader.designation_en || '';
    var icon = leader.designation_icon || '';
    var bioBn = leader.short_bio || '';
    var bioEn = leader.short_bio_en || '';
    var msgBn = leader.message || '';
    var msgEn = leader.message_en || '';
    var memberId = leader.member_id || '';
    var branchName = leader.branch_name || '';
    var photoUrl = leader.photo_url || '';
    
    var firstChar = nameBn.charAt(0);
    
    // Photo
    var photoHtml;
    if (photoUrl) {
        photoHtml = '<img src="' + photoUrl + '" alt="' + nameBn + '" class="leader-photo" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';"><div class="leader-photo-placeholder" style="display:none;">' + firstChar + '</div>';
    } else {
        photoHtml = '<div class="leader-photo-placeholder">' + firstChar + '</div>';
    }
    
    // Branch badge
    var branchHtml = '';
    if (branchName) {
        branchHtml = '<span class="leader-branch-badge"><i class="fas fa-map-marker-alt"></i> ' + branchName + '</span>';
    }
    
    // Member ID
    var idHtml = '';
    if (memberId) {
        idHtml = '<span class="leader-meta-item member-id"><i class="fas fa-id-badge"></i> ' + memberId + '</span>';
    }
    
    // English name
    var nameEnHtml = '';
    if (nameEn) {
        nameEnHtml = '<div class="leader-name-en">' + nameEn + '</div>';
    }
    
    // Designation
    var desigText = icon + ' ' + desigBn;
    var desigHtml = '<span class="leader-designation" data-bn="' + desigText.replace(/"/g, '&quot;') + '" data-en="' + (icon + ' ' + desigEn).replace(/"/g, '&quot;') + '">' + desigText + '</span>';
    
    // Bio
    var bioHtml = '';
    if (bioBn) {
        bioHtml = '<div class="leader-bio"><i class="fas fa-info-circle" style="color:#059669;font-size:11px;margin-right:4px;"></i><span data-bn="' + bioBn.replace(/"/g, '&quot;') + '" data-en="' + (bioEn || bioBn).replace(/"/g, '&quot;') + '">' + bioBn + '</span></div>';
    }
    
    // Message
    var messageHtml = '';
    if (msgBn) {
        messageHtml = 
            '<div class="leader-message">' +
                '<div class="leader-message-bar"></div>' +
                '<div class="leader-message-content">' +
                    '<div class="leader-message-label">' +
                        '<i class="fas fa-quote-left"></i> ' +
                        '<span data-bn="দায়িত্বশীলের বাণী" data-en="Leader\'s Message">দায়িত্বশীলের বাণী</span>' +
                    '</div>' +
                    '<div class="leader-message-text" data-bn="' + msgBn.replace(/"/g, '&quot;') + '" data-en="' + (msgEn || msgBn).replace(/"/g, '&quot;') + '">' + msgBn + '</div>' +
                '</div>' +
            '</div>';
    }
    
    // Contact buttons
    var contactHtml = '';
    if (leader.mobile) {
        contactHtml += '<a href="tel:' + leader.mobile + '" class="leader-icon-btn phone" title="Call"><i class="fas fa-phone-alt"></i></a>';
    }
    if (leader.email) {
        contactHtml += '<a href="mailto:' + leader.email + '" class="leader-icon-btn email" title="Email"><i class="fas fa-envelope"></i></a>';
    }
    if (leader.facebook_url) {
        contactHtml += '<a href="' + leader.facebook_url + '" target="_blank" class="leader-icon-btn fb" title="Facebook"><i class="fab fa-facebook-f"></i></a>';
    }
    if (leader.whatsapp_url) {
        contactHtml += '<a href="' + leader.whatsapp_url + '" target="_blank" class="leader-icon-btn wa" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>';
    }
    if (leader.telegram_url) {
        contactHtml += '<a href="' + leader.telegram_url + '" target="_blank" class="leader-icon-btn tg" title="Telegram"><i class="fas fa-telegram-plane"></i></a>';
    }
    
    var contactBar = '';
    if (contactHtml) {
        contactBar = '<div class="leader-contact-bar"><div class="leader-contact-icons">' + contactHtml + '</div></div>';
    }
    
    // Build card
    return '<div class="leader-card ' + variant + '">' +
        '<div class="leader-card-header">' +
            branchHtml +
            '<div class="leader-photo-wrapper">' + photoHtml + '</div>' +
            '<div class="leader-info">' +
                '<div class="leader-name-box">' +
                    '<h3 class="leader-name" data-bn="' + nameBn.replace(/"/g, '&quot;') + '" data-en="' + (nameEn || nameBn).replace(/"/g, '&quot;') + '">' + nameBn + '</h3>' +
                '</div>' +
                nameEnHtml +
                '<div class="leader-meta-info">' + idHtml + '</div>' +
                desigHtml +
                bioHtml +
            '</div>' +
        '</div>' +
        messageHtml +
        contactBar +
    '</div>';
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    console.log('📄 leadership.html loaded');
    
    // Apply saved language
    var savedLang = 'bn';
    try { savedLang = localStorage.getItem('tukn_lang') || 'bn'; } catch(e) {}
    applyLanguage(savedLang);
    
    // Load leaders
    loadLeaders();
    
    // Realtime sync
    if (sb) {
        try {
            sb.channel('public-leadership-sync')
                .on('postgres_changes', 
                    { event: '*', schema: 'public', table: 'leadership' },
                    function(payload) {
                        console.log('🔔 Leadership changed:', payload.eventType);
                        loadLeaders();
                    }
                )
                .subscribe(function(status) {
                    console.log('📡 Realtime:', status);
                });
        } catch(e) {
            console.warn('Realtime setup failed:', e);
        }
    }
    
    // Auto refresh every 30 seconds
    setInterval(loadLeaders, 30000);
});

console.log('✅ leadership.html ready');
</script>

</body>
</html>
