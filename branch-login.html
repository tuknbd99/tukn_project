<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ব্রাঞ্চ অ্যাডমিন লগইন | TUKNBD</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
    <style>
        * { font-family: 'Noto Sans Bengali', sans-serif; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #f0fdf4, #dcfce7); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px;
            margin: 0;
            position: relative;
        }
        .login-card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            border: 2px solid #059669;
            position: relative;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-card h2 { color: #064e3b; font-weight: 700; }
        .login-card input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
            background: #fafafa;
        }
        .login-card input:focus {
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5,150,105,0.15);
            outline: none;
            background: white;
        }
        .login-card input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 50px;
        }
        .password-wrapper .toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            padding: 8px;
            transition: color 0.3s;
            border-radius: 6px;
            z-index: 2;
        }
        .password-wrapper .toggle-btn:hover {
            color: #059669;
            background: rgba(5,150,105,0.05);
        }
        .login-btn {
            background: linear-gradient(135deg, #059669, #047857);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(5,150,105,0.3);
        }
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .login-btn .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-msg { 
            color: #dc2626; 
            font-size: 13px; 
            margin-top: 8px; 
            display: none; 
            background: #fef2f2;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #fecaca;
        }
        .success-msg { 
            color: #059669; 
            font-size: 13px; 
            margin-top: 8px; 
            display: none;
            background: #f0fdf4;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #bbf7d0;
        }
        .home-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center;
            margin-top: 12px;
            color: #059669;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
            padding: 10px;
            border-radius: 8px;
            font-weight: 500;
        }
        .home-link:hover { 
            background: rgba(5,150,105,0.08);
            transform: translateX(-3px);
        }
        .top-home-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: white;
            padding: 10px 18px;
            border-radius: 50px;
            text-decoration: none;
            color: #059669;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
            font-weight: 700;
            z-index: 1000;
            border: 2px solid #059669;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .top-home-btn:hover {
            background: #059669;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(5,150,105,0.3);
        }
        .version-info {
            text-align: center;
            margin-top: 12px;
            font-size: 11px;
            color: #9ca3af;
        }
        .input-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .input-label .required {
            color: #ef4444;
            font-size: 14px;
        }
        .forgot-password {
            color: #059669;
            font-size: 12px;
            text-decoration: none;
            margin-top: 4px;
            display: inline-block;
            cursor: pointer;
            font-weight: 600;
        }
        .forgot-password:hover {
            text-decoration: underline;
        }

        /* ============================================================ */
        /* 🔑 Reset Modal Styles                                        */
        /* ============================================================ */
        .reset-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-y: auto;
            animation: fadeIn 0.25s ease;
        }
        .reset-modal {
            background: white;
            border-radius: 20px;
            max-width: 460px;
            width: 100%;
            padding: 32px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 2px solid #f59e0b;
            position: relative;
            animation: modalIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9) translateY(-20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .reset-modal input {
            width: 100%;
            padding: 13px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            background: #fafafa;
            transition: all 0.3s;
            box-sizing: border-box;
        }
        .reset-modal input:focus {
            border-color: #f59e0b;
            background: white;
            outline: none;
            box-shadow: 0 0 0 3px rgba(245,158,11,0.15);
        }
        .reset-modal .code-input {
            text-align: center;
            font-family: monospace;
            letter-spacing: 8px;
            font-size: 22px !important;
            font-weight: 700 !important;
        }
        .reset-close-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            font-size: 26px;
            color: #9ca3af;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 8px;
            line-height: 1;
            transition: all 0.2s;
        }
        .reset-close-btn:hover {
            background: #fef2f2;
            color: #dc2626;
        }
        .reset-action-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .reset-action-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .reset-action-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .reset-btn-orange {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }
        .reset-btn-green {
            background: linear-gradient(135deg, #059669, #047857);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 25px;
                border-radius: 20px;
            }
            .top-home-btn {
                top: 12px;
                left: 12px;
                padding: 8px 14px;
                font-size: 12px;
            }
            .reset-modal {
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>

<a href="index.html" class="top-home-btn" title="মেইন পেজে ফিরুন">
    <i class="fas fa-home"></i> হোমে ফিরুন
</a>

<div class="login-card">
    <div class="text-center mb-6">
        <div class="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-emerald-100">
            <i class="fas fa-store text-emerald-600 text-3xl"></i>
        </div>
        <h2>🏢 ব্রাঞ্চ অ্যাডমিন</h2>
        <p class="text-gray-500 text-sm mt-1">আপনার ব্রাঞ্চের ড্যাশবোর্ডে লগইন করুন</p>
    </div>

    <form id="branchLoginForm" novalidate>
        <div class="mb-4">
            <div class="input-label">
                <label class="block text-sm font-medium text-gray-700">ইউজারনেম</label>
                <span class="required">*</span>
            </div>
            <input type="text" id="loginUsername" placeholder="ইউজারনেম লিখুন" required autofocus autocomplete="username">
        </div>
        <div class="mb-4">
            <div class="input-label">
                <label class="block text-sm font-medium text-gray-700">পাসওয়ার্ড</label>
                <span class="required">*</span>
            </div>
            <div class="password-wrapper">
                <input type="password" id="loginPassword" placeholder="পাসওয়ার্ড লিখুন" required autocomplete="current-password">
                <button type="button" class="toggle-btn" onclick="togglePassword()" aria-label="পাসওয়ার্ড দেখুন/লুকান" title="পাসওয়ার্ড দেখুন">
                    <i class="fas fa-eye" id="passwordToggleIcon"></i>
                </button>
            </div>
            <a class="forgot-password" onclick="showForgotPasswordMessage(event)">
                <i class="fas fa-key mr-1"></i>পাসওয়ার্ড ভুলে গেছেন?
            </a>
        </div>
        
        <div id="loginError" class="error-msg">
            <i class="fas fa-exclamation-circle mr-1"></i> 
            <span id="errorText">ভুল ইউজারনেম বা পাসওয়ার্ড!</span>
        </div>
        <div id="loginSuccess" class="success-msg">
            <i class="fas fa-check-circle mr-1"></i> 
            লগইন সফল! রিডাইরেক্ট হচ্ছে...
        </div>

        <button type="submit" id="loginBtn" class="login-btn mt-2">
            <i class="fas fa-sign-in-alt mr-2"></i> লগইন করুন
        </button>
    </form>

    <a href="index.html" class="home-link">
        <i class="fas fa-arrow-left mr-1"></i> মেইন পেজে ফিরে যান
    </a>
    
    <a href="branch-dashboard.html" class="home-link" style="color:#3b82f6; margin-top:4px;">
        <i class="fas fa-tachometer-alt mr-1"></i> ব্রাঞ্চ ড্যাশবোর্ডে যান
    </a>
    
    <div class="version-info">v3.0 (RPC + Recovery) | © 2025 TUKNBD</div>
</div>

<script>
// ============================================================
// 🔥 কনফিগারেশন
// ============================================================
const CONFIG = {
    SUPABASE_URL: 'https://bffomfsffrtfgxyetzvm.supabase.co',
    SUPABASE_ANON_KEY: 'sb_publishable_A0BluIVwJ4M3Zd3JWpBoPg_NJSRu81D',
    SESSION_KEY: 'tuknbd_branch_session',
    REDIRECT_URL: 'branch-dashboard.html',
    MAX_LOGIN_ATTEMPTS: 5,
    LOCKOUT_TIME: 15 * 60 * 1000,
    
    // ============================================================
    // 📧 EmailJS Configuration (আপনার নিজের keys বসান)
    // https://www.emailjs.com/ → Free account খুলুন
    // ============================================================
    EMAILJS_SERVICE_ID:  'service_xxxxxxx',   // ← আপনার Service ID
    EMAILJS_TEMPLATE_ID: 'template_xxxxxxx',  // ← আপনার Template ID
    EMAILJS_PUBLIC_KEY:  'YOUR_PUBLIC_KEY',   // ← আপনার Public Key
    EMAILJS_ENABLED: false                     // ← true করলে ইমেইল যাবে, false হলে console এ দেখাবে
};

// ============================================================
// 🔥 Supabase ক্লায়েন্ট — RLS-safe
// ============================================================
const supabaseClient = supabase.createClient(
    CONFIG.SUPABASE_URL,
    CONFIG.SUPABASE_ANON_KEY,
    {
        auth: {
            persistSession: false,
            autoRefreshToken: false,
            detectSessionInUrl: false
        }
    }
);

// ============================================================
// 📦 সেশন ম্যানেজার
// ============================================================
const SessionManager = {
    get() {
        try {
            const data = localStorage.getItem(CONFIG.SESSION_KEY);
            return data ? JSON.parse(data) : null;
        } catch { return null; }
    },
    set(data) {
        try {
            localStorage.setItem(CONFIG.SESSION_KEY, JSON.stringify(data));
            try { localStorage.setItem('currentBranchAdmin', JSON.stringify(data)); } catch(e) {}
            return true;
        } catch { return false; }
    },
    clear() {
        try {
            localStorage.removeItem(CONFIG.SESSION_KEY);
            localStorage.removeItem('currentBranchAdmin');
            return true;
        } catch { return false; }
    },
    isLoggedIn() {
        const session = this.get();
        return !!(session?.id && session?.username);
    }
};

// ============================================================
// 🔐 লগইন অ্যাটেম্প্ট ট্র্যাকার
// ============================================================
const LoginAttempts = {
    KEY: 'tuknbd_login_attempts',
    get() {
        try {
            const data = localStorage.getItem(this.KEY);
            return data ? JSON.parse(data) : { count: 0, locked_until: null };
        } catch { return { count: 0, locked_until: null }; }
    },
    set(data) {
        try { localStorage.setItem(this.KEY, JSON.stringify(data)); return true; }
        catch { return false; }
    },
    increment() {
        const attempts = this.get();
        attempts.count += 1;
        if (attempts.count >= CONFIG.MAX_LOGIN_ATTEMPTS) {
            attempts.locked_until = Date.now() + CONFIG.LOCKOUT_TIME;
        }
        this.set(attempts);
        return attempts;
    },
    reset() { this.set({ count: 0, locked_until: null }); },
    isLocked() {
        const attempts = this.get();
        if (!attempts.locked_until) return false;
        if (Date.now() > attempts.locked_until) { this.reset(); return false; }
        return true;
    },
    getRemainingLockTime() {
        const attempts = this.get();
        if (!attempts.locked_until) return 0;
        return Math.max(0, attempts.locked_until - Date.now());
    }
};

// ============================================================
// 👁️ পাসওয়ার্ড টগল
// ============================================================
function togglePassword() {
    const input = document.getElementById('loginPassword');
    const icon = document.getElementById('passwordToggleIcon');
    if (!input || !icon) return;
    
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
    }
}

// ============================================================
// 🎯 লগইন ফাংশন — RPC-BASED
// ============================================================
async function loginBranchAdmin() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    const errorEl = document.getElementById('loginError');
    const successEl = document.getElementById('loginSuccess');
    const btn = document.getElementById('loginBtn');
    const errorText = document.getElementById('errorText');

    errorEl.style.display = 'none';
    successEl.style.display = 'none';

    // Lockout Check
    if (LoginAttempts.isLocked()) {
        const remaining = Math.ceil(LoginAttempts.getRemainingLockTime() / 60000);
        errorText.textContent = `⚠️ অনেক চেষ্টা করেছেন! ${remaining} মিনিট পরে চেষ্টা করুন।`;
        errorEl.style.display = 'block';
        return;
    }

    // Validation
    if (!username || !password) {
        errorText.textContent = 'ইউজারনেম ও পাসওয়ার্ড দিন!';
        errorEl.style.display = 'block';
        return;
    }
    if (username.length < 3) {
        errorText.textContent = 'ইউজারনেম কমপক্ষে ৩ অক্ষর হতে হবে!';
        errorEl.style.display = 'block';
        return;
    }
    if (password.length < 4) {
        errorText.textContent = 'পাসওয়ার্ড কমপক্ষে ৪ অক্ষর হতে হবে!';
        errorEl.style.display = 'block';
        return;
    }

    // UI Lock
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> লগইন হচ্ছে...';
    document.getElementById('loginUsername').disabled = true;
    document.getElementById('loginPassword').disabled = true;

    try {
        console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
        console.log('🔐 RPC: verify_branch_admin_login');
        console.log('   👤 username:', username);
        console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');

        const { data, error } = await supabaseClient.rpc(
            'verify_branch_admin_login',
            { p_username: username, p_password: password }
        );

        if (error) {
            console.error('❌ RPC error:', error);
            errorText.textContent = `❌ সার্ভার ত্রুটি: ${error.message || 'আবার চেষ্টা করুন'}`;
            errorEl.style.display = 'block';
            LoginAttempts.increment();
            resetUI(btn);
            return;
        }

        const admin = data && data[0];

        if (!admin || admin.is_valid !== true) {
            console.log('❌ Invalid credentials');
            errorText.textContent = '❌ ভুল ইউজারনেম বা পাসওয়ার্ড!';
            errorEl.style.display = 'block';
            LoginAttempts.increment();
            resetUI(btn);
            
            if (LoginAttempts.isLocked()) {
                const remaining = Math.ceil(LoginAttempts.getRemainingLockTime() / 60000);
                errorText.textContent = `⚠️ অনেক ভুল চেষ্টা! ${remaining} মিনিট পরে চেষ্টা করুন।`;
            }
            return;
        }

        if (admin.status !== 'active') {
            console.log('⚠️ Status:', admin.status);
            errorText.textContent = admin.status === 'pending'
                ? '⏳ আপনার একাউন্ট অনুমোদনের অপেক্ষায়!'
                : '⏸️ আপনার একাউন্ট নিষ্ক্রিয়! অ্যাডমিনের সাথে যোগাযোগ করুন।';
            errorEl.style.display = 'block';
            LoginAttempts.increment();
            resetUI(btn);
            return;
        }

        console.log('✅ Login successful:', admin.username);
        console.log('   🏢 Branch:', admin.branch_name);

        // ✅ Optional: last_login update
        try {
            await supabaseClient
                .from('branch_admins')
                .update({ last_login: new Date().toISOString() })
                .eq('id', admin.id);
        } catch (updateErr) {
            console.warn('⚠️ last_login update skip:', updateErr.message);
        }

        // ✅ Session data
        const sessionData = {
            id: admin.id,
            username: admin.username,
            full_name: admin.full_name || admin.username,
            role: admin.role || 'branch_officer',
            status: admin.status,
            permissions: admin.permissions || {},
            branch_id: admin.branch_id || null,
            branch_name: admin.branch_name || 'ব্রাঞ্চ',
            branch_code: admin.branch_code || '',
            logged_in_at: new Date().toISOString(),
            session_id: 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6)
        };

        SessionManager.set(sessionData);
        LoginAttempts.reset();

        const permCount = Object.keys(sessionData.permissions).filter(k => sessionData.permissions[k] === true).length;
        successEl.style.display = 'block';
        successEl.innerHTML = `<i class="fas fa-check-circle mr-1"></i> স্বাগতম <b>${sessionData.full_name}</b>! (${permCount}টি পারমিশন) - রিডাইরেক্ট হচ্ছে...`;
        btn.innerHTML = '<i class="fas fa-check mr-2"></i> সফল!';

        console.log('📦 Session saved | 🎯 Redirect:', CONFIG.REDIRECT_URL);

        setTimeout(() => {
            window.location.href = CONFIG.REDIRECT_URL;
        }, 1200);

    } catch(e) {
        console.error('❌ Login error:', e);
        errorText.textContent = `❌ সমস্যা: ${e.message || 'সার্ভার সমস্যা!'}`;
        errorEl.style.display = 'block';
        LoginAttempts.increment();
        resetUI(btn);
    }
}

// ============================================================
// 📤 STEP 1: Reset code request
// ============================================================
async function requestPasswordReset() {
    const username = document.getElementById('resetUsername').value.trim();
    const email = document.getElementById('resetEmail').value.trim();
    const btn = document.getElementById('resetBtn1');
    
    document.getElementById('resetMsg1').style.display = 'none';
    
    // Validation
    if (!username) {
        showResetMsg('resetMsg1', '⚠️ ইউজারনেম দিন!', 'error');
        return;
    }
    if (!email) {
        showResetMsg('resetMsg1', '⚠️ ইমেইল দিন!', 'error');
        return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showResetMsg('resetMsg1', '⚠️ সঠিক ইমেইল দিন!', 'error');
        return;
    }
    
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> পাঠানো হচ্ছে...';
    
    try {
        console.log('🔑 RPC: request_password_reset');
        console.log('   username:', username);
        console.log('   email:', email);
        
        const { data, error } = await supabaseClient.rpc(
            'request_password_reset',
            { p_username: username, p_email: email }
        );
        
        if (error) throw error;
        
        const result = data && data[0];
        
        if (!result || result.success !== true) {
            showResetMsg('resetMsg1', result?.message || '❌ সমস্যা হয়েছে!', 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> রিসেট কোড পাঠান';
            return;
        }
        
        console.log('✅ Reset code generated');
        
        // ✅ ইমেইল পাঠান
        await sendResetCodeEmail(
            email, 
            result.admin_name, 
            result.reset_code,
            result.branch_name
        );
        
        // Step 2 দেখান
        document.getElementById('resetStep1').style.display = 'none';
        document.getElementById('resetStep2').style.display = 'block';
        document.getElementById('resetSubtitle').textContent = 'ইমেইলে আসা কোড দিয়ে পাসওয়ার্ড রিসেট করুন';
        
        showResetMsg('resetMsg2', 
            CONFIG.EMAILJS_ENABLED 
                ? `✅ ${email} এ কোড পাঠানো হয়েছে!` 
                : `⚠️ ডেমো মোড: কোড Console-এ দেখুন (F12 → Console)`, 
            CONFIG.EMAILJS_ENABLED ? 'success' : 'info'
        );
        
        // Code field এ focus
        setTimeout(() => {
            document.getElementById('resetCode')?.focus();
        }, 300);
        
    } catch(e) {
        console.error('❌ Reset request error:', e);
        showResetMsg('resetMsg1', `❌ সমস্যা: ${e.message || 'আবার চেষ্টা করুন'}`, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> রিসেট কোড পাঠান';
    }
}

// ============================================================
// 📧 EmailJS দিয়ে কোড পাঠান
// ============================================================
async function sendResetCodeEmail(email, adminName, code, branchName) {
    console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
    console.log('📧 Reset code email');
    console.log('   To:', email);
    console.log('   Name:', adminName);
    console.log('   Branch:', branchName);
    console.log('   Code:', code);
    console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
    
    if (!CONFIG.EMAILJS_ENABLED) {
        // ✅ ডেমো মোড — শুধু console এ দেখাবে
        console.log('');
        console.log('🔑 ═══════════════════════════════════');
        console.log('   🔑 রিসেট কোড (ডেমো):', code);
        console.log('   📧 প্রাপক:', email);
        console.log('   ⏰ মেয়াদ: ১৫ মিনিট');
        console.log('🔑 ═══════════════════════════════════');
        console.log('');
        return true;
    }
    
    // ✅ EmailJS API call
    try {
        const response = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                service_id: CONFIG.EMAILJS_SERVICE_ID,
                template_id: CONFIG.EMAILJS_TEMPLATE_ID,
                user_id: CONFIG.EMAILJS_PUBLIC_KEY,
                template_params: {
                    to_email: email,
                    to_name: adminName,
                    branch_name: branchName || 'ব্রাঞ্চ',
                    reset_code: code,
                    expiry_minutes: '15'
                }
            })
        });
        
        if (!response.ok) {
            const errText = await response.text();
            throw new Error(`Email send failed: ${errText}`);
        }
        
        console.log('✅ Email sent successfully');
        return true;
        
    } catch(err) {
        console.error('❌ Email send error:', err);
        // ✅ Email fail হলেও কোড console এ দেখান (fallback)
        console.log('🔑 Fallback code:', code);
        return false;
    }
}

// ============================================================
// 🔄 STEP 2: Reset password with code
// ============================================================
async function submitPasswordReset() {
    const username = document.getElementById('resetUsername').value.trim();
    const code = document.getElementById('resetCode').value.trim();
    const newPassword = document.getElementById('resetNewPassword').value.trim();
    const confirmPassword = document.getElementById('resetConfirmPassword').value.trim();
    const btn = document.getElementById('resetBtn2');
    
    document.getElementById('resetMsg2').style.display = 'none';
    
    // Validation
    if (!code || code.length !== 6) {
        showResetMsg('resetMsg2', '⚠️ ৬ ডিজিটের কোড দিন!', 'error');
        return;
    }
    if (!/^\d{6}$/.test(code)) {
        showResetMsg('resetMsg2', '⚠️ কোড শুধু ৬টি সংখ্যা হবে!', 'error');
        return;
    }
    if (!newPassword || newPassword.length < 4) {
        showResetMsg('resetMsg2', '⚠️ পাসওয়ার্ড কমপক্ষে ৪ অক্ষর হতে হবে!', 'error');
        return;
    }
    if (newPassword !== confirmPassword) {
        showResetMsg('resetMsg2', '⚠️ দুইটি পাসওয়ার্ড মিলছে না!', 'error');
        return;
    }
    
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> পরিবর্তন হচ্ছে...';
    
    try {
        console.log('🔄 RPC: reset_password_with_code');
        console.log('   username:', username);
        
        const { data, error } = await supabaseClient.rpc(
            'reset_password_with_code',
            {
                p_username: username,
                p_reset_code: code,
                p_new_password: newPassword
            }
        );
        
        if (error) throw error;
        
        const result = data && data[0];
        
        if (!result || result.success !== true) {
            showResetMsg('resetMsg2', '❌ ' + (result?.message || 'সমস্যা হয়েছে!'), 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check-circle"></i> পাসওয়ার্ড পরিবর্তন করুন';
            return;
        }
        
        // ✅ সফল
        console.log('✅ Password reset successful');
        showResetMsg('resetMsg2', '✅ ' + result.message, 'success');
        btn.innerHTML = '<i class="fas fa-check"></i> সফল!';
        
        // ✅ 2 সেকেন্ড পরে modal বন্ধ + login form এ focus
        setTimeout(() => {
            closeResetModal();
            
            // ইউজারনেম prefilled
            document.getElementById('loginUsername').value = username;
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginPassword').focus();
            
            // Success message
            const successEl = document.getElementById('loginSuccess');
            successEl.style.display = 'block';
            successEl.innerHTML = '✅ পাসওয়ার্ড পরিবর্তন সফল! নতুন পাসওয়ার্ড দিয়ে লগইন করুন।';
            
            setTimeout(() => {
                successEl.style.display = 'none';
            }, 6000);
            
            console.log('✅ Redirected to login form');
        }, 2000);
        
    } catch(e) {
        console.error('❌ Reset password error:', e);
        showResetMsg('resetMsg2', `❌ সমস্যা: ${e.message || 'আবার চেষ্টা করুন'}`, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check-circle"></i> পাসওয়ার্ড পরিবর্তন করুন';
    }
}

// ============================================================
// 💬 Reset message helper
// ============================================================
function showResetMsg(elementId, message, type) {
    const el = document.getElementById(elementId);
    if (!el) return;
    
    el.textContent = message;
    el.style.display = 'block';
    
    if (type === 'success') {
        el.style.background = '#ecfdf5';
        el.style.color = '#065f46';
        el.style.border = '1px solid #86efac';
    } else if (type === 'error') {
        el.style.background = '#fef2f2';
        el.style.color = '#991b1b';
        el.style.border = '1px solid #fecaca';
    } else if (type === 'info') {
        el.style.background = '#eff6ff';
        el.style.color = '#1e40af';
        el.style.border = '1px solid #bfdbfe';
    }
}

// ============================================================
// 📋 পেজ লোড
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    console.log('📄 ব্রাঞ্চ লগইন পেজ লোড হচ্ছে...');
    console.log('✅ RPC: verify_branch_admin_login');
    console.log('✅ Recovery: request_password_reset + reset_password_with_code');
    
    // আগের সেশন চেক
    if (SessionManager.isLoggedIn()) {
        const session = SessionManager.get();
        const loggedInAt = new Date(session.logged_in_at || new Date());
        const diff = (new Date() - loggedInAt) / 1000 / 60;
        
        if (diff < 30) {
            console.log('✅ Active session — redirecting...');
            window.location.href = CONFIG.REDIRECT_URL;
            return;
        } else {
            console.log('⏰ Session expired — clearing');
            SessionManager.clear();
        }
    }

    document.getElementById('loginUsername').focus();
    
    // Lockout check
    if (LoginAttempts.isLocked()) {
        const remaining = Math.ceil(LoginAttempts.getRemainingLockTime() / 60000);
        document.getElementById('errorText').textContent = `⚠️ অনেক চেষ্টা করেছেন! ${remaining} মিনিট পরে চেষ্টা করুন।`;
        document.getElementById('loginError').style.display = 'block';
        document.getElementById('loginBtn').disabled = true;
        
        setTimeout(() => {
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('loginBtn').disabled = false;
            LoginAttempts.reset();
        }, LoginAttempts.getRemainingLockTime() + 1000);
    }
    
    console.log('✅ ব্রাঞ্চ লগইন পেজ লোড সম্পূর্ণ!');
});
