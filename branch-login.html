<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ব্রাঞ্চ অ্যাডমিন লগইন | TUKNBD</title>
    <!-- ✅ Tailwind CSS production fix -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- ✅ Favicon fix -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
    <style>
        * { font-family: 'Noto Sans Bengali', sans-serif; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #f0fdf4, #dcfce7); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px;
            margin: 0;
        }
        .login-card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            border: 2px solid #059669;
            position: relative;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-card h2 { color: #064e3b; font-weight: 700; }
        .login-card input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
            background: #fafafa;
        }
        .login-card input:focus {
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5,150,105,0.15);
            outline: none;
            background: white;
        }
        .login-card input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .password-wrapper {
            position: relative;
        }
        .password-wrapper .toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            padding: 8px;
            transition: color 0.3s;
            border-radius: 6px;
        }
        .password-wrapper .toggle-btn:hover {
            color: #059669;
            background: rgba(5,150,105,0.05);
        }
        .login-btn {
            background: linear-gradient(135deg, #059669, #047857);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(5,150,105,0.3);
        }
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .login-btn .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-msg { 
            color: #dc2626; 
            font-size: 13px; 
            margin-top: 8px; 
            display: none; 
            background: #fef2f2;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #fecaca;
        }
        .success-msg { 
            color: #059669; 
            font-size: 13px; 
            margin-top: 8px; 
            display: none;
            background: #f0fdf4;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #bbf7d0;
        }
        .home-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #059669;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
            padding: 8px;
            border-radius: 8px;
        }
        .home-link:hover { 
            background: rgba(5,150,105,0.05);
            text-decoration: underline; 
        }
        .version-info {
            text-align: center;
            margin-top: 12px;
            font-size: 11px;
            color: #9ca3af;
        }
        .input-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .input-label .required {
            color: #ef4444;
            font-size: 14px;
        }
        .forgot-password {
            color: #059669;
            font-size: 12px;
            text-decoration: none;
            margin-top: 4px;
            display: inline-block;
        }
        .forgot-password:hover {
            text-decoration: underline;
        }
        .test-credentials {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 12px;
            font-size: 12px;
            color: #065f46;
            text-align: center;
        }
        .test-credentials code {
            background: #d1fae5;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            color: #065f46;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-6">
        <div class="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-emerald-100">
            <i class="fas fa-store text-emerald-600 text-3xl"></i>
        </div>
        <h2>🏢 ব্রাঞ্চ অ্যাডমিন</h2>
        <p class="text-gray-500 text-sm mt-1">আপনার ব্রাঞ্চের ড্যাশবোর্ডে লগইন করুন</p>
    </div>

    <form id="branchLoginForm" novalidate>
        <div class="mb-4">
            <div class="input-label">
                <label class="block text-sm font-medium text-gray-700">ইউজারনেম</label>
                <span class="required">*</span>
            </div>
            <input type="text" id="loginUsername" placeholder="ইউজারনেম লিখুন" required autofocus autocomplete="username" value="Enamul">
        </div>
        <div class="mb-4">
            <div class="input-label">
                <label class="block text-sm font-medium text-gray-700">পাসওয়ার্ড</label>
                <span class="required">*</span>
            </div>
            <div class="password-wrapper">
                <input type="password" id="loginPassword" placeholder="পাসওয়ার্ড লিখুন" required autocomplete="current-password" value="Enamul44">
                <button type="button" class="toggle-btn" onclick="togglePassword()" aria-label="পাসওয়ার্ড দেখুন/লুকান">
                    <i class="fas fa-eye" id="passwordToggleIcon"></i>
                </button>
            </div>
            <a href="#" class="forgot-password"><i class="fas fa-key mr-1"></i>পাসওয়ার্ড ভুলে গেছেন?</a>
        </div>
        
        <div id="loginError" class="error-msg">
            <i class="fas fa-exclamation-circle mr-1"></i> 
            <span id="errorText">ভুল ইউজারনেম বা পাসওয়ার্ড!</span>
        </div>
        <div id="loginSuccess" class="success-msg">
            <i class="fas fa-check-circle mr-1"></i> 
            লগইন সফল! রিডাইরেক্ট হচ্ছে...
        </div>

        <button type="submit" id="loginBtn" class="login-btn mt-2">
            <i class="fas fa-sign-in-alt mr-2"></i> লগইন করুন
        </button>
    </form>

    <div class="test-credentials">
        🔑 <strong>টেস্ট ক্রেডেনশিয়াল:</strong> <br>
        ইউজারনেম: <code>Enamul</code> | পাসওয়ার্ড: <code>Enamul44</code>
    </div>

    <a href="branch-dashboard.html" class="home-link">
        <i class="fas fa-arrow-left mr-1"></i> ড্যাশবোর্ডে ফিরে যান
    </a>
    <div class="version-info">v2.1 | © 2025 TUKNBD</div>
</div>

<script>
// ============================================================
// 🔥 কনফিগারেশন
// ============================================================
const CONFIG = {
    SUPABASE_URL: 'https://bffomfsffrtfgxyetzvm.supabase.co',
    SUPABASE_ANON_KEY: 'sb_publishable_A0BluIVwJ4M3Zd3JWpBoPg_NJSRu81D',
    SESSION_KEY: 'tuknbd_branch_session',
    REDIRECT_URL: 'branch-dashboard.html',
    MAX_LOGIN_ATTEMPTS: 5,
    LOCKOUT_TIME: 15 * 60 * 1000
};

// ============================================================
// 🔥 Supabase ক্লায়েন্ট
// ============================================================
const supabaseClient = supabase.createClient(
    CONFIG.SUPABASE_URL,
    CONFIG.SUPABASE_ANON_KEY
);

// ============================================================
// 📦 সেশন ম্যানেজার
// ============================================================
const SessionManager = {
    get() {
        try {
            const data = localStorage.getItem(CONFIG.SESSION_KEY);
            return data ? JSON.parse(data) : null;
        } catch {
            return null;
        }
    },
    set(data) {
        try {
            localStorage.setItem(CONFIG.SESSION_KEY, JSON.stringify(data));
            return true;
        } catch {
            return false;
        }
    },
    clear() {
        try {
            localStorage.removeItem(CONFIG.SESSION_KEY);
            return true;
        } catch {
            return false;
        }
    },
    has() {
        return !!this.get();
    },
    isLoggedIn() {
        const session = this.get();
        return !!(session?.id && session?.username);
    }
};

// ============================================================
// 🔐 লগইন অ্যাটেম্প্ট ট্র্যাকার
// ============================================================
const LoginAttempts = {
    get() {
        try {
            const data = localStorage.getItem('tuknbd_login_attempts');
            return data ? JSON.parse(data) : { count: 0, locked_until: null };
        } catch {
            return { count: 0, locked_until: null };
        }
    },
    set(data) {
        try {
            localStorage.setItem('tuknbd_login_attempts', JSON.stringify(data));
            return true;
        } catch {
            return false;
        }
    },
    increment() {
        const attempts = this.get();
        attempts.count += 1;
        if (attempts.count >= CONFIG.MAX_LOGIN_ATTEMPTS) {
            attempts.locked_until = Date.now() + CONFIG.LOCKOUT_TIME;
        }
        this.set(attempts);
        return attempts;
    },
    reset() {
        this.set({ count: 0, locked_until: null });
    },
    isLocked() {
        const attempts = this.get();
        if (!attempts.locked_until) return false;
        if (Date.now() > attempts.locked_until) {
            this.reset();
            return false;
        }
        return true;
    }
};

// ============================================================
// 👁️ পাসওয়ার্ড টগল
// ============================================================
function togglePassword() {
    const passwordInput = document.getElementById('loginPassword');
    const icon = document.getElementById('passwordToggleIcon');
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.className = 'fas fa-eye-slash';
    } else {
        passwordInput.type = 'password';
        icon.className = 'fas fa-eye';
    }
}

// ============================================================
// 🎯 লগইন ফাংশন - FIXED
// ============================================================
async function loginBranchAdmin() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    const errorEl = document.getElementById('loginError');
    const successEl = document.getElementById('loginSuccess');
    const btn = document.getElementById('loginBtn');
    const errorText = document.getElementById('errorText');

    // রিসেট UI
    errorEl.style.display = 'none';
    successEl.style.display = 'none';

    // চেক লকআউট
    if (LoginAttempts.isLocked()) {
        const remaining = Math.ceil(LoginAttempts.getRemainingLockTime() / 60000);
        errorText.textContent = `অনেক চেষ্টা করেছেন! ${remaining} মিনিট পরে চেষ্টা করুন।`;
        errorEl.style.display = 'block';
        return;
    }

    // ভ্যালিডেশন
    if (!username || !password) {
        errorText.textContent = 'ইউজারনেম ও পাসওয়ার্ড দিন!';
        errorEl.style.display = 'block';
        return;
    }

    if (username.length < 3) {
        errorText.textContent = 'ইউজারনেম কমপক্ষে ৩ অক্ষর হতে হবে!';
        errorEl.style.display = 'block';
        return;
    }

    if (password.length < 4) {
        errorText.textContent = 'পাসওয়ার্ড কমপক্ষে ৪ অক্ষর হতে হবে!';
        errorEl.style.display = 'block';
        return;
    }

    // UI লক
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> লগইন হচ্ছে...';
    document.getElementById('loginUsername').disabled = true;
    document.getElementById('loginPassword').disabled = true;

    try {
        // ✅ FIXED: শুধু branch_admins টেবিল থেকে ডেটা আনুন (branches JOIN বাদ)
        const { data, error } = await supabaseClient
            .from('branch_admins')
            .select('*')
            .eq('username', username)
            .eq('password', password)
            .maybeSingle();

        // এরর হ্যান্ডলিং
        if (error) {
            console.error('Supabase error:', error);
            errorText.textContent = `সার্ভার সমস্যা: ${error.message || 'আবার চেষ্টা করুন'}`;
            errorEl.style.display = 'block';
            LoginAttempts.increment();
            resetUI(btn);
            return;
        }

        // ইউজার চেক
        if (!data) {
            errorText.textContent = 'ভুল ইউজারনেম বা পাসওয়ার্ড!';
            errorEl.style.display = 'block';
            LoginAttempts.increment();
            resetUI(btn);
            
            if (LoginAttempts.isLocked()) {
                const remaining = Math.ceil(LoginAttempts.getRemainingLockTime() / 60000);
                errorText.textContent = `অনেক ভুল চেষ্টা! ${remaining} মিনিট পরে চেষ্টা করুন।`;
                errorEl.style.display = 'block';
            }
            return;
        }

        // স্ট্যাটাস চেক
        if (data.status !== 'active') {
            errorText.textContent = data.status === 'pending' 
                ? 'আপনার একাউন্ট অনুমোদনের অপেক্ষায়!'
                : 'আপনার একাউন্ট নিষ্ক্রিয়! অ্যাডমিনের সাথে যোগাযোগ করুন।';
            errorEl.style.display = 'block';
            LoginAttempts.increment();
            resetUI(btn);
            return;
        }

        // সফল লগইন - লাস্ট লগইন আপডেট
        await supabaseClient
            .from('branch_admins')
            .update({ 
                last_login: new Date().toISOString(),
                login_count: (data.login_count || 0) + 1
            })
            .eq('id', data.id);

        // সেশন ডেটা প্রস্তুত
        const sessionData = {
            id: data.id,
            username: data.username,
            full_name: data.full_name || data.username,
            email: data.email || '',
            phone: data.phone || '',
            role: data.role || 'branch_officer',
            permissions: data.permissions || {},
            branch_id: data.branch_id || null,
            branch_name: data.branch_name || 'ব্রাঞ্চ',
            branch_code: data.branch_code || '',
            status: data.status,
            login_count: (data.login_count || 0) + 1,
            last_login: new Date().toISOString(),
            logged_in_at: new Date().toISOString(),
            session_id: 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6)
        };

        // সেশন সংরক্ষণ
        SessionManager.set(sessionData);
        LoginAttempts.reset();

        // সাফল্য মেসেজ
        successEl.style.display = 'block';
        successEl.innerHTML = `<i class="fas fa-check-circle mr-1"></i> স্বাগতম ${sessionData.full_name}! রিডাইরেক্ট হচ্ছে...`;

        // রিডাইরেক্ট
        setTimeout(() => {
            window.location.href = CONFIG.REDIRECT_URL;
        }, 1200);

    } catch(e) {
        console.error('Login error:', e);
        errorText.textContent = 'সার্ভার সমস্যা! পরে চেষ্টা করুন।';
        errorEl.style.display = 'block';
        LoginAttempts.increment();
        resetUI(btn);
    }
}

// ============================================================
// 🔄 UI রিসেট ফাংশন
// ============================================================
function resetUI(btn) {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i> লগইন করুন';
    document.getElementById('loginUsername').disabled = false;
    document.getElementById('loginPassword').disabled = false;
}

// ============================================================
// 🚀 ইভেন্ট লিসেনার
// ============================================================
document.getElementById('branchLoginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    loginBranchAdmin();
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        const active = document.activeElement;
        if (active && (active.id === 'loginUsername' || active.id === 'loginPassword')) {
            e.preventDefault();
            loginBranchAdmin();
        }
    }
});

document.getElementById('loginUsername').addEventListener('focus', function() {
    document.getElementById('loginError').style.display = 'none';
});

document.getElementById('loginPassword').addEventListener('focus', function() {
    document.getElementById('loginError').style.display = 'none';
});

document.getElementById('loginUsername').addEventListener('input', function() {
    this.value = this.value.replace(/[^a-zA-Z0-9_@.]/g, '');
});

// ============================================================
// 📋 পেজ লোড
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    // ইতিমধ্যে লগইন থাকলে ড্যাশবোর্ডে পাঠান
    if (SessionManager.isLoggedIn()) {
        const session = SessionManager.get();
        const loggedInAt = new Date(session.logged_in_at || session.last_login);
        const now = new Date();
        const diff = (now - loggedInAt) / 1000 / 60;
        
        if (diff < 30) {
            window.location.href = CONFIG.REDIRECT_URL;
            return;
        } else {
            SessionManager.clear();
        }
    }

    document.getElementById('loginUsername').focus();
    
    if (LoginAttempts.isLocked()) {
        const remaining = Math.ceil(LoginAttempts.getRemainingLockTime() / 60000);
        document.getElementById('errorText').textContent = `অনেক চেষ্টা করেছেন! ${remaining} মিনিট পরে চেষ্টা করুন।`;
        document.getElementById('loginError').style.display = 'block';
        document.getElementById('loginBtn').disabled = true;
        
        setTimeout(() => {
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('loginBtn').disabled = false;
            LoginAttempts.reset();
        }, LoginAttempts.getRemainingLockTime() + 1000);
    }
});

console.log('✅ ব্রাঞ্চ লগইন পেজ লোড সম্পূর্ণ!');
</script>

</body>
</html>
