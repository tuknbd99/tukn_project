function formatAmount(amt) {
    if (typeof amt !== 'number' || isNaN(amt)) return '0.00';
    return amt.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function formatAmountWithText(amt) {
    return formatAmount(amt) + ' টাকা';
}

function formatCurrencyShort(amt) {
    return '৳' + formatAmount(amt);
}

function showToast(message, type = 'info') {
    document.querySelectorAll('.toast-notification').forEach(t => t.remove());
    
    const toast = document.createElement('div');
    toast.className = `toast-notification ${
        type === 'success' ? 'bg-emerald-600' : 
        type === 'error' ? 'bg-red-600' : 
        type === 'warning' ? 'bg-amber-600' : 
        'bg-blue-600'
    }`;
    
    const icons = {
        success: 'fa-check-circle',
        error: 'fa-exclamation-circle',
        warning: 'fa-exclamation-triangle',
        info: 'fa-info-circle'
    };
    
    toast.innerHTML = `<i class="fas ${icons[type] || icons.info} mr-2"></i>${message}`;
    document.body.appendChild(toast);
    
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
    }, 3500);
}

// ============================================================
// ✅ Supabase ক্লায়েন্ট
// ============================================================
function initSupabaseClient() {
    if (supabaseClient) return supabaseClient;
    if (supabaseInitialized) return supabaseClient;
    
    try {
        if (typeof supabase !== 'undefined' && supabase.createClient) {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    storageKey: 'tuknbd-auth-token'
                }
            });
            supabaseInitialized = true;
            console.log("✅ Supabase client initialized");
        }
    } catch(e) { 
        console.error("Supabase init error:", e); 
    }
    return supabaseClient;
}

// ✅ ডেমো ক্যালকুলেশন
// ============================================================
function updateDemoCalculation() {
    const profit = parseFloat(document.getElementById('bookProfitPercent')?.value) || 0;
    const service = parseFloat(document.getElementById('bookServicePercent')?.value) || 0;
    
    const sellingPrice = 1000;
    const discount = 10;
    const afterDiscount = sellingPrice - (sellingPrice * discount / 100);
    
    const profitAmount = afterDiscount * (profit / 100);
    const serviceAmount = afterDiscount * (service / 100);
    const total = afterDiscount + profitAmount + serviceAmount;
    
    const profitEl = document.getElementById('demoProfitAmount');
    const serviceEl = document.getElementById('demoServiceAmount');
    const totalEl = document.getElementById('demoTotalAmount');
    
    if (profitEl) profitEl.textContent = profitAmount.toFixed(0) + ' টাকা';
    if (serviceEl) serviceEl.textContent = serviceAmount.toFixed(0) + ' টাকা';
    if (totalEl) totalEl.textContent = total.toFixed(0) + ' টাকা';
}

// ✅ বুক কনফিগ ফাংশন
// ============================================================
async function loadBookConfig(showStatus = false) {
    const client = initSupabaseClient();
    if (!client) {
        showToast('সংযোগ সমস্যা!', 'error');
        return;
    }
    
    try {
        const { data, error } = await client
            .from('book_config')
            .select('*')
            .order('id', { ascending: false })
            .limit(1);
        
        if (!error && data && data.length > 0) {
            document.getElementById('bookProfitPercent').value = data[0].profit_percent || 10;
            document.getElementById('bookServicePercent').value = data[0].service_charge_percent || 5;
        } else {
            document.getElementById('bookProfitPercent').value = 10;
            document.getElementById('bookServicePercent').value = 5;
        }
        
        updateDemoCalculation();
        if (showStatus) {
            showToast('✅ কনফিগ লোড হয়েছে!', 'success');
        }
    } catch(e) {
        console.error('Load config error:', e);
        if (showStatus) {
            showToast('❌ কনফিগ লোড করতে সমস্যা!', 'error');
        }
    }
}

async function saveBookConfig() {
    const profit = parseFloat(document.getElementById('bookProfitPercent').value);
    const service = parseFloat(document.getElementById('bookServicePercent').value);
    
    if (isNaN(profit) || isNaN(service) || profit < 0 || service < 0) {
        showToast('দয়া করে সঠিক সংখ্যা দিন!', 'error');
        return;
    }
    
    const client = initSupabaseClient();
    if (!client) {
        showToast('সংযোগ সমস্যা!', 'error');
        return;
    }
    
    const btn = document.querySelector('[onclick="saveBookConfig()"]');
    const originalText = btn?.innerHTML || 'সংরক্ষণ';
    if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> সংরক্ষণ করা হচ্ছে...';
    }
    
    try {
        const { error } = await client
            .from('book_config')
            .insert([{
                profit_percent: profit,
                service_charge_percent: service,
                updated_at: new Date().toISOString(),
                updated_by: currentAdmin?.username || 'সুপার অ্যাডমিন'
            }]);
        
        if (error) throw error;
        
        const statusEl = document.getElementById('bookConfigStatus');
        if (statusEl) {
            statusEl.innerHTML = `
                <div class="text-emerald-600 font-semibold">
                    ✅ লাভাংশ ${profit}% ও সার্ভিস চার্জ ${service}% সংরক্ষিত!
                </div>
            `;
        }
        
        showToast('✅ গ্লোবাল কনফিগ সংরক্ষিত হয়েছে!', 'success');
        
    } catch(e) {
        console.error('Save config error:', e);
        const statusEl = document.getElementById('bookConfigStatus');
        if (statusEl) {
            statusEl.innerHTML = `
                <div class="text-red-600 font-semibold">
                    ❌ সংরক্ষণ ব্যর্থ: ${e.message || 'অজানা ত্রুটি'}
                </div>
            `;
        }
        showToast('❌ সংরক্ষণ ব্যর্থ!', 'error');
    } finally {
        if (btn) {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }
}

// 3. exportWithdrawalsExcel - উইথড্রয়াল এক্সপোর্ট
function exportWithdrawalsExcel() {
    const table = document.querySelector('#allWithdrawalsContainer table');
    if (!table) { 
        showToast('কোনো ডেটা নেই!', 'error'); 
        return; 
    }
    
    let csv = "তারিখ,সদস্য,আইডি,উত্তোলনের ধরন,পরিমাণ,পেমেন্ট মাধ্যম,স্ট্যাটাস,নোট\n";
    const rows = table.querySelectorAll('tbody tr');
    rows.forEach(row => {
        const cells = row.querySelectorAll('td');
        if (cells.length >= 8) {
            csv += `"${cells[0]?.textContent.trim() || ''}","${cells[1]?.textContent.trim() || ''}","${cells[2]?.textContent.trim() || ''}","${cells[3]?.textContent.trim() || ''}","${cells[4]?.textContent.trim() || ''}","${cells[5]?.textContent.trim() || ''}","${cells[6]?.textContent.trim() || ''}","${cells[7]?.textContent.trim() || ''}"\n`;
        }
    });
    
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `all_withdrawals_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    showToast('✅ উত্তোলন এক্সপোর্ট সম্পূর্ণ!', 'success');
}

        return;
    }
    
    const fromDate = document.getElementById('withdrawalFromDate')?.value || '';

        container.innerHTML = html;

        console.error('❌ Load withdrawals error:', e);

        </div>`;
    }
}

function updateWithdrawalSummary(withdrawals) {
    if (!withdrawals || withdrawals.length === 0) {
        document.getElementById('totalWithdrawalAmount').innerHTML = '০ টাকা';
        document.getElementById('totalPendingWithdrawals').innerHTML = '০ টি';
        document.getElementById('totalApprovedWithdrawals').innerHTML = '০ টি';
        document.getElementById('totalRejectedWithdrawals').innerHTML = '০ টি';
        document.getElementById('avgWithdrawalAmount').innerHTML = '০ টাকা';
        return;
    }
    
    const totalAmount = withdrawals.reduce((sum, w) => sum + (w.amount || 0), 0);
    const pendingCount = withdrawals.filter(w => w.status === 'pending').length;
    const approvedCount = withdrawals.filter(w => w.status === 'approved').length;
    const rejectedCount = withdrawals.filter(w => w.status === 'rejected').length;
    const avgAmount = withdrawals.length > 0 ? totalAmount / withdrawals.length : 0;
    
    document.getElementById('totalWithdrawalAmount').innerHTML = formatAmountWithText(totalAmount);
    document.getElementById('totalPendingWithdrawals').innerHTML = pendingCount + ' টি';
    document.getElementById('totalApprovedWithdrawals').innerHTML = approvedCount + ' টি';
    document.getElementById('totalRejectedWithdrawals').innerHTML = rejectedCount + ' টি';
    document.getElementById('avgWithdrawalAmount').innerHTML = formatAmountWithText(avgAmount);
}

function updateLoanGivenSummary(loans) {
    if (!loans || loans.length === 0) {
        document.getElementById('totalLoanGivenAmount').innerHTML = '০ টাকা';
        document.getElementById('totalPendingLoans').innerHTML = '০ টি';
        document.getElementById('totalApprovedLoans').innerHTML = '০ টি';
        document.getElementById('totalRejectedLoans').innerHTML = '০ টি';
        return;
    }
    
    const totalAmount = loans.reduce((sum, l) => sum + (l.amount || 0), 0);
    const pendingCount = loans.filter(l => l.status === 'pending').length;
    const approvedCount = loans.filter(l => l.status === 'approved').length;
    const rejectedCount = loans.filter(l => l.status === 'rejected').length;
    
    document.getElementById('totalLoanGivenAmount').innerHTML = formatAmountWithText(totalAmount);
    document.getElementById('totalPendingLoans').innerHTML = pendingCount + ' টি';
    document.getElementById('totalApprovedLoans').innerHTML = approvedCount + ' টি';
    document.getElementById('totalRejectedLoans').innerHTML = rejectedCount + ' টি';
}

// ============================================================
// ✅ approveWithdrawal - উত্তোলন অনুমোদন
// ============================================================
async function approveWithdrawal(id) {
    const client = initSupabaseClient();
    if (!client) {
        showToast('সংযোগ সমস্যা!', 'error');
        return;
    }
    
    const withdrawal = pendingWithdrawalsData.find(w => w.id == id);
    if (!withdrawal) {
        showToast('উত্তোলন পাওয়া যায়নি!', 'error');
        return;
    }
    
    if (!confirm(`${formatAmount(withdrawal.amount)} টাকা উত্তোলন অনুমোদন দেবেন?`)) return;
    
    const btns = document.querySelectorAll(`[onclick*="approveWithdrawal('${id}')"]`);
    btns.forEach(btn => {
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    });
    
    try {
        const { data: member, error: memberError } = await client
            .from('members')
            .select('balance')
            .eq('member_id', withdrawal.member_id)
            .single();
        
        if (memberError) throw memberError;
        
        if ((member.balance || 0) < withdrawal.amount) {
            showToast(`❌ পর্যাপ্ত ব্যালেন্স নেই!`, 'error');
            return;
        }
        
        await client
            .from('members')
            .update({ balance: (member.balance || 0) - withdrawal.amount })
            .eq('member_id', withdrawal.member_id);
        
        await client
            .from('withdrawals')
            .update({
                status: 'approved',
                approved_by: currentAdmin?.username || 'সুপার অ্যাডমিন',
                approved_at: new Date().toISOString()
            })
            .eq('id', id);
        
        pendingWithdrawalsData = pendingWithdrawalsData.filter(w => w.id != id);
        loadPendingWithdrawals();
        loadAllWithdrawals();
        await updateAllBadges();
        await loadRealDashboard();
        
        showToast(`✅ ${formatAmount(withdrawal.amount)} টাকা উত্তোলন অনুমোদিত হয়েছে!`, 'success');
        
    } catch(e) {
        console.error('Approve withdrawal error:', e);
        showToast('❌ অনুমোদন ব্যর্থ!', 'error');
    } finally {
        btns.forEach(btn => {
            btn.disabled = false;
            btn.innerHTML = 'অনুমোদন';
        });
    }
}

// ✅ rejectWithdrawal - উত্তোলন বাতিল
// ============================================================
async function rejectWithdrawal(id) {
    const reason = prompt('বাতিলের কারণ লিখুন:');
    if (!reason) return;
    
    const client = initSupabaseClient();
    if (!client) {
        showToast('সংযোগ সমস্যা!', 'error');
        return;
    }
    
    try {
        await client
            .from('withdrawals')
            .update({
                status: 'rejected',
                rejection_reason: reason,
                rejected_by: currentAdmin?.username || 'সুপার অ্যাডমিন',
                rejected_at: new Date().toISOString()
            })
            .eq('id', id);
        
        pendingWithdrawalsData = pendingWithdrawalsData.filter(w => w.id != id);
        loadPendingWithdrawals();
        await updateAllBadges();
        showToast('❌ উত্তোলন বাতিল করা হয়েছে!', 'warning');
    } catch(e) {
        console.error('Reject error:', e);
        showToast('❌ বাতিল করতে সমস্যা!', 'error');
    }
}

// ============================================================
// ✅ ড্যাশবোর্ড ফাংশন
// ============================================================
async function loadRealDashboard() {
    try {
        const client = initSupabaseClient();
        if (!client) {
            console.log('❌ Supabase client পাওয়া যায়নি!');
            return;
        }
        
        await updateAllBadges();
        
        const now = new Date();
        const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).toISOString();
        const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString();
        
        const { data: monthlyPayments } = await client
            .from('payments')
            .select('amount')
            .eq('status', 'approved')
            .gte('submitted_at', firstDay)
            .lte('submitted_at', lastDay);
        
        let monthlyCollection = 0;
        if (monthlyPayments && monthlyPayments.length > 0) {
            monthlyCollection = monthlyPayments.reduce((s, p) => s + (p.amount || 0), 0);
        }
        
        const { data: allPayments } = await client
            .from('payments')
            .select('amount')
            .eq('status', 'approved');
        
        let totalSavings = 0;
        if (allPayments && allPayments.length > 0) {
            totalSavings = allPayments.reduce((s, p) => s + (p.amount || 0), 0);
        }
        
        const { data: allMembers } = await client
            .from('members')
            .select('referral_bonus, profit_balance_savings, profit_balance_investment, profit_balance_referral, balance');
        
        let totalReferralBonus = 0, totalProfitSavings = 0, totalProfitInvestment = 0, totalProfitReferral = 0;
        let totalBalance = 0;
        
        if (allMembers && allMembers.length > 0) {
            totalReferralBonus = allMembers.reduce((s, m) => s + (m.referral_bonus || 0), 0);
            totalProfitSavings = allMembers.reduce((s, m) => s + (m.profit_balance_savings || 0), 0);
            totalProfitInvestment = allMembers.reduce((s, m) => s + (m.profit_balance_investment || 0), 0);
            totalProfitReferral = allMembers.reduce((s, m) => s + (m.profit_balance_referral || 0), 0);
            totalBalance = allMembers.reduce((s, m) => s + (m.balance || 0), 0);
        }
        
        const totalProfit = totalProfitSavings + totalProfitInvestment + totalProfitReferral;
        
        const { data: loanPayments } = await client
            .from('loan_payments')
            .select('total_amount, emi_amount')
            .eq('status', 'approved');
        
        let totalLoanCollected = 0;
        if (loanPayments && loanPayments.length > 0) {
            totalLoanCollected = loanPayments.reduce((s, p) => s + (p.total_amount || p.emi_amount || 0), 0);
        }
        
        const { data: welfareData } = await client
            .from('welfare_fund')
            .select('total');
        
        let totalWelfare = 0;
        if (welfareData && welfareData.length > 0) {
            totalWelfare = welfareData.reduce((s, w) => s + (w.total || 0), 0);
        }
        
        const totalFund = totalBalance + totalReferralBonus + totalProfit + totalLoanCollected + totalWelfare;
        
        const { data: savingsWithdrawals } = await client
            .from('withdrawals')
            .select('amount')
            .eq('status', 'approved')
            .eq('type', 'মূলধন উত্তোলন');
        
        let totalSavingsWithdrawal = 0;
        if (savingsWithdrawals && savingsWithdrawals.length > 0) {
            totalSavingsWithdrawal = savingsWithdrawals.reduce((s, w) => s + (w.amount || 0), 0);
        }
        
        const { data: bonusWithdrawals } = await client
            .from('withdrawals')
            .select('amount')
            .eq('status', 'approved')
            .eq('type', 'রেফারেল বোনাস উত্তোলন');
        
        let totalBonusWithdrawal = 0;
        if (bonusWithdrawals && bonusWithdrawals.length > 0) {
            totalBonusWithdrawal = bonusWithdrawals.reduce((s, w) => s + (w.amount || 0), 0);
        }
        
        const { data: profitWithdrawals } = await client
            .from('withdrawals')
            .select('amount')
            .eq('status', 'approved')
            .in('type', ['সঞ্চয় লভ্যাংশ উত্তোলন', 'বিনিয়োগ লভ্যাংশ উত্তোলন', 'রেফারেল লভ্যাংশ উত্তোলন']);
        
        let totalProfitWithdrawal = 0;
        if (profitWithdrawals && profitWithdrawals.length > 0) {
            totalProfitWithdrawal = profitWithdrawals.reduce((s, w) => s + (w.amount || 0), 0);
        }
        
        const { data: loansGiven } = await client
            .from('loan_applications')
            .select('amount')
            .eq('status', 'approved');
        
        let totalLoanGiven = 0;
        if (loansGiven && loansGiven.length > 0) {
            totalLoanGiven = loansGiven.reduce((s, l) => s + (l.amount || 0), 0);
        }
        
        const totalWithdrawal = totalSavingsWithdrawal + totalBonusWithdrawal + totalProfitWithdrawal + totalLoanGiven;
        const netBalance = totalFund - totalWithdrawal;
        const totalDue = totalLoanGiven - totalLoanCollected;
        
        const { count: totalMembers } = await client
            .from('members')
            .select('*', { count: 'exact', head: true });
        
        const { count: pendingMembers } = await client
            .from('members')
            .select('*', { count: 'exact', head: true })
            .eq('status', 'pending');
        
        const setText = (id, text) => {
            const el = document.getElementById(id);
            if (el) el.innerHTML = text;
        };
        
        setText('dashMonthlyCollection', formatAmountWithText(monthlyCollection));
        setText('dashSavingsProfit', formatAmountWithText(totalProfitSavings));
        setText('dashInvestmentProfit', formatAmountWithText(totalProfitInvestment));
        setText('dashReferralBonus', formatAmountWithText(totalReferralBonus));
        setText('dashReferralProfit', formatAmountWithText(totalProfitReferral));
        setText('dashTotalDividend', formatAmountWithText(totalProfit));
        setText('dashTotalLoanGiven', formatAmountWithText(totalLoanGiven));
        setText('dashLoanCollected', formatAmountWithText(totalLoanCollected));
        setText('dashLoanDue', formatAmountWithText(totalDue));
        setText('dashTotalWithdrawal', formatAmountWithText(totalWithdrawal));
        setText('dashWelfareFund', formatAmountWithText(totalWelfare));
        setText('dashCurrentFund', formatAmountWithText(netBalance));
        
        setText('statActiveMembers', (totalMembers || 0) - (pendingMembers || 0));
        setText('statPendingMembers2', pendingMembers || 0);
        setText('statTotalMembers2', totalMembers || 0);
        
        console.log('✅ ড্যাশবোর্ড আপডেট সম্পূর্ণ!');
        
    } catch(e) {
        console.error('❌ Dashboard error:', e);
    }
}

function renderPendingMembersList() {
    const tbody = document.getElementById('pendingMembersList');
    if (!tbody) return;
    
    const pending = membersData.filter(m => m.status === 'pending');
    
    const badge = document.getElementById('pendingMemberBadge');
    if (badge) {
        badge.innerText = pending.length;
        badge.style.display = pending.length > 0 ? 'flex' : 'none';
    }
    
    if (pending.length === 0) { 
        tbody.innerHTML = `<tr><td colspan="8" class="text-center p-4">
            <i class="fas fa-check-circle text-green-500 text-2xl"></i>
            <br><span class="text-gray-500">✅ কোনো পেন্ডিং সদস্য নেই</span>
        </td></tr>`;
        return; 
    }
    
    tbody.innerHTML = pending.map(m => `
        <tr>
            <td>${m.created_at ? new Date(m.created_at).toLocaleDateString('bn-BD') : '-'}</td>
            <td><span class="font-medium">${m.full_name || '-'}</span></td>
            <td>${m.mobile || '-'}</td>
            <td>${m.present_district || '-'}</td>
            <td class="text-right font-bold text-emerald-600">${(m.monthly_savings||500).toLocaleString()} টাকা</td>
            <td><button onclick="showPendingMemberDetails('${m.member_id}')" class="btn btn-info btn-sm" title="বিস্তারিত"><i class="fas fa-eye"></i></button></td>
            <td><button onclick="approveMember('${m.member_id}')" class="btn btn-success btn-sm"><i class="fas fa-check mr-1"></i> অনুমোদন</button></td>
            <td><button onclick="deleteMember('${m.member_id}')" class="btn btn-danger btn-sm"><i class="fas fa-trash mr-1"></i> বাতিল</button></td>
        </tr>
    `).join('');
}

function renderDeletedMembersList() {
    const tbody = document.getElementById('deletedMembersList');
    if (!tbody) return;
    const deleted = membersData.filter(m => m.status === 'deleted');
    if (deleted.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="text-center p-4">কোনো বাতিলকৃত সদস্য নেই</td></tr>'; return; }
    tbody.innerHTML = deleted.map(m => `<tr>
        <td>${m.full_name}</td>
        <td>${m.mobile}</td>
        <td>${m.present_district||'-'}</td>
        <td>${m.deleted_at ? new Date(m.deleted_at).toLocaleDateString('bn-BD') : '-'}</td>
        <td><button onclick="restoreMember('${m.member_id}')" class="btn btn-warning btn-sm">↩️ পুনরুদ্ধার</button></td>
    </tr>`).join('');
}

async function approveMember(id) {
    if (!confirm('সদস্যকে অনুমোদন দেবেন?')) return;
    
    const client = initSupabaseClient();
    if (!client) {
        showToast('সংযোগ সমস্যা!', 'error');
        return;
    }
    
    const btns = document.querySelectorAll(`[onclick*="approveMember('${id}')"]`);
    btns.forEach(btn => {
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    });
    
    try {
        console.log('🔄 সদস্য অনুমোদন শুরু:', id);
        
        const { data: memberCheck, error: checkError } = await client
            .from('members')
            .select('status, member_id')
            .eq('member_id', id)
            .single();
        
        if (checkError) {
            console.error('❌ সদস্য চেক error:', checkError);
            showToast('❌ সদস্য খুঁজে পাওয়া যায়নি!', 'error');
            return;
        }
        
        if (memberCheck.status === 'active') {
            showToast('ℹ️ সদস্যটি ইতিমধ্যে অনুমোদিত!', 'info');
            return;
        }
        
        console.log('📊 বর্তমান স্ট্যাটাস:', memberCheck.status);
        
        const { error: updateError } = await client
            .from('members')
            .update({ 
                status: 'active', 
                approved_at: new Date().toISOString(),
                approved_by: currentAdmin?.username || currentAdmin?.full_name || 'সুপার অ্যাডমিন'
            })
            .eq('member_id', id);
        
        if (updateError) {
            console.error('❌ অনুমোদন আপডেট error:', updateError);
            showToast(`❌ অনুমোদন ব্যর্থ: ${updateError.message}`, 'error');
            return;
        }
        
        console.log('✅ সদস্য অনুমোদন আপডেট সম্পন্ন!');
        
        const { data: existingBranch } = await client
            .from('branch_members')
            .select('id')
            .eq('member_id', id)
            .maybeSingle();
        
        if (!existingBranch) {
            const { data: defaultBranch } = await client
                .from('branches')
                .select('id')
                .eq('status', 'active')
                .limit(1)
                .maybeSingle();
            
            if (defaultBranch) {
                await client
                    .from('branch_members')
                    .insert([{
                        branch_id: defaultBranch.id,
                        member_id: id,
                        joined_at: new Date().toISOString(),
                        status: 'active'
                    }]);
                console.log('✅ ব্রাঞ্চে যোগ করা হয়েছে:', defaultBranch.id);
            }
        }
        
        const { data: freshData, error: loadError } = await client
            .from('members')
            .select('*')
            .order('created_at', { ascending: false });
        
        if (loadError) {
            console.error('❌ ডেটা রিলোড error:', loadError);
        } else {
            membersData = freshData || [];
            console.log('✅ তাজা ডেটা লোড সম্পন্ন:', membersData.length);
        }
        
        renderMembersList();
        renderPendingMembersList();
        renderDeletedMembersList();
        
        const pendingCount = membersData.filter(m => m.status === 'pending').length;
        const badge = document.getElementById('pendingMemberBadge');
        if (badge) {
            badge.innerText = pendingCount;
            badge.style.display = pendingCount > 0 ? 'flex' : 'none';
        }
        
        await loadRealDashboard();
        await loadBranches();
        await updateAllBadges();
        
        const memberName = membersData.find(m => m.member_id === id)?.full_name || 'সদস্য';
        showToast(`✅ ${memberName} সফলভাবে অনুমোদিত হয়েছে!`, 'success');
        console.log('✅ অনুমোদন সম্পূর্ণ!');
        
    } catch(e) {
        console.error('❌ Approval error:', e);
        showToast(`❌ অনুমোদন ব্যর্থ: ${e.message || 'অজানা ত্রুটি'}`, 'error');
    } finally {
        btns.forEach(btn => {
            btn.disabled = false;
            btn.innerHTML = '✅ অনুমোদন';
        });
    }
}

function deleteMember(id) {
    if (!confirm('সদস্য বাতিল করবেন? (পরে পুনরুদ্ধার করা যাবে)')) return;
    const client = initSupabaseClient();
    if (client) client.from('members').update({ status: 'deleted', deleted_at: new Date().toISOString() }).eq('member_id', id);
    loadMembers();
    showToast('✅ সদস্য বাতিল করা হয়েছে');
}

function restoreMember(id) {
    const client = initSupabaseClient();
    if (client) client.from('members').update({ status: 'pending', deleted_at: null }).eq('member_id', id);
    loadMembers();
    showToast('✅ সদস্য পুনরুদ্ধার করা হয়েছে');
}

function editMember(id) {
    showTab('memberDetails');
    setTimeout(() => selectMemberForFullInfo(id), 300);
}
