<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>লগইন | TUKNBD</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- ১. Supabase CDN (সবার আগে লোড হবে) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- ২. Supabase Client তৈরি -->
    <script>
        const supabaseUrl = 'https://bffomfsffrtfgxyetzvm.supabase.co';
        const supabaseKey = 'sb_publishable_A0BluIVwJ4M3Zd3JWpBoPg_NJSRu81D';
        window.supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        console.log('✅ Supabase Client তৈরি হয়েছে (login.html)');
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans Bengali', sans-serif; }
        body { background: linear-gradient(135deg, #0a2a3a 0%, #0d3b4f 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        .home-btn { position: fixed; top: 20px; right: 20px; background: rgba(255,255,255,0.15); padding: 8px 20px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.3); color: white; text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 8px; transition: all 0.3s; }
        .home-btn:hover { background: rgba(255,255,255,0.25); color: #9be564; }
        
        .login-card { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); border-radius: 28px; padding: 32px 28px; max-width: 340px; width: 100%; box-shadow: 0 25px 40px -12px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.25); }
        .logo-area { text-align: center; margin-bottom: 28px; }
        .logo-img { width: 80px; height: 80px; border-radius: 20px; object-fit: cover; margin-bottom: 12px; background: white; padding: 5px; }
        .logo-title { font-size: 16px; font-weight: 700; color: white; }
        .logo-title span { color: #9be564; }
        
        .input-field { margin-bottom: 20px; position: relative; }
        .input-field i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #9be564; font-size: 14px; }
        .input-field input { width: 100%; padding: 10px 8px 10px 35px; border: 1.5px solid rgba(255,255,255,0.3); border-radius: 50px; font-size: 14px; background: rgba(255,255,255,0.15); color: white; outline: none; }
        .input-field input:focus { border-color: #9be564; background: rgba(255,255,255,0.25); }
        .input-field input::placeholder { color: rgba(255,255,255,0.6); font-size: 12px; }
        .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: rgba(255,255,255,0.6); cursor: pointer; font-size: 13px; }
        
        .form-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .checkbox-label input { width: 16px; height: 16px; accent-color: #9be564; }
        .checkbox-label span { font-size: 12px; color: rgba(255,255,255,0.8); }
        .forgot-link { font-size: 12px; color: #9be564; text-decoration: none; }
        
        .login-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #9be564, #7bc43a); color: #0a2a3a; border: none; border-radius: 50px; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.3s; }
        .login-btn:hover { transform: scale(1.02); }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; }

        /* সুন্দর নোটিফিকেশন */
        .notification-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .notif-card { background: white; border-radius: 32px; max-width: 360px; width: 90%; overflow: hidden; box-shadow: 0 30px 60px -20px rgba(0,0,0,0.4); border-top: 5px solid #10b981; animation: slideUp 0.4s cubic-bezier(0.34, 1.2, 0.64, 1); }
        .notif-header { text-align: center; padding: 30px 20px 20px; background: #ecfdf5; }
        .notif-icon { font-size: 64px; margin-bottom: 10px; }
        .notif-title { font-size: 24px; font-weight: 800; color: #059669; margin: 0; }
        .notif-body { padding: 25px 25px 30px; text-align: center; }
        .notif-msg { color: #4b5563; font-size: 15px; line-height: 1.7; margin: 0 0 25px; }
        .notif-btn { background: #10b981; color: white; border: none; padding: 12px 35px; border-radius: 40px; font-size: 15px; font-weight: 600; cursor: pointer; }
        
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: white; border-radius: 24px; max-width: 400px; width: 100%; padding: 28px; animation: slideUp 0.3s ease; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid #e2e8f0; }
        .modal-header h3 { font-size: 20px; font-weight: 700; color: #0a2a3a; }
        .modal-header button { background: none; border: none; font-size: 24px; cursor: pointer; color: #94a3b8; }
        .modal input { width: 100%; padding: 12px 16px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 14px; margin-bottom: 16px; outline: none; }
        .modal input:focus { border-color: #9be564; }
        .modal-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #0a2a3a, #0d3b4f); color: white; border: none; border-radius: 50px; font-size: 14px; font-weight: 600; cursor: pointer; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<a href="index.html" class="home-btn"><i class="fas fa-home"></i> হোম</a>

<div class="login-card">
    <div class="logo-area">
        <img src="images/logo.png" alt="Logo" class="logo-img" onerror="this.src='https://placehold.co/80x80/059669/white?text=T'">
        <div class="logo-title">ত্বলাবা-উলামা <span>কল্যাণ নেটওয়ার্ক</span></div>
    </div>
    
    <form id="loginForm">
        <div class="input-field">
            <i class="fas fa-mobile-alt"></i>
            <input type="tel" id="username" placeholder="মোবাইল নম্বর" autocomplete="off">
        </div>
        <div class="input-field">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="পাসওয়ার্ড">
            <button type="button" id="togglePassword" class="toggle-password"><i class="fas fa-eye"></i></button>
        </div>
        <div class="form-options">
            <label class="checkbox-label"><input type="checkbox" id="rememberMe"><span>আমাকে মনে রাখুন</span></label>
            <a href="#" id="forgotPasswordBtn" class="forgot-link">পাসওয়ার্ড ভুলে গেছেন?</a>
        </div>
        <button type="submit" class="login-btn" id="submitBtn">
            <i class="fas fa-sign-in-alt"></i> লগইন করুন
        </button>
    </form>
</div>

<!-- পাসওয়ার্ড রিসেট মডাল -->
<div id="forgotModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-key"></i> পাসওয়ার্ড রিসেট</h3>
            <button id="closeForgotModal">&times;</button>
        </div>
        <p style="color: #4b5563; font-size: 14px; margin-bottom: 16px;">আপনার রেজিস্টার্ড মোবাইল নম্বর দিন। নতুন পাসওয়ার্ড: <strong>1234</strong> সেট করা হবে।</p>
        <form id="forgotForm">
            <input type="tel" id="forgotMobile" placeholder="মোবাইল নম্বর (01XXXXXXXXX)">
            <button type="submit" class="modal-btn">রিসেট করুন</button>
        </form>
    </div>
</div>

<script>
    // নোটিফিকেশন দেখানোর ফাংশন
    function showCenterNotification(message, type = 'success') {
        const existingOverlay = document.querySelector('.notification-overlay');
        if (existingOverlay) existingOverlay.remove();
        
        const styles = {
            success: { icon: '🎉', borderColor: '#10b981', bgColor: '#ecfdf5', title: 'স্বাগতম!', titleColor: '#059669' },
            error: { icon: '❌', borderColor: '#ef4444', bgColor: '#fef2f2', title: 'ব্যর্থ!', titleColor: '#dc2626' },
            warning: { icon: '⚠️', borderColor: '#f59e0b', bgColor: '#fffbeb', title: 'সতর্কতা!', titleColor: '#d97706' }
        };
        
        const s = styles[type] || styles.success;
        const overlay = document.createElement('div');
        overlay.className = 'notification-overlay';
        
        overlay.innerHTML = `
            <div class="notif-card" style="border-top-color: ${s.borderColor};">
                <div class="notif-header" style="background: ${s.bgColor};">
                    <div class="notif-icon">${s.icon}</div>
                    <h3 class="notif-title" style="color: ${s.titleColor};">${s.title}</h3>
                </div>
                <div class="notif-body">
                    <p class="notif-msg">${message}</p>
                    <button class="notif-btn" style="background: ${s.borderColor};" onclick="this.closest('.notification-overlay').remove()">ঠিক আছে</button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
        setTimeout(() => { if (overlay.parentNode) overlay.remove(); }, 4000);
    }

    document.addEventListener('DOMContentLoaded', function() {
        
        // পাসওয়ার্ড টগল
        document.getElementById('togglePassword').addEventListener('click', function() {
            const pwd = document.getElementById('password');
            const type = pwd.getAttribute('type') === 'password' ? 'text' : 'password';
            pwd.setAttribute('type', type);
            this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        });

        // লগইন সাবমিট
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const btn = document.getElementById('submitBtn');

            if(!username || !username.match(/^01[3-9]\d{8}$/)) {
                showCenterNotification('সঠিক মোবাইল নম্বর দিন (01XXXXXXXXX)', 'error');
                return;
            }
            if(!password) {
                showCenterNotification('পাসওয়ার্ড দিন!', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> লগইন হচ্ছে...';

            try {
                console.log('🔍 Searching for member:', username);

                const { data, error } = await window.supabaseClient.rpc('login_member', {
                    input_username: username,
                    input_password: password
                });

                console.log('🛠️ RPC Response Data:', data);
                console.log('🛠️ RPC Response Error:', error);

                if (error) throw error;

                const member = data?.[0];

                if(!member) {
                    showCenterNotification('মোবাইল নম্বর অথবা পাসওয়ার্ড সঠিক নয়!', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> লগইন করুন';
                    return;
                }

                console.log('✅ Member found:', member.full_name);

                if(member.status === 'active' || member.status === 'approved') {
                    
                    const userData = { 
                        member_id: member.member_id,
                        full_name: member.full_name,
                        mobile: member.mobile,
                        refer_code: member.refer_code, 
                        join_date: member.join_date,
                        member_term: member.member_term || 12,
                        member_type: member.member_type || 'মেয়াদী',
                        monthly_savings: member.monthly_savings || 500,
                        profile_image: member.profile_image || null,
                        status: member.status,
                        user_uuid: member.user_uuid,  
                        loggedIn: true,
                        loginTime: new Date().toISOString()
                    };
                    
                    if(rememberMe) {
                        localStorage.setItem('tukn_logged_member', JSON.stringify(userData));
                    }
                    sessionStorage.setItem('tukn_logged_member', JSON.stringify(userData));
                    
                    showCenterNotification(`
                        <div style="text-align: center;">
                            <div style="font-size: 18px; font-weight: bold; margin-bottom: 5px;">${member.full_name}</div>
                            <div style="font-size: 13px; color: #666;">আপনি সফলভাবে লগইন করেছেন!</div>
                        </div>
                    `, 'success');
                    
                    setTimeout(() => { 
                        window.location.href = 'member-dashboard.html'; 
                    }, 1500);
                    
                } else if(member.status === 'pending') {
                    showCenterNotification('আপনার একাউন্ট এখনও অনুমোদিত হয়নি। অনুগ্রহ করে অপেক্ষা করুন।', 'warning');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> লগইন করুন';
                } else {
                    showCenterNotification('আপনার একাউন্টটি নিষ্ক্রিয়। প্রশাসকের সাথে যোগাযোগ করুন।', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> লগইন করুন';
                }

            } catch(err) {
                console.error('❌ Login Error Details:', err);
                showCenterNotification('লগইন করতে ব্যর্থ হয়েছে! ' + (err.message || ''), 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> লগইন করুন';
            }
        });

        // পাসওয়ার্ড রিসেট মডাল
        document.getElementById('forgotPasswordBtn').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('forgotModal').style.display = 'flex';
        });

        document.getElementById('closeForgotModal').addEventListener('click', () => {
            document.getElementById('forgotModal').style.display = 'none';
        });

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mobile = document.getElementById('forgotMobile').value.trim();
            const btn = document.querySelector('.modal-btn');
            
            if(!mobile || !mobile.match(/^01[3-9]\d{8}$/)) {
                alert('সঠিক মোবাইল নম্বর দিন (01XXXXXXXXX)');
                return;
            }
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> প্রক্রিয়াধীন...';
            btn.disabled = true;
            
            try {
                // পাসওয়ার্ড রিসেটের জন্য সরাসরি আপডেট (RLS পলিসি থাকলে কাজ করবে)
                const { error } = await window.supabaseClient
                    .from('members')
                    .update({ password: '1234' })
                    .eq('mobile', mobile);
                
                if(error) throw error;
                
                showCenterNotification('পাসওয়ার্ড রিসেট করা হয়েছে। নতুন পাসওয়ার্ড: 1234', 'success');
            } catch (error) {
                console.error('Reset error:', error);
                showCenterNotification('পাসওয়ার্ড রিসেট করতে ব্যর্থ হয়েছে!', 'error');
            } finally {
                btn.innerHTML = 'রিসেট করুন';
                btn.disabled = false;
                document.getElementById('forgotModal').style.display = 'none';
                document.getElementById('forgotMobile').value = '';
            }
        });
    });
</script>
</body>
</html>
