<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>লগইন | TUKNBD</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- ✅ Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- ✅ Supabase Client — library লোডের সাথে সাথেই -->
    <script>
        (function() {
            console.log('🚀 [INIT] Supabase initializing...');
            
            if (typeof supabase === 'undefined' || typeof supabase.createClient !== 'function') {
                console.error('❌ [INIT] Supabase not available!');
                return;
            }
            
            try {
                window.supabaseClient = supabase.createClient(
                    'https://bffomfsffrtfgxyetzvm.supabase.co',
                    'sb_publishable_A0BluIVwJ4M3Zd3JWpBoPg_NJSRu81D',
                    {
                        auth: {
                            persistSession: false,
                            autoRefreshToken: false,
                            detectSessionInUrl: false
                        }
                    }
                );
                
                console.log('✅ [INIT] Client ready:', !!window.supabaseClient);
                console.log('✅ [INIT] RPC:', typeof window.supabaseClient.rpc);
                
            } catch(e) {
                console.error('❌ [INIT] Failed:', e);
            }
        })();
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans Bengali', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0a2a3a 0%, #0d3b4f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .home-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
        }
        
        .home-btn:hover { background: rgba(255,255,255,0.25); color: #9be564; }
        
        .login-container { max-width: 340px; width: 100%; }
        
        .login-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 32px 28px;
            box-shadow: 0 25px 40px -12px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.25);
        }
        
        .logo-area { text-align: center; margin-bottom: 28px; }
        
        .logo-img {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            object-fit: cover;
            margin-bottom: 12px;
            background: white;
            padding: 5px;
        }
        
        .logo-title { font-size: 16px; font-weight: 700; color: white; }
        .logo-title span { color: #9be564; }
        
        .input-field { margin-bottom: 20px; position: relative; }
        
        .input-field i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9be564;
            font-size: 14px;
        }
        
        .input-field input {
            width: 100%;
            padding: 10px 8px 10px 35px;
            border: 1.5px solid rgba(255,255,255,0.3);
            border-radius: 50px;
            font-size: 14px;
            background: rgba(255,255,255,0.15);
            color: white;
            outline: none;
        }
        
        .input-field input:focus {
            border-color: #9be564;
            background: rgba(255,255,255,0.25);
        }
        
        .input-field input::placeholder { color: rgba(255,255,255,0.6); font-size: 12px; }
        
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            font-size: 13px;
        }
        
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        
        .checkbox-label input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #9be564;
        }
        
        .checkbox-label span { font-size: 12px; color: rgba(255,255,255,0.8); }
        
        .forgot-link { font-size: 12px; color: #9be564; text-decoration: none; }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #9be564, #7bc43a);
            color: #0a2a3a;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .login-btn:hover { transform: scale(1.02); }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal-content {
            background: white;
            border-radius: 24px;
            max-width: 400px;
            width: 100%;
            padding: 28px;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
        }
        
        .modal-header h3 { font-size: 20px; font-weight: 700; color: #0a2a3a; }
        .modal-header button { background: none; border: none; font-size: 24px; cursor: pointer; color: #94a3b8; }
        
        .modal input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 16px;
        }
        
        .modal-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0a2a3a, #0d3b4f);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

<a href="index.html" class="home-btn">
    <i class="fas fa-home"></i> হোম
</a>

<div class="login-container">
    <div class="login-card">
        <div class="logo-area">
            <img src="images/logo.png" alt="TUKNBD Logo" class="logo-img" onerror="this.src='https://placehold.co/80x80/059669/white?text=T'">
            <div class="logo-title">
                ত্বলাবা-উলামা <span>কল্যাণ নেটওয়ার্ক</span>
            </div>
        </div>
        
        <form id="loginForm">
            <div class="input-field">
                <i class="fas fa-mobile-alt"></i>
                <input type="tel" id="username" placeholder="মোবাইল নম্বর" autocomplete="off">
            </div>
            
            <div class="input-field">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="পাসওয়ার্ড">
                <button type="button" id="togglePassword" class="toggle-password">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            
            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox" id="rememberMe">
                    <span>আমাকে মনে রাখুন</span>
                </label>
                <a href="#" id="forgotPasswordBtn" class="forgot-link">পাসওয়ার্ড ভুলে গেছেন?</a>
            </div>
            
            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt"></i> লগইন করুন
            </button>
        </form>
    </div>
</div>

<div id="forgotModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-key"></i> পাসওয়ার্ড রিসেট</h3>
            <button id="closeForgotModal">&times;</button>
        </div>
        <p style="color:#4b5563; font-size:14px; margin-bottom:16px;">আপনার মোবাইল নম্বর দিন। নতুন পাসওয়ার্ড: <strong>1234</strong></p>
        <form id="forgotForm">
            <input type="tel" id="forgotMobile" placeholder="মোবাইল নম্বর (01XXXXXXXXX)">
            <button type="submit" class="modal-btn">রিসেট করুন</button>
        </form>
    </div>
</div>

<script>
    // ═══════════════════════════════════════════════════════════
    // ⚠️ IMPORTANT: কোনো auto-redirect নেই, কোনো সেশন চেকিং নেই
    // ═══════════════════════════════════════════════════════════
    
    function showNotification(message, type = 'success') {
        const colors = { success: '#10b981', error: '#dc2626', warning: '#f59e0b' };
        const icons = { success: '🎉', error: '❌', warning: '⚠️' };
        const titles = { success: 'সফল!', error: 'ব্যর্থ!', warning: 'সতর্কতা!' };
        
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px;';
        overlay.innerHTML = `
            <div style="background:white;border-radius:32px;max-width:360px;width:90%;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,0.4);border-top:5px solid ${colors[type]};">
                <div style="text-align:center;padding:30px 20px 20px;">
                    <div style="font-size:64px;margin-bottom:10px;">${icons[type]}</div>
                    <h3 style="font-size:24px;font-weight:800;color:${colors[type]};margin:0;">${titles[type]}</h3>
                </div>
                <div style="padding:25px;text-align:center;">
                    <p style="color:#4b5563;font-size:15px;line-height:1.7;margin:0 0 25px;">${message}</p>
                    <button onclick="this.closest('div[style*=\\'position:fixed\\']').remove()" style="background:${colors[type]};color:white;border:none;padding:12px 35px;border-radius:40px;font-size:15px;font-weight:600;cursor:pointer;">ঠিক আছে</button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
        setTimeout(() => overlay.remove(), 5000);
    }
    
    document.addEventListener('DOMContentLoaded', function() {
        console.log('📄 [DOM] DOMContentLoaded');
        console.log('🔍 [DOM] window.supabaseClient:', !!window.supabaseClient);
        console.log('🔍 [DOM] rpc available:', window.supabaseClient && typeof window.supabaseClient.rpc);
        
        // Password toggle
        const togglePwd = document.getElementById('togglePassword');
        if (togglePwd) {
            togglePwd.addEventListener('click', function() {
                const pwd = document.getElementById('password');
                const type = pwd.getAttribute('type') === 'password' ? 'text' : 'password';
                pwd.setAttribute('type', type);
                this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
            });
        }
        
        // Login submit
        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const mobile = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                const rememberMe = document.getElementById('rememberMe')?.checked || false;
                const btn = this.querySelector('.login-btn');
                const originalText = btn.innerHTML;
                
                if (!mobile || !mobile.match(/^01[3-9]\d{8}$/)) {
                    showNotification('সঠিক মোবাইল নম্বর দিন (01XXXXXXXXX)', 'error');
                    return;
                }
                if (!password) {
                    showNotification('পাসওয়ার্ড দিন!', 'error');
                    return;
                }
                
                if (!window.supabaseClient) {
                    showNotification('সিস্টেম ত্রুটি! পেজ রিফ্রেশ করুন।', 'error');
                    return;
                }
                
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> লগইন হচ্ছে...';
                
                try {
                    console.log('🔄 [LOGIN] RPC call:', mobile);
                    
                    const { data, error } = await window.supabaseClient.rpc('login_member', {
                        input_username: mobile,
                        input_password: password
                    });
                    
                    console.log('📊 [LOGIN] Response:', data);
                    console.log('❌ [LOGIN] Error:', error);
                    
                    if (error) throw error;
                    
                    const member = data?.[0];
                    
                    if (!member) {
                        showNotification('মোবাইল নম্বর অথবা পাসওয়ার্ড সঠিক নয়!', 'error');
                        btn.disabled = false;
                        btn.innerHTML = originalText;
                        return;
                    }
                    
                    console.log('✅ [LOGIN] Member:', member.full_name);
                    
                    if (member.status === 'active' || member.status === 'approved') {
                        const userData = {
                            member_id: member.member_id,
                            full_name: member.full_name,
                            mobile: member.mobile,
                            refer_code: member.refer_code,
                            join_date: member.join_date,
                            member_term: member.member_term || 12,
                            member_type: member.member_type || 'মেয়াদী',
                            monthly_savings: member.monthly_savings || 500,
                            profile_image: member.profile_image || null,
                            status: member.status,
                            user_uuid: member.user_uuid,
                            loggedIn: true,
                            loginTime: new Date().toISOString()
                        };
                        
                        if (rememberMe) {
                            localStorage.setItem('tukn_logged_member', JSON.stringify(userData));
                        }
                        sessionStorage.setItem('tukn_logged_member', JSON.stringify(userData));
                        
                        showNotification(`স্বাগতম, ${member.full_name}!`, 'success');
                        
                        setTimeout(() => {
                            window.location.href = 'member-dashboard.html';
                        }, 1200);
                        
                    } else if (member.status === 'pending') {
                        showNotification('আপনার একাউন্ট অনুমোদিত হয়নি।', 'warning');
                        btn.disabled = false;
                        btn.innerHTML = originalText;
                    } else {
                        showNotification('আপনার একাউন্ট নিষ্ক্রিয়।', 'error');
                        btn.disabled = false;
                        btn.innerHTML = originalText;
                    }
                    
                } catch(err) {
                    console.error('❌ [LOGIN] Error:', err);
                    showNotification('লগইন ব্যর্থ: ' + (err.message || 'নেটওয়ার্ক চেক করুন'), 'error');
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            });
        }
        
        // Forgot password
        const forgotBtn = document.getElementById('forgotPasswordBtn');
        if (forgotBtn) {
            forgotBtn.addEventListener('click', (e) => {
                e.preventDefault();
                document.getElementById('forgotModal').style.display = 'flex';
            });
        }
        
        const closeForgot = document.getElementById('closeForgotModal');
        if (closeForgot) {
            closeForgot.addEventListener('click', () => {
                document.getElementById('forgotModal').style.display = 'none';
            });
        }
        
        const forgotModal = document.getElementById('forgotModal');
        if (forgotModal) {
            forgotModal.addEventListener('click', (e) => {
                if (e.target === e.currentTarget) {
                    e.currentTarget.style.display = 'none';
                }
            });
        }
        
        const forgotForm = document.getElementById('forgotForm');
        if (forgotForm) {
            forgotForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const mobile = document.getElementById('forgotMobile').value.trim();
                const btn = e.target.querySelector('button');
                const originalText = btn.innerHTML;
                
                if (!mobile || !mobile.match(/^01[3-9]\d{8}$/)) {
                    alert('সঠিক মোবাইল নম্বর দিন!');
                    return;
                }
                
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> প্রক্রিয়াধীন...';
                
                try {
                    const { error } = await window.supabaseClient
                        .from('members')
                        .update({ password: '1234' })
                        .eq('mobile', mobile);
                    
                    if (error) throw error;
                    
                    showNotification('পাসওয়ার্ড রিসেট হয়েছে। নতুন পাসওয়ার্ড: 1234', 'success');
                    document.getElementById('forgotModal').style.display = 'none';
                    document.getElementById('forgotMobile').value = '';
                    
                } catch (err) {
                    console.error('Reset error:', err);
                    showNotification('পাসওয়ার্ড রিসেট ব্যর্থ!', 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            });
        }
    });
</script>
</body>
</html>
