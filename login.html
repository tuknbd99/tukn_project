<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>লগইন | TUKNBD</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- ২. Supabase Client তৈরি — উন্নত কনফিগারেশন -->
    <script>
        const supabaseUrl = 'https://bffomfsffrtfgxyetzvm.supabase.co';
        const supabaseKey = 'sb_publishable_A0BluIVwJ4M3Zd3JWpBoPg_NJSRu81D';
        
        // ✅ Login-এর জন্য সম্পূর্ণ স্বাধীন client
        // persistSession: false → পুরনো সেশন লোড হবে না
        // storageKey আলাদা → admin-panel-এর সাথে কনফ্লিক্ট নেই
        window.supabaseClient = supabase.createClient(supabaseUrl, supabaseKey, {
            auth: {
                persistSession: false,
                autoRefreshToken: false,
                detectSessionInUrl: false,
                storageKey: 'tuknbd-login-temp'
            }
        });
        
        // ✅ পুরনো সেশন ও ক্যাশ পরিষ্কার করুন (login-এর আগে)
        (function clearOldCache() {
            try {
                // admin-panel / index থেকে আসা পুরনো auth টোকেন মুছুন
                const keysToRemove = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && (
                        key.includes('supabase') || 
                        key.includes('tuknbd-auth-token') ||
                        key.includes('admin-token')
                    )) {
                        keysToRemove.push(key);
                    }
                }
                keysToRemove.forEach(k => localStorage.removeItem(k));
                
                if (keysToRemove.length > 0) {
                    console.log('🧹 পুরনো auth টোকেন মুছে ফেলা হয়েছে:', keysToRemove);
                }
            } catch(e) {
                console.warn('Cache clear warning:', e);
            }
        })();
        
        console.log('✅ Supabase Client initialized (login.html) — No persistent session');
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans Bengali', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0a2a3a 0%, #0d3b4f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        
        .home-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            z-index: 100;
        }
        
        .home-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: #9be564;
            color: #9be564;
            transform: translateY(-2px);
        }
        
        .login-container {
            max-width: 340px;
            width: 100%;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 32px 28px;
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease-out;
        }
        
        .login-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 50px -15px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.4);
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo-area {
            text-align: center;
            margin-bottom: 28px;
        }
        
        .logo-img {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            object-fit: cover;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
            margin-bottom: 12px;
            background: white;
            padding: 5px;
        }
        
        .logo-title {
            font-size: 16px;
            font-weight: 700;
            color: white;
        }
        
        .logo-title span {
            color: #9be564;
        }
        
        .input-field {
            margin-bottom: 20px;
            position: relative;
        }

        .input-field i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9be564;
            font-size: 14px;
        }

        .input-field input {
            width: 100%;
            padding: 10px 8px 10px 35px;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .input-field input:focus {
            border-color: #9be564;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 0 3px rgba(155, 229, 100, 0.2);
        }
        
        .input-field input::placeholder {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
        }
        
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-size: 13px;
        }
        
        .toggle-password:hover {
            color: #9be564;
        }
        
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        
        .checkbox-label input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #9be564;
        }
        
        .checkbox-label span {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .forgot-link {
            font-size: 12px;
            color: #9be564;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .forgot-link:hover {
            color: #7bc43a;
            text-decoration: underline;
        }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #9be564, #7bc43a);
            color: #0a2a3a;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .login-btn:hover {
            background: linear-gradient(135deg, #7bc43a, #9be564);
            transform: scale(1.02);
        }
        
        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal-content {
            background: white;
            border-radius: 24px;
            max-width: 400px;
            width: 100%;
            padding: 28px;
            animation: fadeInUp 0.3s ease;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
        }
        
        .modal-header h3 {
            font-size: 20px;
            font-weight: 700;
            color: #0a2a3a;
        }
        
        .modal-header button {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #94a3b8;
        }
        
        .modal-header button:hover {
            color: #dc2626;
        }
        
        .modal input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 16px;
        }
        
        .modal input:focus {
            outline: none;
            border-color: #9be564;
        }
        
        .modal-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0a2a3a, #0d3b4f);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        
        @media (max-width: 480px) {
            .login-container { max-width: 300px; }
            .login-card { padding: 25px 20px; }
            .logo-img { width: 70px; height: 70px; }
            .home-btn { top: 15px; right: 15px; padding: 6px 16px; font-size: 12px; }
        }
    </style>
</head>
<body>

<a href="index.html" class="home-btn">
    <i class="fas fa-home"></i> হোম
</a>

<div class="login-container">
    <div class="login-card">
        <div class="logo-area">
            <img src="images/logo.png" alt="TUKNBD Logo" class="logo-img" onerror="this.src='https://placehold.co/80x80/059669/white?text=T'">
            <div class="logo-title">
                ত্বলাবা-উলামা <span>কল্যাণ নেটওয়ার্ক</span>
            </div>
        </div>
        
        <form id="loginForm">
            <div class="input-field">
                <i class="fas fa-mobile-alt"></i>
                <input type="tel" id="username" placeholder="মোবাইল নম্বর" autocomplete="off">
            </div>
            
            <div class="input-field">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="পাসওয়ার্ড">
                <button type="button" id="togglePassword" class="toggle-password">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            
            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox" id="rememberMe">
                    <span>আমাকে মনে রাখুন</span>
                </label>
                <a href="#" id="forgotPasswordBtn" class="forgot-link">পাসওয়ার্ড ভুলে গেছেন?</a>
            </div>
            
            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt"></i> লগইন করুন
            </button>
        </form>
    </div>
</div>

<div id="forgotModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-key"></i> পাসওয়ার্ড রিসেট</h3>
            <button id="closeForgotModal">&times;</button>
        </div>
        <p style="color: #4b5563; font-size: 14px; margin-bottom: 16px;">আপনার রেজিস্টার্ড মোবাইল নম্বর দিন। নতুন পাসওয়ার্ড: <strong>1234</strong> সেট করা হবে।</p>
        <form id="forgotForm">
            <input type="tel" id="forgotMobile" placeholder="মোবাইল নম্বর (01XXXXXXXXX)">
            <button type="submit" class="modal-btn">রিসেট করুন</button>
        </form>
    </div>
</div>

<script>
    // ✅ Notification helper
    function showCenterNotification(message, type = 'success') {
        const existingOverlay = document.querySelector('.notification-overlay');
        if (existingOverlay) existingOverlay.remove();
        
        const styles = {
            success: { icon: '🎉', borderColor: '#10b981', bgColor: '#ecfdf5', title: 'স্বাগতম!', titleColor: '#059669' },
            error: { icon: '❌', borderColor: '#ef4444', bgColor: '#fef2f2', title: 'ব্যর্থ!', titleColor: '#dc2626' },
            warning: { icon: '⚠️', borderColor: '#f59e0b', bgColor: '#fffbeb', title: 'সতর্কতা!', titleColor: '#d97706' }
        };
        
        const s = styles[type] || styles.success;
        const overlay = document.createElement('div');
        overlay.className = 'notification-overlay';
        
        overlay.innerHTML = `
            <div style="background:white; border-radius:32px; max-width:360px; width:90%; overflow:hidden; box-shadow:0 30px 60px -20px rgba(0,0,0,0.4); border-top:5px solid ${s.borderColor}; animation:slideUp 0.4s ease;">
                <div style="text-align:center; padding:30px 20px 20px; background:${s.bgColor};">
                    <div style="font-size:64px; margin-bottom:10px;">${s.icon}</div>
                    <h3 style="font-size:24px; font-weight:800; color:${s.titleColor}; margin:0;">${s.title}</h3>
                </div>
                <div style="padding:25px; text-align:center;">
                    <p style="color:#4b5563; font-size:15px; line-height:1.7; margin:0 0 25px;">${message}</p>
                    <button onclick="this.closest('.notification-overlay').remove()" style="background:${s.borderColor}; color:white; border:none; padding:12px 35px; border-radius:40px; font-size:15px; font-weight:600; cursor:pointer;">
                        <i class="fas fa-check-circle" style="margin-right:8px;"></i>ঠিক আছে
                    </button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
        setTimeout(() => { if (overlay.parentNode) overlay.remove(); }, 4000);
    }

    document.addEventListener('DOMContentLoaded', function() {
        
        // ✅ পাসওয়ার্ড টগল
        document.getElementById('togglePassword').addEventListener('click', function() {
            const pwd = document.getElementById('password');
            const type = pwd.getAttribute('type') === 'password' ? 'text' : 'password';
            pwd.setAttribute('type', type);
            this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        });

        // ✅ লগইন সাবমিট
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const mobile = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const btn = this.querySelector('.login-btn');
            const originalText = btn.innerHTML;

            if (!mobile || !mobile.match(/^01[3-9]\d{8}$/)) {
                showCenterNotification('সঠিক মোবাইল নম্বর দিন (01XXXXXXXXX)', 'error');
                return;
            }
            if (!password) {
                showCenterNotification('পাসওয়ার্ড দিন!', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> লগইন হচ্ছে...';

            try {
                console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
                console.log('🔐 Login attempt:', mobile);
                console.log('🌐 Supabase Client:', !!window.supabaseClient);
                
                if (!window.supabaseClient) {
                    throw new Error('Supabase client not initialized');
                }

                // ✅ RPC কল করে লগইন চেক
                const { data, error } = await window.supabaseClient.rpc('login_member', {
                    input_username: mobile,
                    input_password: password
                });

                console.log('📊 RPC Response Data:', data);
                console.log('❌ RPC Response Error:', error);

                if (error) {
                    console.error('❌ RPC Error Details:', error);
                    throw new Error(error.message || 'RPC call failed');
                }

                const member = data?.[0];

                if (!member) {
                    console.log('❌ Member not found');
                    showCenterNotification('মোবাইল নম্বর অথবা পাসওয়ার্ড সঠিক নয়!', 'error');
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                    return;
                }

                console.log('✅ Member found:', member.full_name, '| Status:', member.status);

                // ✅ স্ট্যাটাস চেক
                if (member.status === 'active' || member.status === 'approved') {
                    
                    const userData = {
                        member_id: member.member_id,
                        full_name: member.full_name,
                        mobile: member.mobile,
                        refer_code: member.refer_code,
                        join_date: member.join_date,
                        member_term: member.member_term || 12,
                        member_type: member.member_type || 'মেয়াদী',
                        monthly_savings: member.monthly_savings || 500,
                        profile_image: member.profile_image || null,
                        status: member.status,
                        user_uuid: member.user_uuid,
                        loggedIn: true,
                        loginTime: new Date().toISOString()
                    };

                    if (rememberMe) {
                        localStorage.setItem('tukn_logged_member', JSON.stringify(userData));
                    }
                    sessionStorage.setItem('tukn_logged_member', JSON.stringify(userData));

                    showCenterNotification(`
                        <div style="text-align:center;">
                            <div style="font-size:18px; font-weight:bold; margin-bottom:5px;">${member.full_name}</div>
                            <div style="font-size:13px; color:#666;">আপনি সফলভাবে লগইন করেছেন!</div>
                        </div>
                    `, 'success');

                    setTimeout(() => {
                        window.location.href = 'member-dashboard.html';
                    }, 1500);
                    
                } else if (member.status === 'pending') {
                    showCenterNotification('আপনার একাউন্ট এখনও অনুমোদিত হয়নি। ৩-১২ ঘণ্টা অপেক্ষা করুন।', 'warning');
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                } else {
                    showCenterNotification('আপনার একাউন্টটি নিষ্ক্রিয়। প্রশাসকের সাথে যোগাযোগ করুন।', 'error');
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }

            } catch (err) {
                console.error('❌ Login error:', err);
                showCenterNotification(
                    'লগইন করতে ব্যর্থ হয়েছে!<br>' +
                    '<small style="color:#9ca3af; font-size:12px;">' + 
                    (err.message || 'নেটওয়ার্ক চেক করুন') + 
                    '</small>', 
                    'error'
                );
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        // ✅ Forgot password মডাল
        document.getElementById('forgotPasswordBtn').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('forgotModal').style.display = 'flex';
        });

        document.getElementById('closeForgotModal').addEventListener('click', () => {
            document.getElementById('forgotModal').style.display = 'none';
        });

        document.getElementById('forgotModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                e.currentTarget.style.display = 'none';
            }
        });

        // ✅ Forgot password submit (RPC দিয়ে)
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mobile = document.getElementById('forgotMobile').value.trim();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;

            if (!mobile || !mobile.match(/^01[3-9]\d{8}$/)) {
                alert('সঠিক মোবাইল নম্বর দিন!');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> প্রক্রিয়াধীন...';

            try {
                // ✅ সরাসরি DB-তে আপডেট (RPC দিয়ে)
                const { error } = await window.supabaseClient.rpc('reset_password_1234', {
                    input_mobile: mobile
                });
                
                if (error) {
                    // যদি RPC না থাকে, fallback
                    console.warn('RPC reset failed, trying direct update...');
                    const { error: updError } = await window.supabaseClient
                        .from('members')
                        .update({ password: '1234' })
                        .eq('mobile', mobile);
                    
                    if (updError) throw updError;
                }
                
                showCenterNotification('পাসওয়ার্ড রিসেট হয়েছে। নতুন পাসওয়ার্ড: 1234', 'success');
                document.getElementById('forgotModal').style.display = 'none';
                document.getElementById('forgotMobile').value = '';
                
            } catch (err) {
                console.error('Reset error:', err);
                showCenterNotification('পাসওয়ার্ড রিসেট ব্যর্থ!', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });
    });
</script>
</body>
</html>
