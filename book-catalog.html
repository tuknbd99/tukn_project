        .price-tag span { font-weight: 700; color: #059669; }
        .discount-badge { background: #fef3c7; color: #b45309; font-size: 11px; padding: 0 8px; border-radius: 12px; font-weight: 600; }
        .admin-edit-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: transparent;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .admin-edit-btn:hover { background: #e5e7eb; color: #059669; }
        .add-book-btn {
            background: #ecfdf5;
            border: 2px dashed #10b981;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #059669;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .add-book-btn:hover { background: #d1fae5; border-color: #059669; }
        .modal-overlay {

            display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px;

</head>

<div class="container mx-auto px-4 py-6 max-w-5xl">
    
    <a href="index.html" class="back-link mb-4"><i class="fas fa-arrow-left"></i> হোমপেজে ফিরে যান</a>

    <div class="card">
        <div class="card-header flex justify-between items-center">

        </div>
        <div class="card-body">

            <!-- শ্রেণী অনুযায়ী কিতাবের তালিকা -->
            <div id="bookCatalogContainer">
                <!-- ডায়নামিক জেনারেট হবে -->
            </div>

            <!-- "কিতাব যুক্ত করুন" বাটন -->
            <div class="mt-8">
                <button onclick="openAddBookModal()" class="add-book-btn w-full">
                    <i class="fas fa-plus-circle text-3xl"></i>
                    <span>কিতাব যুক্ত করুন</span>
                    <span class="text-xs text-gray-400 font-normal">একাধিক কিতাব যুক্ত করতে পারেন</span>
                </button>
            </div>

        </div>

</div>

<!-- ➕ কিতাব যুক্ত করার মোডাল -->
<div id="addBookModal" class="modal-overlay" onclick="if(event.target===this) closeAddBookModal()">

        </div>
        <div>
            <div class="mb-4">
                <label class="form-label">কিতাবের নাম <span class="text-red-500">*</span></label>

                    <label class="form-label">বিক্রয় মূল্য <span class="text-red-500">*</span></label>
                    <input type="number" id="newSellingPrice" class="form-control" placeholder="০" value="0">

                </div>
                <div>

                    <option value="নাহবেমীর">নাহবেমীর</option>
                    <option value="মিযান">মিযান</option>
                    <option value="শরহে বেকায়া">শরহে বেকায়া</option>

    </div>
</div>

            <div class="mb-3">
                <label class="form-label">শ্রেণী</label>
                <select id="editCategory" class="form-control"></select>
            </div>
            <input type="hidden" id="editBookId">
            <div class="flex gap-3">
                <button onclick="saveBookEdit()" class="btn btn-success flex-1 py-2"><i class="fas fa-save mr-2"></i> সংরক্ষণ</button>

            </div>
        </div>
    </div>
</div>

    try {

    return null;
}

    localStorage.setItem('tukn_book_catalog', JSON.stringify(data));
}

// ======================================================================
// STATE
// ======================================================================

let books = [];
let editingBookId = null;

// ======================================================================
// INIT
// ======================================================================

function init() {
    const saved = loadData();
    if (saved && Array.isArray(saved) && saved.length > 0) {
        books = saved;
    } else {
        books = DEFAULT_BOOKS.map(b => ({ ...b }));
        saveData(books);
    }
    renderCatalog();
    populateCategorySelects();
}

// ======================================================================
// RENDER CATALOG
// ======================================================================

function renderCatalog() {
    const container = document.getElementById('bookCatalogContainer');
    if (!container) return;

    // শ্রেণী অনুযায়ী গ্রুপ
    const groups = {};
    books.forEach(book => {
        const cat = book.category || 'অন্যান্য';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push(book);
    });

    let html = '';
    for (const [cat, items] of Object.entries(groups)) {
        html += `<div class="class-group"><div class="class-header"><i class="fas fa-layer-group mr-1"></i> ${cat}</div>`;
        html += `<div class="book-grid mt-2">`;
        items.forEach(book => {
            const profit = book.sellingPrice - book.purchasePrice;
            const total = book.sellingPrice;
            const discount = book.discount || 0;
            const finalPrice = total - (total * discount / 100);
            html += `
                <div class="book-card" data-id="${book.id}">
                    <button class="admin-edit-btn" onclick="openEditBookModal(${book.id})" title="সম্পাদনা করুন">
                        <i class="fas fa-pen"></i>
                    </button>
                    <div class="book-name">${book.name}</div>
                    <div class="book-price-row">
                        <span class="price-tag">ক্রয়: <span>${book.purchasePrice || 0}</span></span>
                        <span class="price-tag">বিক্রয়: <span>${book.sellingPrice || 0}</span></span>
                    </div>
                    <div class="book-price-row">
                        <span class="price-tag">ছাড়: <span>${book.discount || 0}%</span></span>
                        <span class="price-tag">লাভ: <span>${profit > 0 ? profit : 0}</span></span>
                        <span class="price-tag">মোট: <span>${book.sellingPrice || 0}</span></span>
                    </div>
                </div>
            `;
        });
        html += `</div></div>`;
    }

    container.innerHTML = html;
}

// ======================================================================
// POPULATE CATEGORY SELECTS
// ======================================================================

function populateCategorySelects() {
    const cats = [...new Set(books.map(b => b.category).filter(Boolean))].sort();
    const selects = ['editCategory', 'newCategory'];
    selects.forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        const current = el.value;
        el.innerHTML = '';
        cats.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c;
            opt.textContent = c;
            el.appendChild(opt);
        });
        // "অন্যান্য" যোগ করুন
        if (!cats.includes('অন্যান্য')) {
            const opt = document.createElement('option');
            opt.value = 'অন্যান্য';
            opt.textContent = 'অন্যান্য';
            el.appendChild(opt);
        }
        if (current) el.value = current;
    });
}

// ======================================================================
// ADD BOOK MODAL
// ======================================================================

function openAddBookModal() {
    document.getElementById('addBookModal').classList.add('active');
    document.getElementById('newBookName').value = '';
    document.getElementById('newPurchasePrice').value = '0';
    document.getElementById('newSellingPrice').value = '0';
    document.getElementById('newDiscount').value = '0';
    document.getElementById('newProfit').value = '0';
    document.getElementById('newCategory').value = 'অন্যান্য';
}

function closeAddBookModal() {
    document.getElementById('addBookModal').classList.remove('active');
}

function addNewBook() {
    const name = document.getElementById('newBookName').value.trim();
    if (!name) {
        showToast('কিতাবের নাম লিখুন!', 'error');
        return;
    }
    const purchasePrice = parseFloat(document.getElementById('newPurchasePrice').value) || 0;
    const sellingPrice = parseFloat(document.getElementById('newSellingPrice').value) || 0;
    const discount = parseFloat(document.getElementById('newDiscount').value) || 0;
    const profit = parseFloat(document.getElementById('newProfit').value) || 0;
    const category = document.getElementById('newCategory').value || 'অন্যান্য';

    // নতুন ID তৈরি
    const maxId = books.reduce((max, b) => Math.max(max, b.id), 0);
    const newBook = {
        id: maxId + 1,
        name: name,
        category: category,
        purchasePrice: purchasePrice,
        sellingPrice: sellingPrice,
        discount: discount,
        profit: profit
    };
    books.push(newBook);
    saveData(books);
    renderCatalog();
    populateCategorySelects();
    closeAddBookModal();
    showToast(`"${name}" কিতাব যুক্ত হয়েছে!`, 'success');
}

// ======================================================================
// EDIT BOOK MODAL
// ======================================================================

function openEditBookModal(bookId) {
    const book = books.find(b => b.id === bookId);
    if (!book) return;
    editingBookId = bookId;
    document.getElementById('editBookId').value = bookId;
    document.getElementById('editBookName').value = book.name;
    document.getElementById('editPurchasePrice').value = book.purchasePrice || 0;
    document.getElementById('editSellingPrice').value = book.sellingPrice || 0;
    document.getElementById('editDiscount').value = book.discount || 0;
    document.getElementById('editProfit').value = book.profit || 0;
    document.getElementById('editCategory').value = book.category || 'অন্যান্য';
    document.getElementById('editBookModal').classList.add('active');
}

function closeEditBookModal() {
    document.getElementById('editBookModal').classList.remove('active');
    editingBookId = null;
}

function saveBookEdit() {
    const id = parseInt(document.getElementById('editBookId').value);
    const book = books.find(b => b.id === id);
    if (!book) return;
    const name = document.getElementById('editBookName').value.trim();
    if (!name) { showToast('নাম লিখুন!', 'error'); return; }
    book.name = name;
    book.purchasePrice = parseFloat(document.getElementById('editPurchasePrice').value) || 0;
    book.sellingPrice = parseFloat(document.getElementById('editSellingPrice').value) || 0;
    book.discount = parseFloat(document.getElementById('editDiscount').value) || 0;
    book.profit = parseFloat(document.getElementById('editProfit').value) || 0;
    book.category = document.getElementById('editCategory').value || 'অন্যান্য';
    saveData(books);
    renderCatalog();
    populateCategorySelects();
    closeEditBookModal();
    showToast('কিতাব আপডেট করা হয়েছে!', 'success');
}

function deleteBook() {
    const id = parseInt(document.getElementById('editBookId').value);
    if (!confirm('এই কিতাবটি মুছে ফেলতে চান?')) return;
    books = books.filter(b => b.id !== id);
    saveData(books);
    renderCatalog();
    populateCategorySelects();
    closeEditBookModal();
    showToast('কিতাব মুছে ফেলা হয়েছে।', 'info');
}

// ======================================================================
// TOAST
// ======================================================================

function showToast(message, type = 'success') {
    const toast = document.createElement('div');
    toast.className = `toast ${type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-600' : 'bg-blue-600'}`;
    toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'} mr-2"></i> ${message}`;
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
    }, 3500);
}
