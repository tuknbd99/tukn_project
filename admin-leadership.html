<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Leadership Management | TUKNBD Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans Bengali', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            min-height: 100vh;
            color: #1f2937;
        }
        
        .admin-header {
            background: linear-gradient(135deg, #064e3b, #059669);
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 20px rgba(5, 150, 105, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .admin-header-left h1 {
            font-size: 22px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .admin-header-left h1 i {
            background: rgba(255,255,255,0.2);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .admin-header-left p {
            font-size: 12px;
            opacity: 0.85;
            margin-top: 4px;
            margin-left: 54px;
        }
        
        .admin-header-right {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 11px 22px;
            border-radius: 50px;
            border: none;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            text-decoration: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #fcd34d, #fbbf24);
            color: #064e3b;
            box-shadow: 0 4px 15px rgba(252,211,77,0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(252,211,77,0.5);
        }
        
        .btn-outline {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1.5px solid rgba(255,255,255,0.3);
        }
        
        .btn-outline:hover {
            background: rgba(255,255,255,0.25);
        }
        
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 25px 20px 60px;
        }
        
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
            border-left: 4px solid #0d9488;
        }
        
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            flex-shrink: 0;
        }
        
        .stat-icon.green { background: linear-gradient(135deg, #059669, #10b981); }
        .stat-icon.blue { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .stat-icon.amber { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .stat-icon.purple { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        
        .stat-info { flex: 1; min-width: 0; }
        .stat-value { font-size: 24px; font-weight: 800; color: #1f2937; line-height: 1.2; }
        .stat-label { font-size: 12px; color: #6b7280; font-weight: 600; }
        
        .leaders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .leaders-grid { grid-template-columns: 1fr; }
        }
        
        .admin-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
        }
        
        .admin-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.12);
            border-color: #a7f3d0;
        }
        
        .admin-card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px;
            background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
            position: relative;
        }
        
        .admin-branch-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            box-shadow: 0 2px 6px rgba(59, 130, 246, 0.3);
            z-index: 2;
        }
        
        .admin-card-photo {
            width: 80px;
            height: 100px;
            border-radius: 10px;
            object-fit: cover;
            border: 3px solid white;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            background: linear-gradient(135deg, #059669, #10b981);
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        
        .admin-card:hover .admin-card-photo {
            transform: scale(1.05);
            border-color: #fcd34d;
        }
        
        .admin-photo-placeholder {
            width: 80px;
            height: 100px;
            border-radius: 10px;
            background: linear-gradient(135deg, #059669, #10b981);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: 800;
            border: 3px solid white;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        
        .admin-card:hover .admin-photo-placeholder {
            transform: scale(1.05);
            border-color: #fcd34d;
        }
        
        .admin-card-info {
            flex: 1;
            min-width: 0;
            padding-right: 5px;
        }
        
        .admin-card-name {
            font-size: 16px;
            font-weight: 800;
            color: #064e3b;
            margin-bottom: 4px;
            line-height: 1.3;
            word-break: break-word;
        }
        
        .admin-card-desig {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 10.5px;
            font-weight: 700;
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            margin-bottom: 6px;
        }
        
        .admin-card-id {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            background: linear-gradient(135deg, #faf5ff, #ede9fe);
            color: #5b21b6;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }
        
        .admin-card-id i {
            color: #8b5cf6;
            font-size: 9px;
        }
        
        .admin-status-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 3px 10px;
            border-radius: 50px;
            font-size: 9.5px;
            font-weight: 700;
            z-index: 2;
        }
        
        .admin-status-badge.active {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            color: #065f46;
        }
        
        .admin-status-badge.inactive {
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            color: #991b1b;
        }
        
        .admin-card-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 12px 15px;
            border-top: 1px solid #e5e7eb;
            background: linear-gradient(135deg, #f9fafb, #f0fdf4);
        }
        
        .action-btn {
            padding: 9px 8px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-family: inherit;
            color: white;
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }
        
        .action-btn.edit { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .action-btn.toggle { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .action-btn.delete { background: linear-gradient(135deg, #ef4444, #dc2626); }
        
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 70px 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }
        
        .empty-state i {
            font-size: 70px;
            color: #d1d5db;
            margin-bottom: 20px;
            display: block;
        }
        
        .empty-state h3 {
            font-size: 20px;
            color: #374151;
            margin-bottom: 8px;
        }
        
        .empty-state p {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 20px;
        }
        
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-y: auto;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 30px;
            max-width: 700px;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin: auto;
        }
        
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(-20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e5e7eb;
        }
        
        .modal-header h3 {
            font-size: 20px;
            color: #064e3b;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .modal-header h3 i {
            color: #059669;
        }
        
        .modal-close {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #f3f4f6;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #6b7280;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .modal-close:hover {
            background: #e5e7eb;
            transform: rotate(90deg);
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #374151;
            margin-bottom: 6px;
        }
        
        .form-group label .required {
            color: #ef4444;
            margin-left: 3px;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
            background: white;
            color: #1f2937;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5,150,105,0.1);
        }
        
        textarea.form-control {
            resize: vertical;
            min-height: 90px;
            line-height: 1.6;
        }
        
        select.form-control {
            cursor: pointer;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
        }
        
        .photo-upload-area {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: #f9fafb;
            border-radius: 14px;
            border: 2px dashed #d1d5db;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }
        
        .photo-upload-area:hover {
            border-color: #059669;
            background: #f0fdf4;
        }
        
        .photo-preview-box {
            width: 96px;
            height: 120px;
            border-radius: 10px;
            overflow: hidden;
            background: linear-gradient(135deg, #059669, #10b981);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: 800;
            border: 3px solid white;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }
        
        .photo-preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .photo-upload-controls {
            flex: 1;
            min-width: 0;
        }
        
        .photo-upload-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 10px;
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            color: #047857;
            font-weight: 700;
            font-size: 12.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1.5px solid #059669;
            margin-bottom: 6px;
        }
        
        .photo-upload-btn:hover {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
        }
        
        .photo-hint {
            font-size: 11px;
            color: #6b7280;
            line-height: 1.5;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 22px;
            padding-top: 20px;
            border-top: 2px solid #e5e7eb;
        }
        
        .modal-actions .btn {
            flex: 1;
            justify-content: center;
            padding: 14px;
            font-size: 14px;
        }
        
        .btn-cancel {
            background: #f3f4f6;
            color: #4b5563;
        }
        
        .btn-cancel:hover {
            background: #e5e7eb;
        }
        
        .btn-save {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
        }
        
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(5,150,105,0.3);
        }
        
        .btn-save:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .full-page-loader {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        
        .full-page-loader .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e5e7eb;
            border-top-color: #059669;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        .full-page-loader p {
            color: #059669;
            font-weight: 700;
        }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 22px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            z-index: 9999;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 400px;
        }
        
        .toast.success { background: linear-gradient(135deg, #059669, #10b981); }
        .toast.error { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .toast.info { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .toast.warning { background: linear-gradient(135deg, #f59e0b, #d97706); }
        
        @media (max-width: 480px) {
            .admin-header { padding: 18px 15px; }
            .admin-header-left h1 { font-size: 18px; }
            .admin-header-left h1 i { width: 38px; height: 38px; font-size: 18px; }
            .admin-header-left p { margin-left: 50px; font-size: 11px; }
            .container { padding: 18px 12px 40px; }
            .admin-card-photo,
            .admin-photo-placeholder { width: 70px; height: 88px; font-size: 28px; }
            .admin-card-name { font-size: 15px; }
            .admin-card-actions { grid-template-columns: 1fr; gap: 6px; padding: 10px; }
            .action-btn { font-size: 12px; padding: 10px; }
        }
    </style>
</head>
<body>

<div id="pageLoader" class="full-page-loader">
    <div class="spinner"></div>
    <p>Loading...</p>
</div>

<div id="adminContent" style="display: none;">
    
    <div class="admin-header">
        <div class="admin-header-left">
            <h1>
                <i class="fas fa-user-tie"></i>
                Leadership Management
            </h1>
            <p>TUKNBD - Manage leadership information, photos and branches</p>
        </div>
        <div class="admin-header-right">
            <button class="btn btn-primary" onclick="openLeaderModal()">
                <i class="fas fa-plus"></i> Add New
            </button>
            <a href="admin-panel.html" class="btn btn-outline" id="backToPanelBtn">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>
    </div>
    
    <div class="container">
        
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-icon green"><i class="fas fa-users"></i></div>
                <div class="stat-info">
                    <div class="stat-value" id="statTotal">0</div>
                    <div class="stat-label">Total Leaders</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon blue"><i class="fas fa-check-circle"></i></div>
                <div class="stat-info">
                    <div class="stat-value" id="statActive">0</div>
                    <div class="stat-label">Active</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon amber"><i class="fas fa-pause-circle"></i></div>
                <div class="stat-info">
                    <div class="stat-value" id="statInactive">0</div>
                    <div class="stat-label">Inactive</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple"><i class="fas fa-building"></i></div>
                <div class="stat-info">
                    <div class="stat-value" id="statBranches">0</div>
                    <div class="stat-label">Branches</div>
                </div>
            </div>
        </div>
        
        <div id="leadersContainer" class="leaders-grid"></div>
        
    </div>
</div>

<div id="leaderModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">
                <i class="fas fa-user-plus"></i>
                <span>Add New Leader</span>
            </h3>
            <button class="modal-close" onclick="closeLeaderModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <form id="leaderForm" onsubmit="saveLeader(event); return false;">
            <input type="hidden" id="editingId">
            
            <div class="form-group">
                <label>Photo</label>
                <div class="photo-upload-area">
                    <div id="photoPreviewBox" class="photo-preview-box">?</div>
                    <div class="photo-upload-controls">
                        <label class="photo-upload-btn">
                            <i class="fas fa-upload"></i>
                            <span>Select Photo</span>
                            <input type="file" id="photoInput" accept="image/*" style="display:none;" onchange="handlePhotoSelect(event)">
                        </label>
                        <p class="photo-hint">
                            1.6 x 2.0 ratio (e.g. 400x500px)<br>
                            Passport size, white background<br>
                            Max 2 MB
                        </p>
                    </div>
                </div>
                <input type="url" id="photoUrlInput" class="form-control" placeholder="Or paste photo URL">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Name (Bangla) <span class="required">*</span></label>
                    <input type="text" id="nameInput" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Full Name (English)</label>
                    <input type="text" id="nameEnInput" class="form-control">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Designation (Bangla) <span class="required">*</span></label>
                    <input type="text" id="designationInput" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Designation (English)</label>
                    <input type="text" id="designationEnInput" class="form-control">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Designation Icon</label>
                    <input type="text" id="designationIconInput" class="form-control" maxlength="4">
                </div>

            <div class="form-group">

<script>
// ============================================================
// SUPABASE CONFIG
// ============================================================
var SUPABASE_URL = 'https://bffomfsffrtfgxyetzvm.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_A0BluIVwJ4M3Zd3JWpBoPg_NJSRu81D';
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

var allLeaders = [];
var allBranches = [];
var selectedPhotoFile = null;
var currentAdmin = null;
var leadershipRealtimeChannel = null;

// ============================================================
// Toast Notification
// ============================================================
function showToast(message, type) {
    if (!type) type = 'success';
    var toast = document.createElement('div');
    toast.className = 'toast ' + type;
    var icons = {
        success: 'fa-check-circle',
        error: 'fa-exclamation-circle',
        warning: 'fa-exclamation-triangle',
        info: 'fa-info-circle'
    };
    var icon = icons[type] || 'fa-info-circle';
    toast.innerHTML = '<i class="fas ' + icon + '"></i><span>' + message + '</span>';
    document.body.appendChild(toast);
    
    setTimeout(function() {
        toast.style.opacity = '0';
        setTimeout(function() { 
            if (toast.parentNode) toast.remove(); 
        }, 300);
    }, 3500);
}

// ============================================================
// INIT — Page load
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    console.log('======================================');
    console.log('Loading admin-leadership.html...');
    console.log('======================================');
    
    var isInIframe = window.self !== window.top;
    console.log('isInIframe:', isInIframe);
    
    var adminData = null;
    try {
        adminData = localStorage.getItem('currentAdmin') || sessionStorage.getItem('currentAdmin');
    } catch(e) {
        console.error('Storage error:', e);
    }
    
    if (!isInIframe && !adminData) {
        alert('Please login as admin first!');
        window.location.href = 'admin-login.html';
        return;
    }
    
    try {
        if (adminData) {
            currentAdmin = JSON.parse(adminData);
            console.log('Admin loaded:', currentAdmin.full_name || currentAdmin.username);
        } else {
            currentAdmin = { 
                name: 'Admin (iframe)', 
                role: 'super_admin',
                full_name: 'Admin' 
            };
            console.log('Default admin for iframe mode');
        }
    } catch(e) {
        console.error('Admin parse error:', e);
        if (!isInIframe) {
            window.location.href = 'admin-login.html';
            return;
        }
        currentAdmin = { name: 'Admin', role: 'super_admin' };
    }
    
    if (isInIframe) {
        var backBtn = document.getElementById('backToPanelBtn');
        if (backBtn) backBtn.style.display = 'none';
    }
    
    // Load data
    loadBranches().then(function() {
        return loadLeaders();
    }).then(function() {
        var loader = document.getElementById('pageLoader');
        var content = document.getElementById('adminContent');
        if (loader) loader.style.display = 'none';
        if (content) content.style.display = 'block';
        console.log('Page ready!');
        
        // Setup realtime
        setupRealtime();
    }).catch(function(e) {
        console.error('Init error:', e);
        var loader = document.getElementById('pageLoader');
        var content = document.getElementById('adminContent');
        if (loader) loader.style.display = 'none';
        if (content) content.style.display = 'block';
    });
});

// ============================================================
// REALTIME — Auto sync leadership changes
// ============================================================
function setupRealtime() {
    if (leadershipRealtimeChannel) {
        try { sb.removeChannel(leadershipRealtimeChannel); } catch(e) {}
    }
    
    leadershipRealtimeChannel = sb
        .channel('leadership-live')
        .on(
            'postgres_changes',
            { 
                event: '*', 
                schema: 'public', 
                table: 'leadership' 
            },
            function(payload) {
                console.log('🔔 Realtime update:', payload.eventType);
                loadLeaders();
            }
        )
        .subscribe(function(status) {
            console.log('📡 Realtime status:', status);
        });
}

// ============================================================
// Branches লোড
// ============================================================
async function loadBranches() {
    try {
        var result = await sb
            .from('branches')
            .select('branch_code, branch_name, branch_name_en, district, display_order, status')
            .eq('status', 'active')
            .order('display_order', { ascending: true });
        
        if (result.error) throw result.error;
        
        allBranches = result.data || [];
        
        var select = document.getElementById('branchInput');
        var optionsHtml = '<option value="">-- Select Branch --</option>';
        
        for (var i = 0; i < allBranches.length; i++) {
            var b = allBranches[i];
            var name = b.branch_name || '';
            var nameEn = b.branch_name_en || '';
            var district = b.district || '';
            var code = b.branch_code || '';
            
            optionsHtml += '<option value="' + code + '" data-name="' + name + '" data-name-en="' + nameEn + '">' + name + ' (' + district + ')</option>';
        }
        
        select.innerHTML = optionsHtml;
        document.getElementById('statBranches').textContent = allBranches.length;
        
        console.log('✅ Branches loaded:', allBranches.length);
        
    } catch(e) {
        console.error('Branch load error:', e);
        showToast('Failed to load branches', 'error');
    }
}

// ============================================================
// Leaders লোড
// ============================================================
async function loadLeaders() {
    var container = document.getElementById('leadersContainer');
    if (!container) return;
    
    container.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="loading-spinner" style="border-color:#e5e7eb; border-top-color:#059669; width:40px; height:40px;"></div><p style="margin-top:15px; color:#6b7280;">Loading leaders...</p></div>';
    
    try {
        console.log('🔍 Loading leaders from DB...');
        
        var result = await sb
            .from('leadership')
            .select('*')
            .order('display_order', { ascending: true });
        
        if (result.error) throw result.error;
        
        allLeaders = result.data || [];
        
        console.log('✅ Loaded ' + allLeaders.length + ' leaders from DB');
        
        updateStats();
        renderLeaders();
        
    } catch(e) {
        console.error('❌ Leader load error:', e);
        var errMsg = e.message || 'Unknown error';
        container.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-exclamation-triangle" style="color:#ef4444;"></i><h3>Load Failed</h3><p>' + errMsg + '</p></div>';
    }
}

function updateStats() {
    var total = allLeaders.length;
    var active = 0;
    for (var i = 0; i < allLeaders.length; i++) {
        if (allLeaders[i].is_active) active++;
    }
    var inactive = total - active;
    
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statActive').textContent = active;
    document.getElementById('statInactive').textContent = inactive;
}

// ============================================================
// Leaders রেন্ডার
// ============================================================
function renderLeaders() {
    var container = document.getElementById('leadersContainer');
    if (!container) return;
    
    if (!allLeaders || allLeaders.length === 0) {
        container.innerHTML = '<div class="empty-state"><i class="fas fa-user-slash"></i><h3>No Leaders Yet</h3><p>Click "Add New" to add your first leader</p><button class="btn btn-primary" onclick="openLeaderModal()" style="margin-top:15px;"><i class="fas fa-plus"></i> Add First Leader</button></div>';
        return;
    }
    
    var html = '';
    
    for (var i = 0; i < allLeaders.length; i++) {
        var leader = allLeaders[i];
        var nameStr = leader.name || 'No Name';
        var firstChar = nameStr.charAt(0);
        
        var photoHTML;
        if (leader.photo_url) {
            photoHTML = '<img src="' + leader.photo_url + '" alt="' + nameStr + '" class="admin-card-photo">';
        } else {
            photoHTML = '<div class="admin-photo-placeholder">' + firstChar + '</div>';
        }
        
        var branchBadge = '';
        if (leader.branch_name) {
            branchBadge = '<span class="admin-branch-badge"><i class="fas fa-map-marker-alt"></i> ' + leader.branch_name + '</span>';
        }
        
        var statusBadge;
        if (leader.is_active) {
            statusBadge = '<span class="admin-status-badge active">Active</span>';
        } else {
            statusBadge = '<span class="admin-status-badge inactive">Inactive</span>';
        }
        
        var iconStr = leader.designation_icon || '';
        var desigStr = leader.designation || 'No Designation';
        var idStr = leader.member_id || '-';
        var toggleLabel = leader.is_active ? 'Disable' : 'Enable';
        
        html += '<div class="admin-card" data-id="' + leader.id + '">';
        html += '<div class="admin-card-header">';
        html += statusBadge;
        html += branchBadge;
        html += photoHTML;
        html += '<div class="admin-card-info">';
        html += '<div class="admin-card-name">' + nameStr + '</div>';
        html += '<div class="admin-card-desig">' + iconStr + ' ' + desigStr + '</div>';
        html += '<div class="admin-card-id"><i class="fas fa-id-badge"></i> ' + idStr + '</div>';
        html += '</div></div>';
        html += '<div class="admin-card-actions">';
        html += '<button class="action-btn edit" onclick="editLeader(\'' + leader.id + '\')"><i class="fas fa-edit"></i> Edit</button>';
        html += '<button class="action-btn toggle" onclick="toggleLeader(\'' + leader.id + '\')"><i class="fas fa-power-off"></i> ' + toggleLabel + '</button>';
        html += '<button class="action-btn delete" onclick="deleteLeader(\'' + leader.id + '\')"><i class="fas fa-trash"></i> Delete</button>';
        html += '</div></div>';
    }
    
    container.innerHTML = html;
}

// ============================================================
// Modal Functions
// ============================================================
function openLeaderModal() {
    document.getElementById('modalTitle').innerHTML = '<i class="fas fa-user-plus"></i><span>Add New Leader</span>';
    document.getElementById('leaderForm').reset();
    document.getElementById('editingId').value = '';
    document.getElementById('photoPreviewBox').innerHTML = '?';
    selectedPhotoFile = null;
    
    var maxOrder = 0;
    for (var i = 0; i < allLeaders.length; i++) {
        var o = allLeaders[i].display_order || 0;
        if (o > maxOrder) maxOrder = o;
    }
    document.getElementById('orderInput').value = maxOrder + 1;
    
    document.getElementById('leaderModal').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function editLeader(id) {
    var leader = null;
    for (var i = 0; i < allLeaders.length; i++) {
        if (allLeaders[i].id === id) { 
            leader = allLeaders[i]; 
            break; 
        }
    }
    if (!leader) return;
    
    document.getElementById('modalTitle').innerHTML = '<i class="fas fa-user-edit"></i><span>Edit Leader</span>';
    
    document.getElementById('editingId').value = id;
    document.getElementById('nameInput').value = leader.name || '';
    document.getElementById('nameEnInput').value = leader.name_en || '';
    document.getElementById('designationInput').value = leader.designation || '';
    document.getElementById('designationEnInput').value = leader.designation_en || '';
    document.getElementById('designationIconInput').value = leader.designation_icon || '';
    document.getElementById('memberIdInput').value = leader.member_id || '';
    document.getElementById('branchInput').value = leader.branch_code || '';
    document.getElementById('shortBioInput').value = leader.short_bio || '';
    document.getElementById('shortBioEnInput').value = leader.short_bio_en || '';
    document.getElementById('messageInput').value = leader.message || '';
    document.getElementById('messageEnInput').value = leader.message_en || '';
    document.getElementById('mobileInput').value = leader.mobile || '';
    document.getElementById('emailInput').value = leader.email || '';
    document.getElementById('facebookInput').value = leader.facebook_url || '';
    document.getElementById('whatsappInput').value = leader.whatsapp_url || '';
    document.getElementById('telegramInput').value = leader.telegram_url || '';
    document.getElementById('orderInput').value = leader.display_order || 1;
    document.getElementById('photoUrlInput').value = leader.photo_url || '';
    
    var previewBox = document.getElementById('photoPreviewBox');
    if (leader.photo_url) {
        previewBox.innerHTML = '<img src="' + leader.photo_url + '">';
    } else {
        previewBox.innerHTML = (leader.name || '?').charAt(0);
    }
    
    selectedPhotoFile = null;
    document.getElementById('leaderModal').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeLeaderModal() {
    document.getElementById('leaderModal').classList.remove('active');
    document.body.style.overflow = '';
    selectedPhotoFile = null;
}

function handlePhotoSelect(event) {
    var file = event.target.files[0];
    if (!file) return;
    
    if (file.size > 2 * 1024 * 1024) {
        showToast('Photo must be under 2 MB', 'error');
        event.target.value = '';
        return;
    }
    
    if (file.type.indexOf('image/') !== 0) {
        showToast('Only image files allowed', 'error');
        event.target.value = '';
        return;
    }
    
    selectedPhotoFile = file;
    
    var reader = new FileReader();
    reader.onload = function(e) {
        document.getElementById('photoPreviewBox').innerHTML = '<img src="' + e.target.result + '" style="width:100%;height:100%;object-fit:cover;">';
    };
    reader.readAsDataURL(file);
    
    showToast('Photo selected', 'info');
}

// ============================================================
// Upload Photo to Supabase Storage
// ============================================================
async function uploadPhoto(file, memberId) {
    var ext = file.name.split('.').pop();
    var fileName = memberId + '-' + Date.now() + '.' + ext;
    
    var result = await sb.storage
        .from('leadership-photos')
        .upload(fileName, file, {
            cacheControl: '3600',
            upsert: false
        });
    
    if (result.error) throw result.error;
    
    var urlResult = sb.storage
        .from('leadership-photos')
        .getPublicUrl(fileName);
    
    return urlResult.data.publicUrl;
}

// ============================================================
// Save Leader
// ============================================================
async function saveLeader(event) {
    if (event) event.preventDefault();
    
    var saveBtn = document.getElementById('saveBtn');
    var originalText = saveBtn.innerHTML;
    saveBtn.disabled = true;
    saveBtn.innerHTML = 'Saving...';
    
    try {
        var editingId = document.getElementById('editingId').value;
        var isEdit = !!editingId;
        
        var memberId = document.getElementById('memberIdInput').value.trim();
        var name = document.getElementById('nameInput').value.trim();
        var designation = document.getElementById('designationInput').value.trim();
        var branchCode = document.getElementById('branchInput').value;
        var message = document.getElementById('messageInput').value.trim();
        
        if (!memberId || !name || !designation || !branchCode || !message) {
            showToast('Please fill all required fields', 'error');
            saveBtn.disabled = false;
            saveBtn.innerHTML = originalText;
            return;
        }
        
        var branchOption = document.getElementById('branchInput').selectedOptions[0];
        var branchName = '';
        if (branchOption) {
            branchName = branchOption.getAttribute('data-name') || '';
        }
        
        var photoUrl = document.getElementById('photoUrlInput').value.trim();
        
        if (selectedPhotoFile) {
            saveBtn.innerHTML = 'Uploading photo...';
            try {
                photoUrl = await uploadPhoto(selectedPhotoFile, memberId);
            } catch(uploadError) {
                console.error('Upload error:', uploadError);
                showToast('Photo upload failed, saving without photo', 'warning');
            }
            saveBtn.innerHTML = 'Saving...';
        }
        
        var payload = {
            member_id: memberId,
            name: name,
            name_en: document.getElementById('nameEnInput').value.trim(),
            designation: designation,
            designation_en: document.getElementById('designationEnInput').value.trim(),
            designation_icon: document.getElementById('designationIconInput').value.trim() || '*',
            branch_code: branchCode,
            branch_name: branchName,
            photo_url: photoUrl,
            short_bio: document.getElementById('shortBioInput').value.trim(),
            short_bio_en: document.getElementById('shortBioEnInput').value.trim(),
            message: message,
            message_en: document.getElementById('messageEnInput').value.trim(),
            mobile: document.getElementById('mobileInput').value.trim(),
            email: document.getElementById('emailInput').value.trim(),
            facebook_url: document.getElementById('facebookInput').value.trim(),
            whatsapp_url: document.getElementById('whatsappInput').value.trim(),
            telegram_url: document.getElementById('telegramInput').value.trim(),
            display_order: parseInt(document.getElementById('orderInput').value) || 1,
            updated_at: new Date().toISOString()
        };
        
        var result;
        if (isEdit) {
            result = await sb.from('leadership').update(payload).eq('id', editingId);
        } else {
            result = await sb.from('leadership').insert([payload]);
        }
        
        if (result.error) {
            if (result.error.code === '23505') {
                throw new Error('This member ID already exists');
            }
            throw result.error;
        }
        
        showToast(isEdit ? 'Updated successfully' : 'Added successfully', 'success');
        closeLeaderModal();
        await loadLeaders();
        
        // ✅ Notify parent
        try {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    action: 'leadership-changed',
                    type: isEdit ? 'UPDATE' : 'INSERT'
                }, '*');
            }
        } catch(e) {}
        
    } catch(e) {
        console.error('Save error:', e);
        showToast('Error: ' + (e.message || 'Unknown'), 'error');
    } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = originalText;
    }
    
    return false;
}

// ============================================================
// Toggle
// ============================================================
async function toggleLeader(id) {
    var leader = null;
    for (var i = 0; i < allLeaders.length; i++) {
        if (allLeaders[i].id === id) { 
            leader = allLeaders[i]; 
            break; 
        }
    }
    if (!leader) return;
    
    try {
        var result = await sb.from('leadership')
            .update({ 
                is_active: !leader.is_active,
                updated_at: new Date().toISOString()
            })
            .eq('id', id);
        
        if (result.error) throw result.error;
        
        showToast(leader.is_active ? 'Deactivated' : 'Activated', 'info');
        await loadLeaders();
    } catch(e) {
        console.error('Toggle error:', e);
        showToast('Error: ' + (e.message || 'Unknown'), 'error');
    }
}

// ============================================================
// Delete
// ============================================================
async function deleteLeader(id) {
    var leader = null;
    for (var i = 0; i < allLeaders.length; i++) {
        if (allLeaders[i].id === id) { 
            leader = allLeaders[i]; 
            break; 
        }
    }
    if (!leader) return;
    
    var confirmMsg = 'Delete "' + (leader.name || 'this leader') + '"? This cannot be undone.';
    if (!confirm(confirmMsg)) return;
    
    try {
        var result = await sb.from('leadership').delete().eq('id', id);
        if (result.error) throw result.error;
        
        showToast('Deleted successfully', 'success');
        await loadLeaders();
    } catch(e) {
        console.error('Delete error:', e);
        showToast('Error: ' + (e.message || 'Unknown'), 'error');
    }
}

// ============================================================
// Parent থেকে Message Handler
// ============================================================
window.addEventListener('message', function(event) {
    console.log('📩 Message from parent:', event.data);
    
    if (event.data && event.data.action === 'reload-leaders') {
        console.log('🔄 Parent requested reload');
        loadLeaders();
    }
});

// ============================================================
// Modal backdrop
// ============================================================
var modalEl = document.getElementById('leaderModal');
if (modalEl) {
    modalEl.addEventListener('click', function(e) {
        if (e.target === this) closeLeaderModal();
    });
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeLeaderModal();
});

// ============================================================
// Global Expose
// ============================================================
window.openLeaderModal = openLeaderModal;
window.closeLeaderModal = closeLeaderModal;
window.editLeader = editLeader;
window.toggleLeader = toggleLeader;
window.deleteLeader = deleteLeader;
window.handlePhotoSelect = handlePhotoSelect;
window.saveLeader = saveLeader;
window.loadLeaders = loadLeaders;
window.loadBranches = loadBranches;

console.log('✅ admin-leadership.html ready!');
</script>
