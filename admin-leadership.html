<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পরিচালনা পরিষদ ম্যানেজমেন্ট | TUKNBD Admin</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAACXBIWXMAAAsTAAALEwEAmpwYAAAB1klEQVR4nO2WPU/DMBRAn5O0pUJiKDCysTJUYkAqS98+Jf0DqHwA1Y2fhCqGqhSJhQV2VnZGhCQUsf6JpKrbOk3ipL6HpA5KJR944tvv3bvz0wC/6RfnIUkSAAAAAElFTkSuQmCC">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans Bengali', sans-serif; }
        
        :root {
            --primary: #0d9488;
            --primary-dark: #0f766e;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
        }
        
        body {
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            min-height: 100vh;
            color: #1f2937;
        }
        
        /* ===== হেডার ===== */
        .admin-header {
            background: linear-gradient(135deg, #064e3b, #059669);
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 20px rgba(5, 150, 105, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .admin-header-left h1 {
            font-size: 22px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .admin-header-left h1 i {
            background: rgba(255,255,255,0.2);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .admin-header-left p {
            font-size: 12px;
            opacity: 0.85;
            margin-top: 4px;
            margin-left: 54px;
        }
        
        .admin-header-right {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 11px 22px;
            border-radius: 50px;
            border: none;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            text-decoration: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #fcd34d, #fbbf24);
            color: #064e3b;
            box-shadow: 0 4px 15px rgba(252,211,77,0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(252,211,77,0.5);
        }
        
        .btn-outline {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1.5px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(10px);
        }
        
        .btn-outline:hover {
            background: rgba(255,255,255,0.25);
        }
        
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 25px 20px 60px;
        }
        
        /* ===== স্ট্যাটস বার ===== */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
            border-left: 4px solid var(--primary);
        }
        
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            flex-shrink: 0;
        }
        
        .stat-icon.green { background: linear-gradient(135deg, #059669, #10b981); }
        .stat-icon.blue { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .stat-icon.amber { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .stat-icon.purple { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        
        .stat-info { flex: 1; min-width: 0; }
        .stat-value {
            font-size: 24px;
            font-weight: 800;
            color: #1f2937;
            line-height: 1.2;
        }
        .stat-label {
            font-size: 12px;
            color: #6b7280;
            font-weight: 600;
        }
        
        /* ===== লিডার গ্রিড ===== */
        .leaders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .leaders-grid { grid-template-columns: 1fr; }
        }
        
        /* ===== অ্যাডমিন কার্ড ===== */
        .admin-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
        }
        
        .admin-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.12);
            border-color: #a7f3d0;
        }
        
        .admin-card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px;
            background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
            position: relative;
        }
        
        .admin-branch-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            box-shadow: 0 2px 6px rgba(59, 130, 246, 0.3);
            z-index: 2;
        }
        
        .admin-card-photo {
            width: 80px;
            height: 100px;
            border-radius: 10px;
            object-fit: cover;
            border: 3px solid white;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            background: linear-gradient(135deg, #059669, #10b981);
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        
        .admin-card:hover .admin-card-photo {
            transform: scale(1.05);
            border-color: #fcd34d;
        }
        
        .admin-photo-placeholder {
            width: 80px;
            height: 100px;
            border-radius: 10px;
            background: linear-gradient(135deg, #059669, #10b981);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: 800;
            border: 3px solid white;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        
        .admin-card:hover .admin-photo-placeholder {
            transform: scale(1.05);
            border-color: #fcd34d;
        }
        
        .admin-card-info {
            flex: 1;
            min-width: 0;
            padding-right: 5px;
        }
        
        .admin-card-name {
            font-size: 16px;
            font-weight: 800;
            color: #064e3b;
            margin-bottom: 4px;
            line-height: 1.3;
            word-break: break-word;
        }
        
        .admin-card-desig {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 10.5px;
            font-weight: 700;
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            margin-bottom: 6px;
        }
        
        .admin-card-id {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            background: linear-gradient(135deg, #faf5ff, #ede9fe);
            color: #5b21b6;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }
        
        .admin-card-id i {
            color: #8b5cf6;
            font-size: 9px;
        }
        
        .admin-status-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 3px 10px;
            border-radius: 50px;
            font-size: 9.5px;
            font-weight: 700;
            z-index: 2;
        }
        
        .admin-status-badge.active {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            color: #065f46;
        }
        
        .admin-status-badge.inactive {
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            color: #991b1b;
        }
        
        .admin-card-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 12px 15px;
            border-top: 1px solid #e5e7eb;
            background: linear-gradient(135deg, #f9fafb, #f0fdf4);
        }
        
        .action-btn {
            padding: 9px 8px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-family: inherit;
            color: white;
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }
        
        .action-btn.edit { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .action-btn.toggle { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .action-btn.delete { background: linear-gradient(135deg, #ef4444, #dc2626); }
        
        /* ===== এমপ্টি স্টেট ===== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 70px 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }
        
        .empty-state i {
            font-size: 70px;
            color: #d1d5db;
            margin-bottom: 20px;
            display: block;
        }
        
        .empty-state h3 {
            font-size: 20px;
            color: #374151;
            margin-bottom: 8px;
        }
        
        .empty-state p {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 20px;
        }
        
        /* ===== মডাল ===== */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-y: auto;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 30px;
            max-width: 700px;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin: auto;
        }
        
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(-20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e5e7eb;
        }
        
        .modal-header h3 {
            font-size: 20px;
            color: #064e3b;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .modal-header h3 i {
            color: #059669;
        }
        
        .modal-close {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #f3f4f6;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #6b7280;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .modal-close:hover {
            background: #e5e7eb;
            transform: rotate(90deg);
        }
        
        /* ===== ফর্ম ===== */
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #374151;
            margin-bottom: 6px;
        }
        
        .form-group label .required {
            color: #ef4444;
            margin-left: 3px;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
            background: white;
            color: #1f2937;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5,150,105,0.1);
        }
        
        textarea.form-control {
            resize: vertical;
            min-height: 90px;
            line-height: 1.6;
        }
        
        select.form-control {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23059669' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 18px;
            padding-right: 40px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
        }
        
        /* ছবি প্রিভিউ */
        .photo-upload-area {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: #f9fafb;
            border-radius: 14px;
            border: 2px dashed #d1d5db;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }
        
        .photo-upload-area:hover {
            border-color: #059669;
            background: #f0fdf4;
        }
        
        .photo-preview-box {
            width: 96px;
            height: 120px;
            border-radius: 10px;
            overflow: hidden;
            background: linear-gradient(135deg, #059669, #10b981);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: 800;
            border: 3px solid white;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }
        
        .photo-preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .photo-upload-controls {
            flex: 1;
            min-width: 0;
        }
        
        .photo-upload-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 10px;
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            color: #047857;
            font-weight: 700;
            font-size: 12.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1.5px solid #059669;
            margin-bottom: 6px;
        }
        
        .photo-upload-btn:hover {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
        }
        
        .photo-hint {
            font-size: 11px;
            color: #6b7280;
            line-height: 1.5;
        }
        
        /* মডাল অ্যাকশন */
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 22px;
            padding-top: 20px;
            border-top: 2px solid #e5e7eb;
        }
        
        .modal-actions .btn {
            flex: 1;
            justify-content: center;
            padding: 14px;
            font-size: 14px;
        }
        
        .btn-cancel {
            background: #f3f4f6;
            color: #4b5563;
        }
        
        .btn-cancel:hover {
            background: #e5e7eb;
        }
        
        .btn-save {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
        }
        
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(5,150,105,0.3);
        }
        
        .btn-save:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        /* ===== লোডিং ===== */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .full-page-loader {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        
        .full-page-loader .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e5e7eb;
            border-top-color: #059669;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        .full-page-loader p {
            color: #059669;
            font-weight: 700;
        }
        
        /* নোটিফিকেশন */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 22px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            z-index: 9999;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            animation: slideIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 400px;
        }
        
        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .toast.success { background: linear-gradient(135deg, #059669, #10b981); }
        .toast.error { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .toast.info { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .toast.warning { background: linear-gradient(135deg, #f59e0b, #d97706); }
        
        /* ছোট স্ক্রিন */
        @media (max-width: 480px) {
            .admin-header { padding: 18px 15px; }
            .admin-header-left h1 { font-size: 18px; }
            .admin-header-left h1 i { width: 38px; height: 38px; font-size: 18px; }
            .admin-header-left p { margin-left: 50px; font-size: 11px; }
            .container { padding: 18px 12px 40px; }
            .admin-card-photo,
            .admin-photo-placeholder { width: 70px; height: 88px; font-size: 28px; }
            .admin-card-name { font-size: 15px; }
            .admin-card-actions { grid-template-columns: 1fr; gap: 6px; padding: 10px; }
            .action-btn { font-size: 12px; padding: 10px; }
        }
    </style>
</head>
<body>

<!-- ===== Full Page Loader ===== -->
<div id="pageLoader" class="full-page-loader">
    <div class="spinner"></div>
    <p>লোড হচ্ছে...</p>
</div>

<!-- ===== মেইন কন্টেন্ট ===== -->
<div id="adminContent" style="display: none;">
    
    <!-- হেডার -->
    <div class="admin-header">
        <div class="admin-header-left">
            <h1>
                <i class="fas fa-user-tie"></i>
                পরিচালনা পরিষদ ম্যানেজমেন্ট
            </h1>
            <p>TUKNBD - লিডারদের তথ্য, ছবি, বার্তা ও ব্রাঞ্চ সম্পাদনা করুন</p>
        </div>
        <div class="admin-header-right">
            <button class="btn btn-primary" onclick="openLeaderModal()">
                <i class="fas fa-plus"></i> নতুন যোগ করুন
            </button>
            <a href="admin-panel.html" class="btn btn-outline" id="backToPanelBtn">
                <i class="fas fa-arrow-left"></i> ফিরে যান
            </a>
        </div>
    </div>
    
    <!-- কন্টেইনার -->
    <div class="container">
        
        <!-- স্ট্যাটস বার -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-icon green">
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-info">
                    <div class="stat-value" id="statTotal">০</div>
                    <div class="stat-label">মোট লিডার</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon blue">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="stat-info">
                    <div class="stat-value" id="statActive">০</div>
                    <div class="stat-label">সক্রিয়</div>

// ============================================================

function showToast(message, type = 'success') {
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    const icons = {
        success: 'fa-check-circle',
        error: 'fa-exclamation-circle',
        warning: 'fa-exclamation-triangle',
        info: 'fa-info-circle'
    };
    toast.innerHTML = `<i class="fas ${icons[type]}"></i><span>${message}</span>`;
    document.body.appendChild(toast);
    
    setTimeout(() => {
        toast.style.animation = 'slideIn 0.3s ease reverse';
        setTimeout(() => toast.remove(), 300);
    }, 3500);
}

// ✅ FIXED Init — iframe Integration Support
// ============================================================

async function loadBranches() {

            .from('branches')
            .select('branch_code, branch_name, branch_name_en, district, display_order, status')
            .eq('status', 'active')
            .order('display_order', { ascending: true });

        // Dropdown পূরণ

                    📍 ${b.branch_name} (${b.district})

        // স্ট্যাটস আপডেট

        console.error('Branch load error:', e);
        showToast('ব্রাঞ্চ লোড করতে সমস্যা!', 'error');

    `;

        const { data, error } = await sb

        if (error) throw error;
        
        allLeaders = data || [];
        
        // স্ট্যাটস আপডেট

        // রেন্ডার
        renderLeaders();

    const total = allLeaders.length;

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statActive').textContent = active;
    document.getElementById('statInactive').textContent = inactive;
}

// ============================================================
// ছবি সিলেক্ট
// ============================================================
function handlePhotoSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    // ফাইল সাইজ চেক (2 MB)
    if (file.size > 2 * 1024 * 1024) {
        showToast('❌ ছবির সাইজ ২ MB এর কম হতে হবে!', 'error');
        event.target.value = '';
        return;
    }
    
    // ফাইল টাইপ চেক
    if (!file.type.startsWith('image/')) {
        showToast('❌ শুধু ইমেজ ফাইল আপলোড করুন!', 'error');
        event.target.value = '';
        return;
    }
    
    selectedPhotoFile = file;
    
    // প্রিভিউ
    const reader = new FileReader();
    reader.onload = (e) => {
        document.getElementById('photoPreviewBox').innerHTML = 
            `<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;">`;
    };
    reader.readAsDataURL(file);
    
    showToast('✅ ছবি সিলেক্ট হয়েছে', 'info');
}

// ============================================================
// Supabase Storage-এ ছবি আপলোড
// ============================================================
async function uploadPhoto(file, memberId) {
    try {
        const ext = file.name.split('.').pop();
        const fileName = `${memberId}-${Date.now()}.${ext}`;
        
        const { data, error } = await sb.storage
            .from('leadership-photos')
            .upload(fileName, file, {
                cacheControl: '3600',
                upsert: false
            });
        
        if (error) throw error;
        
        // Public URL
        const { data: urlData } = sb.storage
            .from('leadership-photos')
            .getPublicUrl(fileName);
        
        return urlData.publicUrl;
    } catch(e) {
        console.error('Upload error:', e);
        throw new Error('ছবি আপলোড ব্যর্থ: ' + e.message);
    }
}

// ============================================================
// Save Leader
// ============================================================
async function saveLeader(event) {
    event.preventDefault();
    
    const saveBtn = document.getElementById('saveBtn');
    const originalText = saveBtn.innerHTML;
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<div class="loading-spinner"></div> সংরক্ষণ হচ্ছে...';
    
    try {
        const editingId = document.getElementById('editingId').value;
        const isEdit = !!editingId;
        
        // Basic validation
        const memberId = document.getElementById('memberIdInput').value.trim();
        const name = document.getElementById('nameInput').value.trim();
        const designation = document.getElementById('designationInput').value.trim();
        const branchCode = document.getElementById('branchInput').value;
        const message = document.getElementById('messageInput').value.trim();
        
        if (!memberId || !name || !designation || !branchCode || !message) {
            showToast('❌ সব প্রয়োজনীয় ঘর পূরণ করুন!', 'error');
            saveBtn.disabled = false;
            saveBtn.innerHTML = originalText;
            return;
        }
        
        // ব্রাঞ্চ নাম
        const branchOption = document.getElementById('branchInput').selectedOptions[0];
        const branchName = branchOption?.dataset?.name || '';
        
        // ছবি URL
        let photoUrl = document.getElementById('photoUrlInput').value.trim();
        
        // নতুন ছবি সিলেক্ট হলে আপলোড
        if (selectedPhotoFile) {
            saveBtn.innerHTML = '<div class="loading-spinner"></div> ছবি আপলোড হচ্ছে...';
            try {
                photoUrl = await uploadPhoto(selectedPhotoFile, memberId);
            } catch(uploadError) {
                showToast('⚠️ ছবি আপলোড ব্যর্থ: ' + uploadError.message, 'warning');
            }
            saveBtn.innerHTML = '<div class="loading-spinner"></div> সংরক্ষণ হচ্ছে...';
        }
        
        const payload = {
            member_id: memberId,
            name: name,
            name_en: document.getElementById('nameEnInput').value.trim(),
            designation: designation,
            designation_en: document.getElementById('designationEnInput').value.trim(),
            designation_icon: document.getElementById('designationIconInput').value.trim() || '⭐',
            branch_code: branchCode,
            branch_name: branchName,
            photo_url: photoUrl,
            short_bio: document.getElementById('shortBioInput').value.trim(),
            short_bio_en: document.getElementById('shortBioEnInput').value.trim(),
            message: message,
            message_en: document.getElementById('messageEnInput').value.trim(),
            mobile: document.getElementById('mobileInput').value.trim(),
            email: document.getElementById('emailInput').value.trim(),
            facebook_url: document.getElementById('facebookInput').value.trim(),
            whatsapp_url: document.getElementById('whatsappInput').value.trim(),
            telegram_url: document.getElementById('telegramInput').value.trim(),
            display_order: parseInt(document.getElementById('orderInput').value) || 1,
            updated_at: new Date().toISOString()
        };
        
        let result;
        if (isEdit) {
            result = await sb.from('leadership').update(payload).eq('id', editingId);
        } else {
            result = await sb.from('leadership').insert([payload]);
        }
        
        if (result.error) {
            if (result.error.code === '23505') {
                throw new Error('এই মেম্বার আইডি ইতিমধ্যে ব্যবহৃত হয়েছে!');
            }
            throw result.error;
        }
        
        showToast(isEdit ? '✅ সফলভাবে আপডেট হয়েছে!' : '✅ সফলভাবে যোগ হয়েছে!', 'success');
        closeLeaderModal();
        await loadLeaders();
        
    } catch(e) {
        console.error('Save error:', e);
        showToast('❌ সমস্যা: ' + e.message, 'error');
    } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = originalText;
    }
}

// ============================================================
// Toggle (সক্রিয়/নিষ্ক্রিয়)
// ============================================================
async function toggleLeader(id) {
    const leader = allLeaders.find(l => l.id === id);
    if (!leader) return;
    
    try {
        const { error } = await sb.from('leadership')
            .update({ 
                is_active: !leader.is_active,
                updated_at: new Date().toISOString()
            })
            .eq('id', id);
        
        if (error) throw error;
        
        showToast(
            leader.is_active ? '⏸️ লিডার নিষ্ক্রিয় করা হয়েছে' : '▶️ লিডার সক্রিয় করা হয়েছে',
            'info'
        );
        
        await loadLeaders();
    } catch(e) {
        console.error('Toggle error:', e);
        showToast('❌ সমস্যা: ' + e.message, 'error');
    }
}

// ============================================================
// Delete
// ============================================================
async function deleteLeader(id) {
    const leader = allLeaders.find(l => l.id === id);
    if (!leader) return;
    
    if (!confirm(`আপনি কি নিশ্চিত "${leader.name}" কে মুছে ফেলতে চান?\n\nএই কাজটি ফিরিয়ে আনা যাবে না।`)) {
        return;
    }
    
    try {
        const { error } = await sb.from('leadership').delete().eq('id', id);
        if (error) throw error;
        
        showToast('🗑️ সফলভাবে মুছে ফেলা হয়েছে!', 'success');
        await loadLeaders();
    } catch(e) {
        console.error('Delete error:', e);
        showToast('❌ সমস্যা: ' + e.message, 'error');
    }
}

// ============================================================
// Backdrop এ ক্লিক করলে মডাল বন্ধ
// ============================================================
document.getElementById('leaderModal')?.addEventListener('click', function(e) {
    if (e.target === this) {
        closeLeaderModal();
    }
});

// ESC কী দিয়ে বন্ধ
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeLeaderModal();
    }
});

// ============================================================
// Global Expose
// ============================================================
window.openLeaderModal = openLeaderModal;
window.closeLeaderModal = closeLeaderModal;
window.editLeader = editLeader;
window.toggleLeader = toggleLeader;
window.deleteLeader = deleteLeader;
window.handlePhotoSelect = handlePhotoSelect;
window.saveLeader = saveLeader;
window.loadLeaders = loadLeaders;

console.log('✅ admin-leadership.html loaded successfully!');
</script>
