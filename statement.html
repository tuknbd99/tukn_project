<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্টেটমেন্ট | TUKNBD</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { font-family: 'Noto Sans Bengali', sans-serif; box-sizing: border-box; }
        body { background: #f0fdf4; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; }
        .btn { padding: 8px 18px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
        .btn-success { background: #059669; color: white; }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(5,150,105,0.3); }
        .btn-info { background: #3b82f6; color: white; }
        .btn-info:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59,130,246,0.3); }
        .btn-purple { background: #7c3aed; color: white; }
        .btn-purple:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(124,58,237,0.3); }
        .btn-danger { background: #dc2626; color: white; }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(220,38,38,0.3); }
        .btn-sm { padding: 4px 12px; font-size: 11px; border-radius: 6px; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .data-table th { background: #f8fafc; padding: 10px 12px; border-bottom: 2px solid #e5e7eb; text-align: left; font-weight: 600; color: #1f2937; }
        .data-table td { padding: 8px 12px; border-bottom: 1px solid #f1f5f9; }
        .data-table tr:hover td { background: #f8fafc; }
        .tx-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 10px; font-weight: 600; }
        .tx-badge.savings { background: #d1fae5; color: #065f46; }
        .tx-badge.loan { background: #dbeafe; color: #1e40af; }
        .tx-badge.withdrawal { background: #fee2e2; color: #991b1b; }
        .tx-badge.referral { background: #fef3c7; color: #92400e; }
        .tx-badge.profit { background: #ede9fe; color: #5b21b6; }
        .status-badge { padding: 2px 12px; border-radius: 20px; font-size: 10px; font-weight: 600; display: inline-block; }
        .status-approved { background: #d1fae5; color: #065f46; }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-rejected { background: #fee2e2; color: #991b1b; }
        .loading-spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #e5e7eb; border-top-color: #059669; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { rotate: 360deg; } }
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 10px; color: white; z-index: 999; animation: slideIn 0.3s ease; background: #059669; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @media (max-width: 768px) { .data-table { font-size: 11px; } .data-table th, .data-table td { padding: 4px 6px; } }
        @media print { .no-print { display: none !important; } .card { border: none !important; box-shadow: none !important; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="flex justify-between items-center flex-wrap gap-2 mb-4">
                <h1 class="text-2xl font-bold text-emerald-700">
                    <i class="fas fa-file-invoice mr-2"></i> সদস্য স্টেটমেন্ট
                </h1>
                <div class="flex gap-2 flex-wrap no-print">
                    <button onclick="window.history.back()" class="btn btn-info btn-sm">
                        <i class="fas fa-arrow-left mr-1"></i> ফিরে যান
                    </button>
                    <button onclick="window.print()" class="btn btn-purple btn-sm">
                        <i class="fas fa-print mr-1"></i> প্রিন্ট
                    </button>
                </div>
            </div>
            
            <div class="flex flex-wrap gap-2 mb-4 no-print">
                <input type="text" id="searchInput" placeholder="🔍 সদস্য আইডি বা মোবাইল..." 
                       class="flex-1 border rounded-lg px-3 py-2 text-sm min-w-[200px]">
                <button onclick="loadStatement()" class="btn btn-success">
                    <i class="fas fa-search mr-1"></i> খুঁজুন
                </button>
            </div>
            
            <div id="statementContent">
                <div class="text-center text-gray-500 py-12">
                    <i class="fas fa-search text-5xl block mb-3 text-gray-300"></i>
                    <p>সদস্য আইডি বা মোবাইল দিয়ে খুঁজুন</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://bffomfsffrtfgxyetzvm.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_A0BluIVwJ4M3Zd3JWpBoPg_NJSRu81D';
        let supabaseClient = null;
        let currentMember = null;

        try {
            if (typeof supabase !== 'undefined' && supabase.createClient) {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                console.log('✅ Supabase client created');
            }
        } catch(e) {
            console.error('Supabase error:', e);
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
        }

        function formatAmount(amt) {
            if (typeof amt !== 'number' || isNaN(amt)) return '0';
            return amt.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }
        function formatAmountWithText(amt) { return formatAmount(amt) + ' টাকা'; }

        // URL প্যারামিটার থেকে সার্চ নেওয়া
        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const member = params.get('member') || params.get('search') || '';
            if (member) {
                document.getElementById('searchInput').value = member;
                loadStatement();
            }
        });

        async function loadStatement() {
            const search = document.getElementById('searchInput').value.trim();
            const container = document.getElementById('statementContent');
            
            if (!search) {
                container.innerHTML = `<div class="text-center text-gray-500 py-12">
                    <i class="fas fa-search text-5xl block mb-3 text-gray-300"></i>
                    <p>সদস্য আইডি বা মোবাইল লিখুন</p>
                </div>`;
                return;
            }

            if (!supabaseClient) {
                container.innerHTML = '<div class="text-center text-red-500 py-8">❌ সংযোগ সমস্যা!</div>';
                return;
            }

            container.innerHTML = `<div class="text-center py-8"><div class="loading-spinner"></div><p class="text-gray-500 mt-2">লোড হচ্ছে...</p></div>`;

            try {
                const { data: member, error } = await supabaseClient
                    .from('members')
                    .select('*')
                    .or(`member_id.eq.${search},mobile.eq.${search}`)
                    .maybeSingle();

                if (error || !member) {
                    container.innerHTML = `<div class="text-center text-red-500 py-8">
                        <i class="fas fa-exclamation-circle text-4xl block mb-3"></i>
                        <p class="text-lg font-medium">❌ সদস্য পাওয়া যায়নি!</p>
                        <p class="text-sm text-gray-400 mt-2">"${search}" দিয়ে কোনো সদস্য নেই</p>
                    </div>`;
                    return;
                }

                currentMember = member;

                // লেনদেন লোড
                const { data: transactions } = await supabaseClient
                    .from('ledger_transactions')
                    .select('*')
                    .or(`member_id.eq.${member.member_id}, note.ilike.%${member.member_id}%, note.ilike.%${member.mobile}%`)
                    .order('date', { ascending: false });

                renderStatement(member, transactions || []);
            } catch(e) {
                console.error('Statement error:', e);
                container.innerHTML = `<div class="text-center text-red-500 py-8">❌ লোড করতে সমস্যা!</div>`;
            }
        }

        function renderStatement(member, transactions) {
            const container = document.getElementById('statementContent');
            
            let totalIncome = 0, totalExpense = 0;
            transactions.forEach(t => {
                if (t.type === 'income') totalIncome += Number(t.amount) || 0;
                else totalExpense += Number(t.amount) || 0;
            });
            const netBalance = totalIncome - totalExpense;

            let html = `
                <div class="bg-gradient-to-r from-emerald-50 to-blue-50 p-4 rounded-xl border mb-4">
                    <div class="flex flex-wrap justify-between items-center">
                        <div>
                            <h3 class="text-xl font-bold text-gray-800">${member.full_name}</h3>
                            <p class="text-sm text-gray-500">🆔 ${member.member_id} | 📱 ${member.mobile}</p>
                            <p class="text-sm text-gray-500">📍 ${member.present_district || 'জেলা নেই'} | 📅 ${member.created_at ? new Date(member.created_at).toLocaleDateString('bn-BD') : '-'}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-sm text-gray-500">বর্তমান ব্যালেন্স</p>
                            <p class="text-2xl font-bold text-emerald-600">${formatAmountWithText(member.balance || 0)}</p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
                    <div class="bg-emerald-50 p-3 rounded-lg text-center border border-emerald-200">
                        <p class="text-xs text-gray-500">📈 মোট আয়</p>
                        <p class="text-xl font-bold text-emerald-600">${formatAmountWithText(totalIncome)}</p>
                    </div>
                    <div class="bg-red-50 p-3 rounded-lg text-center border border-red-200">
                        <p class="text-xs text-gray-500">📉 মোট ব্যয়</p>
                        <p class="text-xl font-bold text-red-600">${formatAmountWithText(totalExpense)}</p>
                    </div>
                    <div class="bg-blue-50 p-3 rounded-lg text-center border border-blue-200">
                        <p class="text-xs text-gray-500">💰 নেট ব্যালেন্স</p>
                        <p class="text-xl font-bold text-blue-600">${formatAmountWithText(netBalance)}</p>
                    </div>
                    <div class="bg-purple-50 p-3 rounded-lg text-center border border-purple-200">
                        <p class="text-xs text-gray-500">📊 মোট লেনদেন</p>
                        <p class="text-xl font-bold text-purple-600">${transactions.length} টি</p>
                    </div>
                </div>
            `;

            if (transactions.length === 0) {
                html += `<div class="text-center text-gray-400 py-8"><i class="fas fa-inbox text-4xl block mb-3"></i><p>কোনো লেনদেন নেই</p></div>`;
            } else {
                html += `<div class="overflow-x-auto"><table class="data-table"><thead><tr>
                    <th>তারিখ</th><th>সময়</th><th>ভাউচার</th><th>ধরন</th><th>খাত</th><th class="text-left">পরিমাণ</th><th>ব্যাংক</th><th>নোট</th>
                </tr></thead><tbody>`;

                transactions.forEach(t => {
                    const isIncome = t.type === 'income';
                    const typeLabel = isIncome ? '📈 আয়' : '📉 ব্যয়';
                    const typeClass = isIncome ? 'tx-badge savings' : 'tx-badge withdrawal';
                    const dateStr = t.date ? new Date(t.date).toLocaleDateString('bn-BD') : '-';
                    const timeStr = t.time || '-';

                    html += `<tr>
                        <td class="text-xs whitespace-nowrap">${dateStr}</td>
                        <td class="text-xs">${timeStr}</td>
                        <td class="text-xs font-mono">${t.voucher || '-'}</td>
                        <td><span class="${typeClass}">${typeLabel}</span></td>
                        <td class="text-xs">${t.category || '-'}</td>
                        <td class="text-left font-bold ${isIncome ? 'text-emerald-600' : 'text-red-600'}">${isIncome ? '+' : '-'} ${formatAmountWithText(t.amount)}</td>
                        <td class="text-xs">${t.bank_name || '-'}</td>
                        <td class="text-xs max-w-[120px] truncate" title="${t.note || ''}">${t.note || '-'}</td>
                    </tr>`;
                });

                html += `</tbody></table></div>`;
            }

            container.innerHTML = html;
        }

        window.loadStatement = loadStatement;
        window.showToast = showToast;
    </script>
</body>
</html>
