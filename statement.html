<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পূর্ণাঙ্গ স্টেটমেন্ট | TUKNBD</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { font-family: 'Noto Sans Bengali', sans-serif; box-sizing: border-box; }
        body { background: #f0fdf4; min-height: 100vh; }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 16px; }
        .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; }
        
        .btn { padding: 8px 18px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
        .btn-success { background: linear-gradient(135deg, #059669, #047857); color: white; }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(5,150,105,0.3); }
        .btn-info { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
        .btn-info:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59,130,246,0.3); }
        .btn-purple { background: linear-gradient(135deg, #7c3aed, #6d28d9); color: white; }
        .btn-purple:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(124,58,237,0.3); }
        .btn-danger { background: linear-gradient(135deg, #dc2626, #b91c1c); color: white; }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(220,38,38,0.3); }
        .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
        .btn-warning:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(245,158,11,0.3); }
        .btn-sm { padding: 4px 12px; font-size: 11px; border-radius: 6px; }
        .btn-xs { padding: 2px 8px; font-size: 10px; border-radius: 4px; }
        
        /* ✅ ডেটা টেবিল - জমা ও উত্তোলন আলাদা কলাম */
        .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .data-table th { background: #f8fafc; padding: 12px 14px; border-bottom: 2px solid #e5e7eb; text-align: left; font-weight: 600; color: #1f2937; position: sticky; top: 0; z-index: 5; font-size: 13px; }
        .data-table td { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; line-height: 1.6; font-size: 14px; }
        .data-table tr:hover td { background: #f8fafc; }
        .data-table .total-row { background: #f3f4f6 !important; font-weight: 700; border-top: 2px solid #059669; }
        .data-table .net-row { background: #d1fae5 !important; font-weight: 700; border-top: 3px solid #059669; }
        
        /* ✅ ব্যাজ স্টাইল */
        .tx-badge { display: inline-block; padding: 3px 12px; border-radius: 14px; font-size: 11px; font-weight: 600; }
        .tx-badge.savings { background: #d1fae5; color: #065f46; }
        .tx-badge.loan { background: #dbeafe; color: #1e40af; }
        .tx-badge.withdrawal { background: #fee2e2; color: #991b1b; }
        .tx-badge.referral { background: #fef3c7; color: #92400e; }
        .tx-badge.profit { background: #ede9fe; color: #5b21b6; }
        .tx-badge.income { background: #d1fae5; color: #065f46; }
        .tx-badge.expense { background: #fee2e2; color: #991b1b; }
        .tx-badge.loan_payment { background: #dbeafe; color: #1e40af; }
        
        .status-badge { padding: 3px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
        .status-active { background: #d1fae5; color: #065f46; }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-inactive { background: #fee2e2; color: #991b1b; }
        
        .loading-spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #e5e7eb; border-top-color: #059669; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { rotate: 360deg; } }
        
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 10px; color: white; z-index: 999; animation: slideIn 0.3s ease; background: #059669; font-size: 14px; }
        .toast.error { background: #dc2626; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        /* ✅ সদস্য প্রোফাইল - সুন্দর এলাইনমেন্ট */
        .member-profile { background: linear-gradient(135deg, #f0fdf4, #d1fae5); border: 2px solid #059669; border-radius: 12px; padding: 24px 28px; }
        .member-profile .profile-name { font-size: 22px; font-weight: 700; color: #064e3b; }
        .member-profile .profile-label { font-size: 12px; color: #6b7280; font-weight: 500; }
        .member-profile .profile-value { font-size: 15px; font-weight: 600; color: #1f2937; line-height: 1.5; }
        .member-profile .profile-value.amount { color: #059669; font-size: 18px; }
        .member-profile .profile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px 20px; margin-top: 8px; }
        .member-profile .profile-grid .item { display: flex; flex-direction: column; }
        
        /* ✅ সারাংশ কার্ড */
        .summary-card { background: white; border-radius: 10px; padding: 14px 18px; border: 1px solid #e5e7eb; text-align: center; }
        .summary-card .number { font-size: 22px; font-weight: 800; }
        .summary-card .label { font-size: 12px; color: #6b7280; margin-top: 2px; }
        .summary-card.income .number { color: #059669; }
        .summary-card.expense .number { color: #dc2626; }
        .summary-card.balance .number { color: #2563eb; }
        .summary-card.count .number { color: #7c3aed; }
        .summary-card.current .number { color: #059669; }
        .summary-card.current { border-color: #059669; background: #ecfdf5; }
        
        /* ✅ বিভাগ ভিত্তিক যোগফল */
        .category-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px 14px; padding: 12px 18px; background: #f8fafc; border-radius: 8px; border: 1px solid #e5e7eb; font-size: 13px; }
        .category-summary .cat-item { display: flex; justify-content: space-between; padding: 3px 0; }
        .category-summary .cat-item .cat-label { color: #6b7280; font-weight: 500; }
        .category-summary .cat-item .cat-value { font-weight: 700; }
        
        .table-scroll { overflow-x: auto; max-height: 600px; overflow-y: auto; }
        .table-scroll thead { position: sticky; top: 0; z-index: 10; }
        .table-scroll thead th { background: #f8fafc; }
        
        .filter-section { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: #f8fafc; padding: 12px 16px; border-radius: 10px; border: 1px solid #e5e7eb; }
        .filter-section input, .filter-section select { flex: 1; min-width: 120px; padding: 8px 14px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px; background: white; }
        .filter-section input:focus, .filter-section select:focus { outline: none; border-color: #059669; box-shadow: 0 0 0 3px rgba(5,150,105,0.1); }
        
        .action-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid #e5e7eb; }
        
        /* ✅ প্রিন্ট স্টাইল */
        @media print {
            .no-print { display: none !important; }
            .card { border: none !important; box-shadow: none !important; padding: 5px !important; background: white !important; }
            .data-table { font-size: 11px !important; width: 100% !important; }
            .data-table th { background: #e5e7eb !important; color: #000 !important; border: 1px solid #ddd !important; padding: 6px 8px !important; font-size: 11px !important; }
            .data-table td { border: 1px solid #ddd !important; color: #000 !important; padding: 5px 8px !important; font-size: 11px !important; line-height: 1.4 !important; }
            .data-table tr:hover td { background: white !important; }
            .data-table .total-row { background: #f3f4f6 !important; }
            .data-table .net-row { background: #d1fae5 !important; }
            .member-profile { border: 1px solid #000 !important; background: #f9fafb !important; padding: 12px !important; }
            .member-profile .profile-name { font-size: 18px !important; }
            .member-profile .profile-value { font-size: 13px !important; }
            .member-profile .profile-value.amount { color: #059669 !important; }
            .summary-card { border: 1px solid #ddd !important; background: #f9fafb !important; padding: 6px 10px !important; }
            .summary-card .number { font-size: 14px !important; }
            .summary-card .label { font-size: 9px !important; }
            .category-summary { background: #f9fafb !important; border-color: #ddd !important; font-size: 11px !important; padding: 8px 12px !important; }
            .container { padding: 0 !important; max-width: 100% !important; }
            .table-scroll { max-height: none !important; overflow: visible !important; }
            .grid { gap: 4px !important; }
            .tx-badge { font-size: 9px !important; padding: 1px 8px !important; }
            .status-badge { font-size: 9px !important; padding: 1px 8px !important; }
        }
        
        /* ✅ ডার্ক মোড */
        body.dark-mode { background: #0f172a; }
        body.dark-mode .card { background: #1e293b; border-color: #334155; }
        body.dark-mode .data-table th { background: #0f172a; color: #e2e8f0; border-color: #334155; }
        body.dark-mode .data-table td { border-color: #334155; color: #e2e8f0; }
        body.dark-mode .data-table tr:hover td { background: #1e293b; }
        body.dark-mode .data-table .total-row { background: #1e293b !important; }
        body.dark-mode .data-table .net-row { background: #064e3b !important; }
        body.dark-mode .member-profile { background: #1e293b; border-color: #059669; }
        body.dark-mode .member-profile .profile-value { color: #e2e8f0; }
        body.dark-mode .member-profile .profile-name { color: #e2e8f0; }
        body.dark-mode .summary-card { background: #1e293b; border-color: #334155; }
        body.dark-mode .summary-card .label { color: #94a3b8; }
        body.dark-mode .filter-section { background: #1e293b; border-color: #334155; }
        body.dark-mode .filter-section input, body.dark-mode .filter-section select { background: #0f172a; border-color: #334155; color: #e2e8f0; }
        body.dark-mode .action-buttons { border-color: #334155; }
        body.dark-mode .category-summary { background: #1e293b; border-color: #334155; }
        body.dark-mode .category-summary .cat-label { color: #94a3b8; }
        
        /* ✅ মোবাইল রেস্পন্সিভ */
        @media (max-width: 768px) { 
            .data-table { font-size: 12px; } 
            .data-table th, .data-table td { padding: 6px 8px; font-size: 12px; } 
            .member-profile { padding: 16px; }
            .member-profile .profile-name { font-size: 18px; }
            .member-profile .profile-value { font-size: 13px; }
            .member-profile .profile-grid { grid-template-columns: repeat(2, 1fr); gap: 4px 12px; }
            .summary-card .number { font-size: 18px; }
            .summary-card { padding: 10px 12px; }
            .filter-section input, .filter-section select { min-width: 80px; font-size: 12px; padding: 6px 10px; }
            .category-summary { grid-template-columns: repeat(2, 1fr); font-size: 12px; padding: 8px 12px; }
            .action-buttons .btn { font-size: 11px; padding: 6px 12px; }
            .container { padding: 8px; }
            .card { padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ===== হেডার ===== -->
        <div class="card no-print">
            <div class="flex flex-wrap justify-between items-center gap-2">
                <div>
                    <h1 class="text-2xl font-bold text-emerald-700">
                        <i class="fas fa-file-invoice mr-2"></i> 📄 পূর্ণাঙ্গ স্টেটমেন্ট
                    </h1>
                    <p class="text-sm text-gray-500">সদস্যের সকল আর্থিক লেনদেন বিস্তারিত</p>
                </div>
                <div class="flex gap-2 flex-wrap">
                    <button onclick="toggleTheme()" class="btn btn-info btn-sm">
                        <i class="fas fa-moon" id="themeIcon"></i>
                    </button>
                    <button onclick="window.history.back()" class="btn btn-info btn-sm">
                        <i class="fas fa-arrow-left mr-1"></i> ফিরে যান
                    </button>
                    <button onclick="printStatement()" class="btn btn-purple btn-sm">
                        <i class="fas fa-print mr-1"></i> প্রিন্ট
                    </button>
                    <button onclick="downloadPDF()" class="btn btn-success btn-sm">
                        <i class="fas fa-file-pdf mr-1"></i> PDF
                    </button>
                    <button onclick="shareStatement()" class="btn btn-warning btn-sm">
                        <i class="fas fa-share-alt mr-1"></i> শেয়ার
                    </button>
                </div>
            </div>
        </div>

        <!-- ===== সার্চ ও ফিল্টার ===== -->
        <div class="card mt-4 no-print">
            <div class="filter-section">
                <input type="text" id="searchInput" placeholder="🔍 সদস্য আইডি বা মোবাইল..." 
                       class="flex-1 min-w-[150px]" value="">
                <input type="date" id="filterFromDate" class="min-w-[120px]">
                <span class="text-gray-400 text-sm">থেকে</span>
                <input type="date" id="filterToDate" class="min-w-[120px]">
                <select id="filterType" class="min-w-[120px]">
                    <option value="all">সব লেনদেন</option>
                    <option value="savings">💰 সঞ্চয়</option>
                    <option value="withdrawal">💸 উত্তোলন</option>
                    <option value="loan">🏦 লোন</option>
                    <option value="referral">🎁 রেফারেল</option>
                    <option value="profit">📊 লভ্যাংশ</option>
                    <option value="income">📈 আয়</option>
                    <option value="expense">📉 ব্যয়</option>
                </select>
                <button onclick="loadStatement()" class="btn btn-success">
                    <i class="fas fa-search mr-1"></i> দেখুন
                </button>
                <button onclick="resetFilters()" class="btn btn-warning">
                    <i class="fas fa-undo mr-1"></i>
                </button>
            </div>
        </div>

        <!-- ===== স্টেটমেন্ট কন্টেন্ট ===== -->
        <div id="statementContent" class="mt-4">
            <div class="card">
                <div class="text-center text-gray-500 py-12">
                    <i class="fas fa-search text-6xl block mb-4 text-gray-300"></i>
                    <p class="text-lg font-medium">সদস্য আইডি বা মোবাইল দিয়ে খুঁজুন</p>
                    <p class="text-sm text-gray-400 mt-2">সদস্যের সকল লেনদেন বিস্তারিত দেখাবে</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // ✅ SUPABASE CONFIG
        // ============================================================
        const SUPABASE_URL = 'https://bffomfsffrtfgxyetzvm.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_A0BluIVwJ4M3Zd3JWpBoPg_NJSRu81D';
        let supabaseClient = null;
        let currentMember = null;
        let allTransactions = [];
        let isDarkMode = false;

        // ============================================================
        // ✅ SUPABASE CLIENT
        // ============================================================
        try {
            if (typeof supabase !== 'undefined' && supabase.createClient) {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                console.log('✅ Supabase client created');
            }
        } catch(e) {
            console.error('Supabase error:', e);
        }

        // ============================================================
        // ✅ TOAST & THEME
        // ============================================================
        function showToast(msg, type = 'success') {
            const t = document.createElement('div');
            t.className = `toast ${type === 'error' ? 'error' : ''}`;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-mode', isDarkMode);
            localStorage.setItem('tukn_theme', isDarkMode ? 'dark' : 'light');
            document.getElementById('themeIcon').className = isDarkMode ? 'fas fa-sun' : 'fas fa-moon';
        }

        function loadTheme() {
            const saved = localStorage.getItem('tukn_theme');
            if (saved === 'dark') {
                isDarkMode = true;
                document.body.classList.add('dark-mode');
                document.getElementById('themeIcon').className = 'fas fa-sun';
            }
        }

        // ============================================================
        // ✅ FORMAT FUNCTIONS
        // ============================================================
        function formatAmount(amt) {
            if (typeof amt !== 'number' || isNaN(amt)) return '0';
            return amt.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }
        function formatAmountWithText(amt) { return formatAmount(amt) + ' টাকা'; }
        
        // ✅ ইংরেজি তারিখ ফরমেট: 9 Sep 2026, 7:15 am
        function formatDateEnglish(dateStr) {
            if (!dateStr) return '-';
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                const day = d.getDate();
                const month = months[d.getMonth()];
                const year = d.getFullYear();
                let hours = d.getHours();
                const minutes = d.getMinutes().toString().padStart(2, '0');
                const ampm = hours >= 12 ? 'pm' : 'am';
                if (hours > 12) hours = hours - 12;
                if (hours === 0) hours = 12;
                return `${day} ${month} ${year}, ${hours}:${minutes} ${ampm}`;
            } catch(e) { return dateStr; }
        }
        
        function formatDateOnlyEnglish(dateStr) {
            if (!dateStr) return '-';
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
            } catch(e) { return dateStr; }
        }

        // ============================================================
        // ✅ URL প্যারামিটার চেক
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadTheme();
            const params = new URLSearchParams(window.location.search);
            const member = params.get('member') || params.get('search') || '';
            if (member) {
                document.getElementById('searchInput').value = member;
                loadStatement();
            }
        });

        // ============================================================
        // ✅ রিসেট ফিল্টার
        // ============================================================
        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterFromDate').value = '';
            document.getElementById('filterToDate').value = '';
            document.getElementById('filterType').value = 'all';
            document.getElementById('statementContent').innerHTML = `
                <div class="card">
                    <div class="text-center text-gray-500 py-12">
                        <i class="fas fa-search text-6xl block mb-4 text-gray-300"></i>
                        <p class="text-lg font-medium">সদস্য আইডি বা মোবাইল দিয়ে খুঁজুন</p>
                        <p class="text-sm text-gray-400 mt-2">সদস্যের সকল লেনদেন বিস্তারিত দেখাবে</p>
                    </div>
                </div>
            `;
        }

        // ============================================================
        // ✅ প্রিন্ট ফাংশন
        // ============================================================
        function printStatement() {
            if (!currentMember) {
                showToast('প্রথমে স্টেটমেন্ট লোড করুন!', 'error');
                return;
            }
            window.print();
        }

        // ============================================================
        // ✅ শেয়ার ফাংশন
        // ============================================================
        function shareStatement() {
            if (!currentMember) {
                showToast('প্রথমে স্টেটমেন্ট লোড করুন!', 'error');
                return;
            }

            const url = window.location.href;
            const text = `📄 স্টেটমেন্ট: ${currentMember.full_name} (${currentMember.member_id})\n📱 মোবাইল: ${currentMember.mobile || 'N/A'}\n💰 ব্যালেন্স: ${formatAmountWithText(currentMember.balance || 0)}\n📊 মোট লেনদেন: ${allTransactions.length} টি\n\n🔗 ${url}`;

            if (navigator.share) {
                navigator.share({
                    title: `স্টেটমেন্ট - ${currentMember.full_name}`,
                    text: text,
                    url: url
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('✅ স্টেটমেন্ট লিংক কপি করা হয়েছে!', 'success');
                }).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    textarea.remove();
                    showToast('✅ স্টেটমেন্ট লিংক কপি করা হয়েছে!', 'success');
                });
            }
        }

        // ============================================================
        // ✅ প্রধান স্টেটমেন্ট লোড ফাংশন
        // ============================================================
        async function loadStatement() {
            const search = document.getElementById('searchInput').value.trim();
            const fromDate = document.getElementById('filterFromDate').value;
            const toDate = document.getElementById('filterToDate').value;
            const typeFilter = document.getElementById('filterType').value;
            const container = document.getElementById('statementContent');
            
            if (!search) {
                container.innerHTML = `
                    <div class="card">
                        <div class="text-center text-gray-500 py-12">
                            <i class="fas fa-search text-6xl block mb-4 text-gray-300"></i>
                            <p class="text-lg font-medium">সদস্য আইডি বা মোবাইল লিখুন</p>
                            <p class="text-sm text-gray-400 mt-2">সদস্যের সকল লেনদেন বিস্তারিত দেখাবে</p>
                        </div>
                    </div>
                `;
                return;
            }

            if (!supabaseClient) {
                container.innerHTML = `<div class="card"><div class="text-center text-red-500 py-8">❌ সংযোগ সমস্যা!</div></div>`;
                return;
            }

            container.innerHTML = `
                <div class="card">
                    <div class="text-center py-8">
                        <div class="loading-spinner"></div>
                        <p class="text-gray-500 mt-2">⏳ ডেটা লোড হচ্ছে...</p>
                    </div>
                </div>
            `;

            try {
                const { data: member, error: memberError } = await supabaseClient
                    .from('members')
                    .select('*')
                    .or(`member_id.eq.${search},mobile.eq.${search}`)
                    .maybeSingle();

                if (memberError || !member) {
                    container.innerHTML = `
                        <div class="card">
                            <div class="text-center text-red-500 py-12">
                                <i class="fas fa-exclamation-circle text-5xl block mb-3"></i>
                                <p class="text-lg font-medium">❌ সদস্য পাওয়া যায়নি!</p>
                                <p class="text-sm text-gray-400 mt-2">"${search}" দিয়ে কোনো সদস্য নেই</p>
                            </div>
                        </div>
                    `;
                    return;
                }

                currentMember = member;

                let transactions = [];
                let startDate = fromDate || '2000-01-01';
                let endDate = toDate || new Date().toISOString().split('T')[0];
                endDate += 'T23:59:59';

                // ২.১ লেজার ট্রানজেকশন
                const { data: ledgerTx } = await supabaseClient
                    .from('ledger_transactions')
                    .select('*')
                    .or(`member_id.eq.${member.member_id}, note.ilike.%${member.member_id}%, note.ilike.%${member.mobile}%`)
                    .gte('date', startDate)
                    .lte('date', endDate)
                    .order('date', { ascending: false });

                if (ledgerTx) {
                    ledgerTx.forEach(t => {
                        const isIncome = t.type === 'income';
                        transactions.push({
                            date: t.date,
                            time: t.time || '',
                            type: isIncome ? 'income' : 'expense',
                            typeLabel: isIncome ? '📈 আয়' : '📉 ব্যয়',
                            typeClass: isIncome ? 'income' : 'expense',
                            category: t.category || '-',
                            amount: Number(t.amount) || 0,
                            voucher: t.voucher || '-',
                            bank: t.bank_name || '-',
                            note: t.note || '-',
                            isCredit: isIncome,
                            source: 'লেজার',
                            entered_by: t.entered_by_name || '-',
                            branch: t.branch_name || '-'
                        });
                    });
                }

                // ২.২ পেমেন্ট (সঞ্চয় জমা)
                const { data: payments } = await supabaseClient
                    .from('payments')
                    .select('*')
                    .eq('member_id', member.member_id)
                    .eq('status', 'approved')
                    .gte('submitted_at', startDate)
                    .lte('submitted_at', endDate)
                    .order('submitted_at', { ascending: false });

                if (payments) {
                    payments.forEach(p => {
                        transactions.push({
                            date: p.submitted_at,
                            time: p.submitted_at ? new Date(p.submitted_at).toTimeString().slice(0, 5) : '',
                            type: 'savings',
                            typeLabel: '💰 সঞ্চয় জমা',
                            typeClass: 'savings',
                            category: `সঞ্চয় ${p.month || ''} ${p.year || ''}`,
                            amount: Number(p.amount) || 0,
                            voucher: p.transaction_id || '-',
                            bank: p.payment_method || '-',
                            note: p.note || `পেমেন্ট পদ্ধতি: ${p.payment_method || 'cash'}`,
                            isCredit: true,
                            source: 'সঞ্চয়',
                            entered_by: p.approved_by || '-',
                            branch: p.branch_name || '-'
                        });
                    });
                }

                // ২.৩ উত্তোলন
                const { data: withdrawals } = await supabaseClient
                    .from('withdrawals')
                    .select('*')
                    .eq('member_id', member.member_id)
                    .eq('status', 'approved')
                    .gte('requested_at', startDate)
                    .lte('requested_at', endDate)
                    .order('requested_at', { ascending: false });

                if (withdrawals) {
                    withdrawals.forEach(w => {
                        let typeLabel = '💸 উত্তোলন';
                        let typeClass = 'withdrawal';
                        let category = w.type || 'মূলধন উত্তোলন';
                        
                        if (category.includes('রেফারেল')) {
                            typeLabel = '🎁 রেফারেল উত্তোলন';
                            typeClass = 'referral';
                        } else if (category.includes('লভ্যাংশ')) {
                            typeLabel = '📊 লভ্যাংশ উত্তোলন';
                            typeClass = 'profit';
                        } else if (category.includes('মূলধন')) {
                            typeLabel = '💸 মূলধন উত্তোলন';
                            typeClass = 'withdrawal';
                        }
                        
                        transactions.push({
                            date: w.requested_at,
                            time: w.requested_at ? new Date(w.requested_at).toTimeString().slice(0, 5) : '',
                            type: 'withdrawal',
                            typeLabel: typeLabel,
                            typeClass: typeClass,
                            category: category,
                            amount: Number(w.amount) || 0,
                            voucher: w.transaction_id || '-',
                            bank: w.payment_method || '-',
                            note: w.note || `পেমেন্ট পদ্ধতি: ${w.payment_method || 'cash'}`,
                            isCredit: false,
                            source: 'উত্তোলন',
                            entered_by: w.approved_by || '-',
                            branch: w.branch_name || '-'
                        });
                    });
                }

                // ২.৪ লোন
                const { data: loans } = await supabaseClient
                    .from('loan_applications')
                    .select('*')
                    .eq('member_id', member.member_id)
                    .eq('status', 'approved')
                    .gte('submitted_at', startDate)
                    .lte('submitted_at', endDate)
                    .order('submitted_at', { ascending: false });

                if (loans) {
                    loans.forEach(l => {
                        transactions.push({
                            date: l.submitted_at,
                            time: l.submitted_at ? new Date(l.submitted_at).toTimeString().slice(0, 5) : '',
                            type: 'loan',
                            typeLabel: '🏦 লোন প্রাপ্ত',
                            typeClass: 'loan',
                            category: l.loan_type || 'সাধারণ লোন',
                            amount: Number(l.amount) || 0,
                            voucher: `LN-${l.id}`,
                            bank: '-',
                            note: `লোনের ধরন: ${l.loan_type || 'সাধারণ'}, মেয়াদ: ${l.duration_months || 0} মাস`,
                            isCredit: true,
                            source: 'লোন',
                            entered_by: l.approved_by || '-',
                            branch: l.branch_name || '-'
                        });
                    });
                }

                // ২.৫ লোন পেমেন্ট
                const { data: loanPayments } = await supabaseClient
                    .from('loan_payments')
                    .select('*, loan_applications!inner(loan_type, member_id)')
                    .eq('loan_applications.member_id', member.member_id)
                    .eq('status', 'approved')
                    .gte('payment_date', startDate)
                    .lte('payment_date', endDate)
                    .order('payment_date', { ascending: false });

                if (loanPayments) {
                    loanPayments.forEach(lp => {
                        const amount = lp.total_amount || lp.emi_amount || 0;
                        transactions.push({
                            date: lp.payment_date,
                            time: lp.payment_date ? new Date(lp.payment_date).toTimeString().slice(0, 5) : '',
                            type: 'loan_payment',
                            typeLabel: '📥 লোন কিস্তি পরিশোধ',
                            typeClass: 'loan_payment',
                            category: `লোন কিস্তি #${lp.installment_no || '-'}`,
                            amount: Number(amount) || 0,
                            voucher: lp.transaction_id || '-',
                            bank: lp.payment_method || '-',
                            note: `লোন আইডি: ${lp.loan_id}, কিস্তি: ${lp.installment_no || '-'}`,
                            isCredit: false,
                            source: 'লোন পরিশোধ',
                            entered_by: lp.approved_by || '-',
                            branch: lp.branch_name || '-'
                        });
                    });
                }

                // ২.৬ রেফারেল বোনাস
                if (member.referral_bonus > 0) {
                    transactions.push({
                        date: member.created_at || new Date().toISOString(),
                        time: '',
                        type: 'referral_bonus',
                        typeLabel: '🎁 রেফারেল বোনাস',
                        typeClass: 'referral',
                        category: 'রেফারেল বোনাস প্রাপ্ত',
                        amount: Number(member.referral_bonus) || 0,
                        voucher: '-',
                        bank: '-',
                        note: 'রেফারেল বোনাস',
                        isCredit: true,
                        source: 'রেফারেল',
                        entered_by: 'সিস্টেম',
                        branch: '-'
                    });
                }

                // ২.৭ লভ্যাংশ
                if (member.profit_balance_savings > 0) {
                    transactions.push({
                        date: member.created_at || new Date().toISOString(),
                        time: '',
                        type: 'profit',
                        typeLabel: '📊 সঞ্চয় লভ্যাংশ',
                        typeClass: 'profit',
                        category: 'সঞ্চয় থেকে লভ্যাংশ',
                        amount: Number(member.profit_balance_savings) || 0,
                        voucher: '-',
                        bank: '-',
                        note: 'সঞ্চয় থেকে লভ্যাংশ প্রাপ্ত',
                        isCredit: true,
                        source: 'লভ্যাংশ',
                        entered_by: 'সিস্টেম',
                        branch: '-'
                    });
                }
                if (member.profit_balance_investment > 0) {
                    transactions.push({
                        date: member.created_at || new Date().toISOString(),
                        time: '',
                        type: 'profit',
                        typeLabel: '📊 বিনিয়োগ লভ্যাংশ',
                        typeClass: 'profit',
                        category: 'বিনিয়োগ থেকে লভ্যাংশ',
                        amount: Number(member.profit_balance_investment) || 0,
                        voucher: '-',
                        bank: '-',
                        note: 'বিনিয়োগ থেকে লভ্যাংশ প্রাপ্ত',
                        isCredit: true,
                        source: 'লভ্যাংশ',
                        entered_by: 'সিস্টেম',
                        branch: '-'
                    });
                }
                if (member.profit_balance_referral > 0) {
                    transactions.push({
                        date: member.created_at || new Date().toISOString(),
                        time: '',
                        type: 'profit',
                        typeLabel: '📊 রেফারেল লভ্যাংশ',
                        typeClass: 'profit',
                        category: 'রেফারেল থেকে লভ্যাংশ',
                        amount: Number(member.profit_balance_referral) || 0,
                        voucher: '-',
                        bank: '-',
                        note: 'রেফারেল থেকে লভ্যাংশ প্রাপ্ত',
                        isCredit: true,
                        source: 'লভ্যাংশ',
                        entered_by: 'সিস্টেম',
                        branch: '-'
                    });
                }

                let filtered = transactions;
                if (typeFilter !== 'all') {
                    filtered = filtered.filter(t => t.type === typeFilter);
                }
                filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

                allTransactions = filtered;
                renderStatement(member, filtered);

            } catch(e) {
                console.error('Statement error:', e);
                container.innerHTML = `
                    <div class="card">
                        <div class="text-center text-red-500 py-8">
                            <i class="fas fa-exclamation-circle text-4xl block mb-3"></i>
                            <p class="text-lg font-medium">❌ লোড করতে সমস্যা!</p>
                            <p class="text-sm text-gray-400 mt-2">${e.message || 'অজানা ত্রুটি'}</p>
                            <button onclick="loadStatement()" class="btn btn-info mt-4">পুনরায় চেষ্টা করুন</button>
                        </div>
                    </div>
                `;
            }
        }

        // ============================================================
        // ✅ রেন্ডার স্টেটমেন্ট - জমা ও উত্তোলন আলাদা কলাম
        // ============================================================
        function renderStatement(member, transactions) {
            const container = document.getElementById('statementContent');

            let totalIncome = 0, totalExpense = 0, totalSavings = 0, totalWithdrawal = 0;
            let totalLoan = 0, totalLoanPayment = 0, totalReferral = 0, totalProfit = 0;

            transactions.forEach(t => {
                const amt = t.amount || 0;
                if (t.isCredit) {
                    totalIncome += amt;
                    if (t.type === 'savings') totalSavings += amt;
                    else if (t.type === 'loan') totalLoan += amt;
                    else if (t.type === 'referral_bonus') totalReferral += amt;
                    else if (t.type === 'profit') totalProfit += amt;
                } else {
                    totalExpense += amt;
                    if (t.type === 'withdrawal') totalWithdrawal += amt;
                    else if (t.type === 'loan_payment') totalLoanPayment += amt;
                }
            });

            const netBalance = totalIncome - totalExpense;
            const currentBalance = member.balance || 0;

            let statusText = '✅ সক্রিয়';
            let statusClass = 'status-active';
            if (member.status === 'pending') { statusText = '⏳ পেন্ডিং'; statusClass = 'status-pending'; }
            else if (member.status === 'inactive' || member.status === 'deleted') { statusText = '❌ নিষ্ক্রিয়'; statusClass = 'status-inactive'; }

            const joinDate = member.created_at ? formatDateOnlyEnglish(member.created_at) : '-';

            let html = `
                <!-- ===== সদস্য প্রোফাইল ===== -->
                <div class="member-profile mb-4">
                    <div class="profile-name">${member.full_name}</div>
                    <div class="profile-grid">
                        <div class="item"><span class="profile-label">🆔 সদস্য আইডি</span><span class="profile-value">${member.member_id}</span></div>
                        <div class="item"><span class="profile-label">📱 মোবাইল</span><span class="profile-value">${member.mobile || '-'}</span></div>
                        <div class="item"><span class="profile-label">📍 জেলা</span><span class="profile-value">${member.present_district || '-'}</span></div>
                        <div class="item"><span class="profile-label">📅 সদস্য হওয়ার তারিখ</span><span class="profile-value">${joinDate}</span></div>
                        <div class="item"><span class="profile-label">📋 সদস্য ধরন</span><span class="profile-value">${member.member_type || 'সাধারণ সদস্য'}</span></div>
                        <div class="item"><span class="profile-label">📊 মাসিক সঞ্চয়</span><span class="profile-value">${(member.monthly_savings || 0).toLocaleString()} টাকা</span></div>
                        <div class="item"><span class="profile-label">✅ স্ট্যাটাস</span><span class="profile-value"><span class="status-badge ${statusClass}">${statusText}</span></span></div>
                        <div class="item"><span class="profile-label">🏦 বর্তমান ব্যালেন্স</span><span class="profile-value amount">${formatAmountWithText(currentBalance)}</span></div>
                    </div>
                </div>

                <!-- ===== সারাংশ কার্ড ===== -->
                <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4">
                    <div class="summary-card income"><div class="number">${formatAmountWithText(totalIncome)}</div><div class="label">📈 মোট আয়</div></div>
                    <div class="summary-card expense"><div class="number">${formatAmountWithText(totalExpense)}</div><div class="label">📉 মোট ব্যয়</div></div>
                    <div class="summary-card balance"><div class="number" style="color:${netBalance >= 0 ? '#059669' : '#dc2626'}">${formatAmountWithText(netBalance)}</div><div class="label">💰 নেট ব্যালেন্স</div></div>
                    <div class="summary-card count"><div class="number">${transactions.length}</div><div class="label">📊 মোট লেনদেন</div></div>
                    <div class="summary-card current"><div class="number">${formatAmountWithText(currentBalance)}</div><div class="label">🏦 বর্তমান ব্যালেন্স</div></div>
                </div>

                <!-- ===== বিভাগ ভিত্তিক যোগফল ===== -->
                <div class="category-summary mb-3">
                    <div class="cat-item"><span class="cat-label">💰 সঞ্চয় জমা</span><span class="cat-value" style="color:#059669;">${formatAmountWithText(totalSavings)}</span></div>
                    <div class="cat-item"><span class="cat-label">💸 উত্তোলন</span><span class="cat-value" style="color:#dc2626;">${formatAmountWithText(totalWithdrawal)}</span></div>
                    <div class="cat-item"><span class="cat-label">🏦 লোন প্রাপ্ত</span><span class="cat-value" style="color:#2563eb;">${formatAmountWithText(totalLoan)}</span></div>
                    <div class="cat-item"><span class="cat-label">📥 লোন পরিশোধ</span><span class="cat-value" style="color:#2563eb;">${formatAmountWithText(totalLoanPayment)}</span></div>
                    <div class="cat-item"><span class="cat-label">🎁 রেফারেল</span><span class="cat-value" style="color:#d97706;">${formatAmountWithText(totalReferral)}</span></div>
                    <div class="cat-item"><span class="cat-label">📊 লভ্যাংশ</span><span class="cat-value" style="color:#7c3aed;">${formatAmountWithText(totalProfit)}</span></div>
                </div>
            `;

            if (transactions.length === 0) {
                html += `
                    <div class="text-center text-gray-400 py-8">
                        <i class="fas fa-inbox text-4xl block mb-3"></i>
                        <p>কোনো লেনদেন নেই</p>
                    </div>
                `;
            } else {
                html += `
                    <div class="table-scroll">
                        <table class="data-table" id="statementTable">
                            <thead>
                                <tr>
                                    <th style="min-width:140px;">📅 তারিখ ও সময়</th>
                                    <th style="min-width:130px;">📋 লেনদেনের ধরন</th>
                                    <th style="min-width:150px;">📂 খাত/বিবরণ</th>
                                    <th style="min-width:120px; text-align:right;">📥 জমা (টাকা)</th>
                                    <th style="min-width:120px; text-align:right;">📤 উত্তোলন (টাকা)</th>
                                    <th style="min-width:130px;">🔢 ভাউচার/আইডি</th>
                                    <th style="min-width:100px;">🏦 ব্যাংক</th>
                                    <th style="min-width:80px;">👤 এন্ট্রি</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                let totalDepositCol = 0;
                let totalWithdrawalCol = 0;

                transactions.forEach((t, index) => {
                    const isCredit = t.isCredit;
                    const amt = t.amount || 0;
                    const depositAmount = isCredit ? amt : 0;
                    const withdrawalAmount = !isCredit ? amt : 0;
                    
                    totalDepositCol += depositAmount;
                    totalWithdrawalCol += withdrawalAmount;

                    const rowClass = index % 2 === 0 ? '' : 'bg-gray-50/50';

                    html += `
                        <tr class="${rowClass}">
                            <td class="text-xs whitespace-nowrap">${formatDateEnglish(t.date)}</td>
                            <td><span class="tx-badge ${t.typeClass}">${t.typeLabel}</span></td>
                            <td class="text-sm">${t.category || '-'}</td>
                            <td class="text-right font-bold ${depositAmount > 0 ? 'text-emerald-600' : 'text-gray-300'}">${depositAmount > 0 ? formatAmountWithText(depositAmount) : '-'}</td>
                            <td class="text-right font-bold ${withdrawalAmount > 0 ? 'text-red-600' : 'text-gray-300'}">${withdrawalAmount > 0 ? formatAmountWithText(withdrawalAmount) : '-'}</td>
                            <td class="text-xs font-mono">${t.voucher || '-'}</td>
                            <td class="text-sm">${t.bank || '-'}</td>
                            <td class="text-sm">${t.entered_by || '-'}</td>
                        </tr>
                    `;
                });

                html += `
                            <tr class="total-row">
                                <td colspan="3" class="text-left font-bold">📊 মোট যোগফল</td>
                                <td class="text-right font-bold text-emerald-600">${formatAmountWithText(totalDepositCol)}</td>
                                <td class="text-right font-bold text-red-600">${formatAmountWithText(totalWithdrawalCol)}</td>
                                <td colspan="3"></td>
                            </tr>
                            <tr class="net-row">
                                <td colspan="3" class="text-left text-lg font-bold">🏦 বর্তমান ব্যালেন্স</td>
                                <td colspan="2" class="text-left text-lg font-bold text-emerald-600">${formatAmountWithText(currentBalance)}</td>
                                <td colspan="3"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                `;

                html += `
                    <div class="action-buttons no-print">
                        <button onclick="printStatement()" class="btn btn-purple">
                            <i class="fas fa-print mr-1"></i> 🖨️ প্রিন্ট
                        </button>
                        <button onclick="shareStatement()" class="btn btn-info">
                            <i class="fas fa-share-alt mr-1"></i> 📤 শেয়ার
                        </button>
                        <button onclick="downloadPDF()" class="btn btn-success">
                            <i class="fas fa-file-pdf mr-1"></i> 📄 PDF ডাউনলোড
                        </button>
                    </div>
                `;

                html += `
                    <div class="text-xs text-gray-400 mt-3 text-right border-t pt-2">
                        📅 রিপোর্ট জেনারেটেড: ${formatDateEnglish(new Date().toISOString())}
                        ${document.getElementById('filterFromDate').value ? ` | 📅 ${formatDateOnlyEnglish(document.getElementById('filterFromDate').value)} থেকে` : ''}
                        ${document.getElementById('filterToDate').value ? ` ${formatDateOnlyEnglish(document.getElementById('filterToDate').value)} পর্যন্ত` : ''}
                        ${document.getElementById('filterType').value !== 'all' ? ` | 📋 ${document.getElementById('filterType').value} ফিল্টার করা` : ''}
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        // ============================================================
        // ✅ গ্লোবাল এক্সপোজ
        // ============================================================
        window.loadStatement = loadStatement;
        window.resetFilters = resetFilters;
        window.printStatement = printStatement;
        window.shareStatement = shareStatement;
        window.downloadPDF = downloadPDF;
        window.toggleTheme = toggleTheme;
        window.showToast = showToast;

        console.log('✅ স্টেটমেন্ট পেজ লোড সম্পূর্ণ!');
    </script>
</body>
</html>
